  /business-signal-sources/changes:
    post:
      tags:
        - Business Signal Sources
      summary: Propose registering or revoking a business signal source
      operationId: proposeBusinessSignalSourceChange
      description: |
        Proposes connecting a business system, any system that owns facts a policy needs (an ERP, an
        order system, a CRM, a ledger), so Parmana can ask it instead of trusting the agent's claim.
        `register` names the source, the HTTPS endpoint Parmana asks, optionally a timeout, and optionally
        the Ed25519 public key the source signs its answers with; `revoke` ends the active registration
        for a name. Nothing changes until a different person approves it. The endpoint must be `https`,
        name a domain (not an IP address or localhost), carry no user name, password or fragment, and
        resolve only to public addresses; the address is checked again on approval and at every query.
        To move a source, revoke it, then register the new endpoint. Needs a human key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/propose-business-signal-source-change-request.schema.json"
            examples:
              register:
                summary: "Real captured request"
                value:
                  {
                    "action": "register",
                    "name": "erp",
                    "endpointUrl": "https://orders.example.com/parmana/signals",
                    "timeoutMs": 5000,
                    "publicKeyPem": "-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAsgWd/PtRf9OsENif9bgJegghUpmEOOZN5NROxc3zpPc=\n-----END PUBLIC KEY-----\n",
                    "keyId": "erp-2026-10",
                    "reason": "Release goods only against invoices the ERP says are paid.",
                  }
              revoke:
                summary: "Real captured request"
                value:
                  {
                    "action": "revoke",
                    "name": "erp",
                    "reason": "The ERP moves to a new host.",
                  }
      responses:
        "201":
          description: "Proposed and waiting for a checker. Keep the `changeId`."
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/business-signal-source-change-response.schema.json"
              examples:
                register:
                  summary: "Real captured response"
                  value:
                    {
                      "changeId": "5ba7d3a6-d56d-4e90-b588-402d44aeee0c",
                      "action": "register",
                      "name": "erp",
                      "endpointUrl": "https://orders.example.com/parmana/signals",
                      "timeoutMs": 5000,
                      "publicKeyPem": "-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAsgWd/PtRf9OsENif9bgJegghUpmEOOZN5NROxc3zpPc=\n-----END PUBLIC KEY-----\n",
                      "keyId": "erp-2026-10",
                      "reason": "Release goods only against invoices the ERP says are paid.",
                      "proposedBy": "source-maker",
                      "proposedAt": "2026-10-11T02:58:24.725Z",
                      "status": "PENDING_APPROVAL",
                    }
                revoke:
                  summary: "Real captured response"
                  value:
                    {
                      "changeId": "48579135-1b91-4ac1-ade4-245e7ca304a3",
                      "action": "revoke",
                      "name": "erp",
                      "reason": "The ERP moves to a new host.",
                      "proposedBy": "source-maker",
                      "proposedAt": "2026-10-11T02:58:24.789Z",
                      "status": "PENDING_APPROVAL",
                    }
        "400":
          description: "`INVALID_BUSINESS_SIGNAL_SOURCE`: a field is missing or malformed, the key is not Ed25519, a keyId comes without a key, or a revoke carries registration fields. `EXTERNAL_ENDPOINT_ADDRESS_REFUSED`: the endpoint is not https, names an IP address or localhost, resolves to an address that is not public, or does not resolve."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                badName:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "name must match ^[a-z0-9][a-z0-9-]{0,62}$, the form a policy's signalSources uses.",
                      "code": "INVALID_BUSINESS_SIGNAL_SOURCE",
                    }
                notEd25519:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "publicKeyPem must be an Ed25519 key.",
                      "code": "INVALID_BUSINESS_SIGNAL_SOURCE",
                    }
                keyIdWithoutKey:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "keyId labels a publicKeyPem; give the key too, or leave keyId out.",
                      "code": "INVALID_BUSINESS_SIGNAL_SOURCE",
                    }
                badTimeout:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "timeoutMs must be an integer from 1000 to 30000; it defaults to 10000.",
                      "code": "INVALID_BUSINESS_SIGNAL_SOURCE",
                    }
                revokeWithRegistrationFields:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "A revoke takes only action, name and reason.",
                      "code": "INVALID_BUSINESS_SIGNAL_SOURCE",
                    }
                plainHttp:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "endpointUrl must use https.",
                      "code": "EXTERNAL_ENDPOINT_ADDRESS_REFUSED",
                    }
                privateAddress:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "The endpoint host 'internal.example.com' resolves to an address that is not public (10.0.0.7).",
                      "code": "EXTERNAL_ENDPOINT_ADDRESS_REFUSED",
                    }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`NON_HUMAN_CALLER_DENIED`: this needs a human key."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                service:
                  summary: "Real captured response, a service credential"
                  value:
                    {
                      "error": "This action requires a caller credential provisioned as a verified human (credentialHolderType: USER).",
                      "code": "NON_HUMAN_CALLER_DENIED",
                    }
        "409":
          description: "`CONFLICT`: the name already has an active registration (to register) or has none (to revoke), or another change for it is pending."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                pending:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "A change for business signal source 'erp' is already pending. It must be approved or rejected first.",
                      "code": "CONFLICT",
                    }
                alreadyActive:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "Business signal source 'erp' is already registered. Revoke it first.",
                      "code": "CONFLICT",
                    }
                revokeUnregistered:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "Business signal source 'crm' is not registered.",
                      "code": "CONFLICT",
                    }

    get:
