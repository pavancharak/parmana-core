  /audit/verify:
    post:
      tags:
        - Audit
      summary: Verify a signed caller-authentication audit event
      operationId: verifyAuditEvent
      description: |
        Checks the signature of a caller authentication audit event, the record the server keeps of every
        authentication, denial and governance action. Send the event and its signature; the server reads no
        storage and needs no key. Only production audit trails sign events. See
        [Caller audit trail](/concepts/caller-audit-trail).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/audit-verify-request.schema.json"
      responses:
        "200":
          description: "The check ran. Read `valid`. A `200` alone does not mean the signature verified."
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/verify-result-response.schema.json"
              examples:
                invalid:
                  summary: Real captured response (this environment's in-memory audit sink never signs, so no genuinely valid signature is capturable here)
                  value:
                    valid: false
        "400":
          description: "The body is not an `{ event, signature }` pair."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                malformed:
                  summary: Real captured response
                  value:
                    error: "Request body must be { event, signature } (event: type, occurredAt, route; signature: algorithm, keyId, value required)."
        "429":
          $ref: "#/components/responses/RateLimited"

  /receipt:
    post:
      tags:
        - Receipts
      summary: Generate a Receipt
      operationId: generateReceipt
      description: |
        Generates a signed Receipt for a Trust Record: a compact proof of what was decided and executed,
        to hand to a person or another system. The record must have a `VERIFIED` Verification first; run
        `POST /verify`.
