        "400":
          description: "The request is malformed and nothing was stored. `businessTransactionId` is missing or not a UUID, or the trust chain does not hold together (for example `authorization.authorityId` is not `authority.authorityId`, or `metadata.businessTransactionId` differs). The message names the field."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                badUuid:
                  summary: Real captured response, malformed businessTransactionId
                  value:
                    error: businessTransactionId must be a valid UUID.

        "403":
          description: "Refused. `POLICY_DENIED`: the policy refused this request. Final for this request; nothing was released; do not resend the same facts. `CAPABILITY_NOT_ALLOWED`: your key may not invoke `intent.action`; an operator must add it to the key. No code: `authority.principalId` is missing, or your key may not act for it (it must equal your caller id, or be in the key's `allowedPrincipalIds`)."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                principalNotAllowed:
                  summary: Real captured response, principalId not permitted for this caller
                  value:
                    error: Caller is not permitted to assert this authority.principalId.
                capabilityNotAllowed:
                  summary: The key may not invoke this action
                  value:
                    error: Caller is not permitted to invoke this capability.
                    code: CAPABILITY_NOT_ALLOWED
                policyDenied:
                  summary: A policy rejected the transaction, a final decision
                  value:
                    error: >-
                      Execution rejected: Vendor payment rejected because the
                      assessed payment risk exceeds the maximum permitted threshold.
                    code: POLICY_DENIED

        "404":
          description: "`policy.name` and `policy.version` do not match a policy this server has. Ask `GET /policies/in-effect` which to declare."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                policyNotFound:
                  summary: Real captured response, unknown policy referenced by the transaction
                  value:
                    error: "Policy 'does-not-exist' version '9.9.9' was not found."

        "409":
          description: "This `businessTransactionId` was already used: nothing ran again; read the existing result with `GET /trust-records/{businessTransactionId}` or `GET /execution-intents/{businessTransactionId}`. Or `AUTHORIZATION_NO_LONGER_VALID` (RFC-0023 phase 4): decided, but at release a business fact it rested on was past its `validUntil`, or the authority grant had expired or been revoked; nothing was sent (`executionStatus: NOT_EXECUTED`), so send a new request."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                noLongerValid:
                  summary: "The response's exact form, from AuthorizationNoLongerValidError: the grant was revoked between the decision and the release"
                  value:
                    {
                      "error": 'Not released: what the authorization for business transaction ''38dcf000-99ed-43af-8666-46c63c8ada74'' rests on no longer holds (authority grant 9f3cf733-a8ed-487c-bb58-a53950388cdf is no longer the active grant of "warehouse-agent" for "erp:release-goods" (revoked or replaced)). Nothing was executed. Send a new request to be decided again.',
                      "code": "AUTHORIZATION_NO_LONGER_VALID",
                      "executionStatus": "NOT_EXECUTED",
                    }
                duplicate:
                  summary: Real captured response
                  value:
                    error: Business Transaction 'eed2a972-1bf5-4166-8472-761f76fbf1b2' already exists.

        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SigningUnavailable"
        "502":
          description: "`EXECUTION_OUTCOME_UNKNOWN`: the action was released and the connector call failed (unreachable, timed out, or answered with an error), so whether it was performed is unknown. The Execution Intent is `ERRORED`, and the response says `executionStatus: EXECUTION_UNKNOWN`. Do not resend under a new id: check the target system, then close the intent with `POST /execution-intents/{businessTransactionId}/resolve`. The message carries the ids, never the connector's own error."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                executionOutcomeUnknown:
                  summary: The action was released and the connector call failed
                  value:
                    error: >-
                      The action for business transaction
                      '38dcf000-99ed-43af-8666-46c63c8ada74' was released to
                      the execution system, but the call failed, so whether it
                      was performed is unknown. Do not retry as a new
                      transaction: check the target system, then close the
                      Execution Intent with POST
                      /execution-intents/38dcf000-99ed-43af-8666-46c63c8ada74/resolve.
                      authorizationId: 4d291c90-9e93-4a8a-b214-8cc6526fe2e3.
                    code: EXECUTION_OUTCOME_UNKNOWN
                    executionStatus: EXECUTION_UNKNOWN
        "500":
          description: "`EXECUTION_RECORD_INCOMPLETE`: the action was released but its signed record could not be produced or stored. Do not resend under a new id; an operator rebuilds the record with `POST /execution-intents/{businessTransactionId}/finalize`, which never calls the connector again. Without a code: an unexpected failure, for example a body missing a required nested object."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                executionRecordIncomplete:
                  summary: The action was released but its signed record could not be produced
                  value:
                    error: >-
                      The action for business transaction
                      'e54187e6-431f-4e1c-9c0e-ff2cb5d6d40a' was released to
                      the execution system, but its signed Execution Trust
                      Record could not be produced. Do not retry as a new
                      transaction: reconcile against the connector and the
                      execution audit events for this businessTransactionId.
                      authorizationId: 381ef27a-0955-4085-9e5d-e4223fef2986.
                    code: EXECUTION_RECORD_INCOMPLETE
                malformedBody:
                  summary: >-
                    Real captured response, valid UUID but missing required
                    nested fields (e.g. metadata); no code field, this is the
                    generic 500 handler, not a typed RuntimeError
                  value:
                    error: Internal Server Error

