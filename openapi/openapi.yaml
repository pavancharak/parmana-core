  /authority-grants/changes:
    post:
      tags:
        - Authority Grants
      summary: Propose granting or revoking an agent's authority
      operationId: proposeAuthorityGrantChange
      description: |
        Proposes per-agent authority (RFC-0023 phase 3): `grant` says the API key with `callerId` may have
        requests for `capability` decided, within `limits` on the request, until `validUntil` (at most 366
        days); `revoke` ends the active grant. Nothing changes until a different person approves it. You
        may not propose authority for your own key. Under a policy with `requireAuthorityGrant`, a request
        from a key with no grant in force, or outside its limits, is refused as `NOT_AUTHORIZED`, and one
        after `validUntil` as `AUTHORITY_EXPIRED`. To change a grant, revoke it, then grant again. Needs a
        human key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/propose-authority-grant-change-request.schema.json"
            examples:
              grant:
                summary: "Real captured request"
                value:
                  {
                    "action": "grant",
                    "callerId": "warehouse-agent",
                    "capability": "erp:release-goods",
                    "limits":
                      {
                        "parameters.amount": { "max": 100000 },
                        "parameters.currency": { "oneOf": ["INR"] },
                      },
                    "validUntil": "2026-12-30T00:00:00.000Z",
                    "reason": "The warehouse agent releases goods for paid invoices up to 100000 INR this quarter.",
                  }
              revoke:
                summary: "Real captured request"
                value:
                  {
                    "action": "revoke",
                    "callerId": "warehouse-agent",
                    "capability": "erp:release-goods",
                    "reason": "The warehouse agent's key is being rotated.",
                  }
      responses:
        "201":
          description: "Proposed and waiting for a checker. Keep the `changeId`."
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/authority-grant-change-response.schema.json"
              examples:
                grant:
                  summary: "Real captured response"
                  value:
                    {
                      "changeId": "9f3cf733-a8ed-487c-bb58-a53950388cdf",
                      "action": "grant",
                      "callerId": "warehouse-agent",
                      "capability": "erp:release-goods",
                      "limits":
                        {
                          "parameters.amount": { "max": 100000 },
                          "parameters.currency": { "oneOf": ["INR"] },
                        },
                      "validUntil": "2026-12-30T00:00:00.000Z",
                      "reason": "The warehouse agent releases goods for paid invoices up to 100000 INR this quarter.",
                      "proposedBy": "grant-maker",
                      "proposedAt": "2026-10-11T03:29:05.220Z",
                      "status": "PENDING_APPROVAL",
                    }
                revoke:
                  summary: "Real captured response"
                  value:
                    {
                      "changeId": "c7955228-f718-4f21-8ac9-c48ce907b91a",
                      "action": "revoke",
                      "callerId": "warehouse-agent",
                      "capability": "erp:release-goods",
                      "reason": "The warehouse agent's key is being rotated.",
                      "proposedBy": "grant-maker",
                      "proposedAt": "2026-10-11T03:29:05.283Z",
                      "status": "PENDING_APPROVAL",
                    }
        "400":
          description: "`INVALID_AUTHORITY_GRANT`: a field is missing or malformed, a limit is malformed, validUntil is missing, past, before validFrom or more than 366 days away, or a revoke carries grant fields."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                badCapability:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "capability must be namespace:verb, at most 128 characters, matching ^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*:[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$.",
                      "code": "INVALID_AUTHORITY_GRANT",
                    }
                badLimitPath:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "limits key 'amount' must be target or parameters.<name>.",
                      "code": "INVALID_AUTHORITY_GRANT",
                    }
                badLimit:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "limits['parameters.amount'].min must not be above its max.",
                      "code": "INVALID_AUTHORITY_GRANT",
                    }
                noExpiry:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "validUntil must be an ISO 8601 date and time.",
                      "code": "INVALID_AUTHORITY_GRANT",
                    }
                tooLong:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "A grant may last at most 366 days. Grant again when it ends.",
                      "code": "INVALID_AUTHORITY_GRANT",
                    }
                revokeWithGrantFields:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "A revoke takes only action, callerId, capability and reason.",
                      "code": "INVALID_AUTHORITY_GRANT",
                    }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`NON_HUMAN_CALLER_DENIED`: this needs a human key. `AUTHORITY_SELF_GRANT_DENIED`: the grant is for your own key."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                service:
                  summary: "Real captured response, a service credential"
                  value:
                    {
                      "error": "This action requires a caller credential provisioned as a verified human (credentialHolderType: USER).",
                      "code": "NON_HUMAN_CALLER_DENIED",
                    }
                selfGrant:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "'grant-maker' may not propose, approve or reject authority for itself.",
                      "code": "AUTHORITY_SELF_GRANT_DENIED",
                    }
        "409":
          description: "`CONFLICT`: the caller already holds a grant for the capability (to grant) or holds none (to revoke), or another change for it is pending."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                pending:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "A change for the authority of 'warehouse-agent' over 'erp:release-goods' is already pending. It must be approved or rejected first.",
                      "code": "CONFLICT",
                    }
                alreadyActive:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "'warehouse-agent' already holds a grant for 'erp:release-goods'. Revoke it first.",
                      "code": "CONFLICT",
                    }
                revokeUnknown:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "'x-agent' holds no grant for 'erp:release-goods'.",
                      "code": "CONFLICT",
                    }

    get:
      tags:
        - Authority Grants
      summary: List authority grant changes
      operationId: listAuthorityGrantChanges
      description: |
        Lists authority grant changes, newest first. A checker uses `status=PENDING_APPROVAL` to find what
        waits for review. Needs a human key.
