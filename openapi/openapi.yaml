  /policies/pending-changes/{id}/approve:
    post:
      tags:
        - Policy Governance
      summary: Approve a pending policy change (checker)
      operationId: approvePolicyChange
      description: |
        Approves a policy change, the checker's step, and puts it into effect. Checked in order: a human key,
        not the person who proposed it, and a step up authorization signed with your step up key for this
        change id and action `approve`, valid once. The policy is written and a signed approval record is
        kept before the change is marked approved, so a failure never leaves a change approved without
        effect. The next request for the bound capability must declare the approved version. See
        [Policy governance](/guides/policy-governance-maker-checker).
      parameters:
        - name: id
          description: "The `pendingPolicyChangeId` from the proposal."
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/approve-policy-change-request.schema.json"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: "Approved and in effect."
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/pending-policy-change-response.schema.json"
              examples:
                approved:
                  summary: Real captured response
                  value:
                    pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
                    policyName: openapi-capture-demo
                    policyVersion: 1.0.0
                    proposedContent:
                      policyId: openapi-capture-demo
                      policyVersion: 1.0.0
                      schemaVersion: 1.0.0
                      rules:
                        - id: always-approve
                          condition: { always: true }
                          outcome:
                            {
                              action: approve,
                              reason: OpenAPI spec capture fixture,
                            }
                    proposedBy: human-maker
                    proposedAt: "2026-09-15T03:47:13.920Z"
                    status: APPROVED
                    reason: Capture a real Pending Policy Change for the OpenAPI spec
                    resolvedBy: human-checker
                    resolvedAt: "2026-09-15T03:48:03.586Z"
        "403":
          description: "`NON_HUMAN_CALLER_DENIED` (needs a human key), `SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE` (the proposer cannot approve), or `STEP_UP_AUTHORIZATION_INVALID` (missing, expired, reused, or signed for another change, action or key; sign a new one)."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                sameActor:
                  summary: Real captured response
                  value:
                    error: "Pending Policy Change '307d8265-1171-49a4-b13f-fc3d3ae323e3' was proposed by this same caller — the proposer (maker) may not also approve or reject it (checker)."
                    code: SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE
                stepUpInvalid:
                  summary: Real captured response
                  value:
                    error: The step-up authorization envelope is missing, invalid, expired, replayed, or does not match this request.
                    code: STEP_UP_AUTHORIZATION_INVALID
        "404":
          description: "No policy change has this id."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: "Pending Policy Change '00000000-0000-0000-0000-000000000000' not found."
                    code: PENDING_POLICY_CHANGE_NOT_FOUND
        "500":
          description: "The server is misconfigured and cannot apply policy changes. The change stays pending; nothing was written."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                misconfigured:
                  summary: "Real captured response, a deployment with no PolicyChangeApprovalService"
                  value: { "error": "Internal Server Error" }

