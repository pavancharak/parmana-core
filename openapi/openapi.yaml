  /business-signal-sources/changes/{id}/approve:
    post:
      tags:
        - Business Signal Sources
      summary: Approve a business signal source change
      operationId: approveBusinessSignalSourceChange
      description: |
        Approves a business signal source change and applies it at once: `register` makes the
        registration active, so policies that name it can be evaluated; `revoke` ends it, so they are
        refused as `SOURCE_UNAVAILABLE`. For a register, the endpoint's address is checked again first.
        Checked in order: a human key, not the proposer, and a step up authorization for this change id
        and action `approve`, valid once, with the change id in `payload.pendingPolicyChangeId`.
      parameters:
        - name: id
          in: path
          required: true
          description: "The `changeId` from the proposal."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/approve-policy-change-request.schema.json"
            examples:
              stepUp:
                summary: Real captured request
                value:
                  {
                    "stepUpAuthorization":
                      {
                        "payload":
                          {
                            "version": 1,
                            "nonce": "7fd4e45b-1bda-4224-83d0-c8676cff2180",
                            "pendingPolicyChangeId": "5ba7d3a6-d56d-4e90-b588-402d44aeee0c",
                            "action": "approve",
                            "authorizedAt": "2026-10-11T02:58:24.742Z",
