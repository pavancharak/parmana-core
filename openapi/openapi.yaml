        - External Connectors
      summary: Approve an external connector change
      operationId: approveExternalConnectorChange
      description: |
        Approves an external connector change and applies it at once: `register` makes the registration
        active, `revoke` ends it. For a register, the endpoint's address is checked again first, so a DNS
        change since the proposal cannot point it at a private address. Checked in order: a human key, not
        the proposer, and a step up authorization for this change id and action `approve`, valid once, with
        the change id in `payload.pendingPolicyChangeId`. Requests for the capability are refused until a
        version of its policy is approved.
      parameters:
        - name: id
          in: path
          required: true
          description: "The `changeId` from the proposal."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/approve-policy-change-request.schema.json"
            examples:
              stepUp:
                summary: Real captured request
                value:
                  {
                    "stepUpAuthorization":
                      {
                        "payload":
                          {
                            "version": 1,
                            "nonce": "a11a41c1-651e-431e-82ef-5199791a6428",
                            "pendingPolicyChangeId": "1aa68ad8-ab5c-4beb-9ff3-7a6b1fc1ff37",
                            "action": "approve",
                            "authorizedAt": "2026-09-30T17:25:46.377Z",
                            "expiresAt": "2026-09-30T17:27:46.377Z",
                          },
                        "signature": "f7L+V1mwISUMWPZ85KqGJ2s1TaPfBiPHhwfsWjwhu2/1cSCJjP06MvgJ6eM6F01uR1T6/qT2FcHPpD/ETa+bDA==",
                        "keyId": "human-checker-step-up-key",
                        "algorithm": "ed25519",
                      },
                  }
      responses:
        "200":
          description: "Approved and applied."
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/external-connector-change-response.schema.json"
              examples:
                approved:
                  summary: Real captured response
                  value:
                    {
                      "changeId": "1aa68ad8-ab5c-4beb-9ff3-7a6b1fc1ff37",
                      "action": "register",
                      "capability": "erp:create-invoice",
                      "endpointUrl": "https://erp.example.com/parmana/release",
                      "policy": "erp-invoice",
                      "allowedParameters": ["amount", "currency", "customerId"],
                      "timeoutMs": 10000,
                      "reason": "Finance creates invoices in the ERP through Parmana from October.",
                      "proposedBy": "human-maker",
                      "proposedAt": "2026-09-30T17:25:46.316Z",
                      "status": "APPROVED",
                      "resolvedBy": "human-checker",
                      "resolvedAt": "2026-09-30T17:25:46.385Z",
                    }
                revokeApproved:
                  summary: "Real captured response, a revoke"
                  value:
                    {
                      "changeId": "d1164799-36e9-4281-878a-93d666befd42",
                      "action": "revoke",
                      "capability": "erp:create-invoice",
                      "reason": "The ERP endpoint moves to a new host.",
                      "proposedBy": "human-maker",
                      "proposedAt": "2026-09-30T19:03:21.551Z",
                      "status": "APPROVED",
                      "resolvedBy": "human-checker",
                      "resolvedAt": "2026-09-30T19:03:21.554Z",
                    }
        "400":
          description: "`EXTERNAL_ENDPOINT_ADDRESS_REFUSED`: the endpoint now resolves to an address that is not public, or does not resolve. The change stays pending; fix the DNS and approve with a new step up authorization, or reject it."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                addressChanged:
                  summary: "Real captured response, the host moved to a private address after the proposal"
                  value:
                    {
                      "error": "The endpoint host 'crm.example.com' resolves to an address that is not public (10.0.0.7).",
                      "code": "EXTERNAL_ENDPOINT_ADDRESS_REFUSED",
                    }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`NON_HUMAN_CALLER_DENIED`, `SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE` or `STEP_UP_AUTHORIZATION_INVALID`. Sign a new step up authorization for this change and action."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                sameActor:
                  summary: Real captured response
