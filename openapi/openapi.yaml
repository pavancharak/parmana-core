  /policies/validate:
    post:
      tags:
        - Policies
      summary: Validate that a Policy exists and is readable
      operationId: validatePolicy
      description: |
        Checks that this server can load a policy at a name and version, the same lookup a request uses.
        Unlike other routes, every answer, success or failure, has the shape `{ valid, errors }`; only a
        `401` uses the usual error body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/policy-validate-request.schema.json"
            examples:
              vendor-payment:
                summary: Real captured request
                value:
                  policyId: vendor-payment
                  policyVersion: 2.0.0
              notFound:
                summary: Real captured request, unknown policy
                value:
                  policyId: does-not-exist
                  policyVersion: 9.9.9
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: "The policy exists and loads."
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/policy-validate-response.schema.json"
              examples:
                vendor-payment:
                  summary: Real captured response
                  value:
                    valid: true
                    errors: []

        "400":
          description: "`policyId` or `policyVersion` is missing or empty. Checked in that order."
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/policy-validate-response.schema.json"
              examples:
                missingField:
                  summary: Real captured response
                  value:
                    valid: false
                    errors:
                      - policyVersion is required.

        "404":
          description: "No policy exists at this name and version."
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/policy-validate-response.schema.json"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    valid: false
                    errors:
                      - "Policy 'does-not-exist' version '9.9.9' was not found."

  /policies/{name}/{version}/pending-changes:
    post:
      tags:
        - Policy Governance
      summary: Propose a policy change (maker)
      operationId: proposePolicyChange
      description: |
        Proposes new content for a policy, the maker's step in maker checker governance. Nothing changes
        until a different person approves it. `{version}` is the version this proposal changes;
        `proposedContent.policyVersion` may be the same (a correction) or new (a new version). The content is
        checked as `POST /policies/validate` would, and `proposedContent.policyId` must equal `{name}`. Needs
        a human key. See [Policy lifecycle and approvals](/guides/policy-lifecycle-and-approvals).
      parameters:
        - name: name
          description: "The policy name, for example `customer-refund`. Not `.` or `..`."
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]+$"
        - name: version
          description: "The version this proposal changes, for example `1.2.0`. Not `.` or `..`."
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/propose-policy-change-request.schema.json"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: "Proposed and waiting for a checker. Keep the `pendingPolicyChangeId`."
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/pending-policy-change-response.schema.json"
              examples:
                proposed:
                  summary: Real captured response
                  value:
                    pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
                    policyName: openapi-capture-demo
                    policyVersion: 1.0.0
                    proposedContent:
                      policyId: openapi-capture-demo
                      policyVersion: 1.0.0
                      schemaVersion: 1.0.0
                      rules:
                        - id: always-approve
                          condition: { always: true }
                          outcome:
                            {
                              action: approve,
                              reason: OpenAPI spec capture fixture,
                            }
                    proposedBy: human-maker
                    proposedAt: "2026-09-15T03:47:13.920Z"
                    status: PENDING_APPROVAL
                    reason: Capture a real Pending Policy Change for the OpenAPI spec
        "400":
          description: "The name or version is malformed, `reason` is missing, or the content is not a valid policy. The message says which."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                missingReason:
                  summary: Real captured response
                  value:
                    error: reason is required.
        "403":
          description: "`NON_HUMAN_CALLER_DENIED`: this needs a human key. The attempt is recorded in the audit trail."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                nonHuman:
                  summary: Shape, derived from NonHumanCallerDeniedError source (not independently captured in this run)
                  value:
                    error: "This action requires a caller credential provisioned as a verified human (credentialHolderType: USER)."
                    code: NON_HUMAN_CALLER_DENIED

