    get:
      tags:
        - Transactions
      summary: List Business Transactions
      operationId: listTransactions
      description: |
        Lists the Business Transactions your key submitted, as a bare array with no paging metadata. Each
        item is the request as stored; for the signed outcome of each, use `GET /trust-records`. A page can hold fewer than `pageSize` items, or none, when other callers'
        transactions fall in that window, so keep paging until you have what you need.
      parameters:
        - name: page
          description: "Page number, starting at 1. Default 1."
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          description: "Items per page before filtering to your own transactions. Default 25. Maximum 100."
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          description: "page or pageSize is not a whole number in range. Nothing was read."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                pageSizeTooLarge:
                  summary: Captured from the test suite, pageSize=1000000
                  value:
                    error: pageSize must be a whole number from 1 to 100.
        "200":
          description: "Your transactions on this page. May be empty."
