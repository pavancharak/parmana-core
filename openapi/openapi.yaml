      operationId: verifyExecutionIntent
      description: |
        Checks an Execution Intent's hash and signature. Send the intent itself; the server reads no storage
        and needs no key. A valid intent proves Parmana signed it before release and that it was not changed.
        It does not prove the action ran: an intent is written before release. For the outcome, read the
        Trust Record for the same transaction.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/execution-intent-verify-request.schema.json"
      responses:
        "200":
          description: "The check ran. Read `valid`. A `200` alone does not mean the signature verified."
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/verify-result-response.schema.json"
              examples:
                valid:
                  summary: Real captured response
                  value:
                    valid: true
                altered:
                  summary: The same intent with its target changed after signing (real captured response)
                  value:
                    valid: false
        "400":
          description: "The body is not shaped like an Execution Intent."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                malformed:
                  summary: Message text from the source
                  value:
                    error: Request body must be an Execution Intent (intentId, businessTransactionId, authorizationId, intentHash, signature required).
        "429":
          $ref: "#/components/responses/RateLimited"

