                      "code": "CONFLICT",
                    }

  /sandbox/approvals:
    post:
      tags:
        - Sandbox
      summary: Get a demo approval (sandbox only)
      operationId: createSandboxApproval
      description: |
        **Sandbox only.** Returns an approval signed by the sandbox's demo approver, so you can try an approved
        request from a browser. In production a person signs every approval with their own key on their own
        machine; this route does not exist there.

        It signs only for `sandbox:receipt`, for the one `resourceId` you name (the target of the request you will
        send), valid 5 minutes. Put it in your request's `signals.approvalArtifact`. `POST /execute` checks it like
        any other approval: a trusted approver key, the signature, the capability, the resource and the expiry, and
        it accepts it once. Needs the published demo key.

        Live at `https://parmana-sandbox.vercel.app`. The request that uses it carries
        `signals: { "note": "<the same text as parameters.note>", "receiptApproved": true, "approvalArtifact": <this response> }`,
        with `target` equal to the `resourceId` you named here. The [Playground](/playground) walks through every step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/sandbox-approval-request.schema.json"
      responses:
        "201":
          description: "The signed approval. Send it as `signals.approvalArtifact` within 5 minutes; it is accepted once."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/signed-approval.schema.json"
              examples:
                approved:
                  summary: "Real captured response"
                  value:
                    {
                      "payload":
                        {
                          "version": 1,
                          "approvalId": "f328a67e-a527-4119-8617-1eadead9367d",
                          "issuer":
                            {
                              "approverId": "sandbox-demo-approver",
                              "keyId": "sandbox-demo-approver-key-1",
                            },
                          "issuedAt": "2026-10-01T11:10:57.825Z",
                          "expiresAt": "2026-10-01T11:15:57.825Z",
                          "capability": "sandbox:receipt",
                          "resourceId": "demo-order-1",
                          "scope":
                            {
                              "field": "resourceId",
                              "comparator": "eq",
                              "value": "demo-order-1",
                            },
                          "nonce": "9c199e50-746d-409f-98f4-26c319af22ae",
                        },
                      "signature":
                        {
                          "algorithm": "ed25519",
                          "keyId": "sandbox-demo-approver-key-1",
                          "value": "H5Anvojj4J3325IkJnL/SD50WEDJxhv7AafGgkSauSyQKQ6y3Fw5d+ZoC0k2BUfDDJvR0jn1IDgZ/1I+nx6ZAQ==",
                          "signedAt": "2026-10-01T11:10:57.825Z",
                        },
                    }
        "400":
          description: "`INVALID_SANDBOX_APPROVAL_REQUEST`: `capability` is not `sandbox:receipt`, or `resourceId` is missing, empty or over 200 characters. Nothing was signed."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                otherCapability:
                  summary: "Real captured response, capability paytm:refund"
                  value:
                    {
                      "error": 'The sandbox approver signs only for capability "sandbox:receipt".',
                      "code": "INVALID_SANDBOX_APPROVAL_REQUEST",
                    }
                missingResource:
                  summary: "Real captured response, no resourceId"
                  value:
                    {
                      "error": "resourceId is required: the request's target, at most 200 characters.",
                      "code": "INVALID_SANDBOX_APPROVAL_REQUEST",
                    }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  schemas:
    Error:
      $ref: "../schemas/common/error.schema.json"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      # Prefills the docs playground with the public sandbox's demo key
      # (ADR-0014): caller sandbox-visitor, allowed only sandbox:receipt.
      x-default: 2VfYWCzt_cBAPK-8uufX6ordfY2JuQhFPsohuEumKME
      description: >
        Caller API key issued by scripts/generate-api-key.ts. Sent as
        Authorization: Bearer <key>. Verified against a stored SHA-256 hash
        in constant time by packages/api/src/auth/StaticKeyAuthenticator.ts.
        Required on every route not listed as exempt in this document's
        top-level description. See /api-reference/authentication.

  responses:
    Unauthorized:
      description: "The `Authorization` header is missing, is not a bearer key, or names a key the server does not know. Nothing ran. Send a valid key."
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error.schema.json"
          examples:
            authRequired:
              summary: Real captured response, missing or invalid Authorization header
              value:
                error: authentication required
    RateLimited:
      description: "Too many requests from this caller on this route in the last minute. The default limits are 30 per caller per minute on `/execute`, 300 per IP address on `/health` and `/ready`, and 60 per IP address shared by the unauthenticated verification and handbook routes. The request never reached the handler, so nothing was recorded or executed. Wait the number of seconds in the `Retry-After` header, then retry."
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error.schema.json"
          examples:
            rateLimited:
              summary: Rate limit exceeded
              value:
                error: Rate limit exceeded. Try again later.
                code: RATE_LIMITED
    SigningUnavailable:
      description: "Refused before release: nothing was executed. `SIGNING_UNAVAILABLE`: the server could not prove it can sign a Trust Record. `AUDIT_UNAVAILABLE`: the caller audit trail could not be written. `EXECUTION_INTENT_UNAVAILABLE`: the signed Execution Intent could not be stored. For these three, retry later with a new `businessTransactionId`, because the first one was already accepted. `CONNECTOR_NOT_REGISTERED`: no connector is configured for this action on this deployment; the operator must configure it before any retry."
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error.schema.json"
          examples:
            executionIntentUnavailable:
              summary: The signed Execution Intent could not be stored, nothing was executed (real captured response)
              value:
                error: >-
                  The signed Execution Intent for business transaction
                  '2c3cae0f-fd3c-4962-8147-83f3710a2fc9' could not be created
                  and stored; refusing to release the action. Nothing was
                  executed. Cause: new row for relation "execution_intents"
                  violates check constraint "sbx_block_intents"
                code: EXECUTION_INTENT_UNAVAILABLE
            signingUnavailable:
              summary: Evidence signing is unhealthy, nothing was executed
              value:
                error: >-
                  Evidence signing is unavailable; refusing to release the
                  action because a signed Execution Trust Record could not be
                  produced. Nothing was executed.
                code: SIGNING_UNAVAILABLE
            auditUnavailable:
              summary: The caller audit trail could not be written
              value:
                error: >-
                  Caller authentication audit trail is unavailable; refusing to
                  proceed without an audit record.
                code: AUDIT_UNAVAILABLE
            connectorNotRegistered:
              summary: No connector is registered for the action, nothing was executed
              value:
                error: >-
                  No connector is registered for capability 'paytm:refund' on
                  this deployment. Nothing was executed. The operator must
                  configure the connector.
                code: CONNECTOR_NOT_REGISTERED
