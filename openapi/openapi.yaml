  /verify:
    post:
      tags:
        - Verification
      summary: Verify an Execution Trust Record
      operationId: verifyTransaction
      description: |
        Checks a Trust Record again on the server: recomputes its hash, verifies its signature and checks
        that every approved execution is bound to its authorization. All checks run and every failure is
        reported. The result is appended to the record as a new Verification. A receipt can only be
        generated after a `VERIFIED` result. To verify without trusting this server, use
        [Verify independently](/guides/verify-independently).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/verification-request.schema.json"
            examples:
              vendor-payment-flow:
                summary: Real captured request
                value:
                  businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: "The check ran. Read `status`: `VERIFIED` or `FAILED`. A `200` alone does not mean the record verified."
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/verification-response.schema.json"
              examples:
                vendor-payment-flow:
                  summary: Real captured response
                  value:
                    verificationId: 63aac300-e0a8-47e9-9bb1-fd4b7d6cfdce
                    businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                    status: VERIFIED
                    message: Execution Trust Record verified successfully.
                    verifiedAt: "2026-07-13T17:42:11.002Z"
                    trustRecordHash: e20a8861864f1a0a6c5fe00e64abca04de18a7d165a82ef9d7beb458c2096b3f

        "400":
          description: "`businessTransactionId` is missing or not a UUID."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                badUuid:
                  summary: Real captured response
                  value:
                    error: businessTransactionId must be a valid UUID.

        "404":
          description: "Your key has no Trust Record with this id."
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: Execution Trust Record not found.
                    code: VERIFICATION_FAILED

