  /execution-intents/{businessTransactionId}/finalize:
    post:
      tags:
        - Execution Intents
      summary: Rebuild the signed Trust Record for a released action
      operationId: finalizeExecutionIntent
      description: >
        Rebuilds the signed Trust Record for an action that was released but
        whose record was never

        produced, the repair for a `500` `EXECUTION_RECORD_INCOMPLETE`. It never
        calls the connector: it uses

        the result saved right after release, then verifies the record and
        generates its receipt. Safe to

        repeat: "if a record exists it returns it as `ALREADY_FINALIZED` and
        builds nothing. Needs a human key."
      parameters:
        - name: businessTransactionId
          description: The transaction's id.
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Trust Record exists. `outcome` is `FINALIZED` when this call
            built it, `ALREADY_FINALIZED` when it already existed.
