      responses:
        "201":
          description: Proposed and waiting for a checker. Keep the `changeId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/approval-issuer-change-response.schema"
              examples:
                add:
                  summary: Real captured response
                  value:
                    changeId: ba7c5827-5844-4069-94fc-9b438ef08f78
                    action: add
                    approverId: manager-priya
                    keyId: manager-priya-key-1
                    publicKeyPem: |
                      -----BEGIN PUBLIC KEY-----
                      MCowBQYDK2VwAyEAEDuWHf+bbRY7J/Mr0RVmAKYHH5CDijTWhdnISXWLD6Y=
