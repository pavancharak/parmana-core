  /business-signal-sources/changes/{id}/approve:
    post:
      tags:
        - Business Signal Sources
      summary: Approve a business signal source change
      operationId: approveBusinessSignalSourceChange
      description: >
        Approves a business signal source change and applies it at once:
        `register` makes the

        registration active, so policies that name it can be evaluated; `revoke`
        ends it, so they are

        refused as `SOURCE_UNAVAILABLE`. For a register, the endpoint's address
        is checked again first.

        Checked in order: a human key, not the proposer, and a step up
        authorization for this change id

        and action `approve`, valid once, with the change id in
        `payload.pendingPolicyChangeId`.
      parameters:
        - name: id
          in: path
          required: true
          description: The `changeId` from the proposal.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/approve-policy-change-request.schema"
            examples:
              stepUp:
                summary: Real captured request
                value:
                  stepUpAuthorization:
                    payload:
                      version: 1
                      nonce: 7fd4e45b-1bda-4224-83d0-c8676cff2180
                      pendingPolicyChangeId: 5ba7d3a6-d56d-4e90-b588-402d44aeee0c
                      action: approve
                      authorizedAt: 2026-10-11T02:58:24.742Z
                      expiresAt: 2026-10-11T03:00:24.742Z
                    signature: hP3qDu2ZHNasz1zFZBHlkxqTKT6wiP6IHgFishmbTM7P56w7Jwel5DSx8xSvxynFDDO0sART/xxFxVFFBx8hAw==
                    keyId: checker-step-up-key
                    algorithm: ed25519
      responses:
        "200":
          description: Approved and applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/business-signal-source-change-response.schema"
              examples:
                approved:
                  summary: Real captured response
                  value:
                    changeId: 5ba7d3a6-d56d-4e90-b588-402d44aeee0c
                    action: register
                    name: erp
                    endpointUrl: https://orders.example.com/parmana/signals
                    timeoutMs: 5000
                    publicKeyPem: |
                      -----BEGIN PUBLIC KEY-----
                      MCowBQYDK2VwAyEAsgWd/PtRf9OsENif9bgJegghUpmEOOZN5NROxc3zpPc=
                      -----END PUBLIC KEY-----
                    keyId: erp-2026-10
                    reason: Release goods only against invoices the ERP says are paid.
                    proposedBy: source-maker
                    proposedAt: 2026-10-11T02:58:24.725Z
                    status: APPROVED
                    resolvedBy: source-checker
                    resolvedAt: 2026-10-11T02:58:24.745Z
                revokeApproved:
                  summary: Real captured response, a revoke
                  value:
                    changeId: 92ba551c-02bb-4089-9762-6d2d3a89392e
                    action: revoke
                    name: erp
                    reason: The ERP moves to a new host.
                    proposedBy: source-maker
                    proposedAt: 2026-10-11T02:58:24.798Z
                    status: APPROVED
                    resolvedBy: source-checker
                    resolvedAt: 2026-10-11T02:58:24.800Z
        "400":
          description: "`EXTERNAL_ENDPOINT_ADDRESS_REFUSED`: the endpoint now resolves to
            an address that is not public, or does not resolve. The change stays
            pending; fix the DNS and approve with a new step up authorization,
            or reject it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                addressChanged:
                  summary: Real captured response, the host moved to a private address after the
                    proposal
                  value:
                    error: The endpoint host 'moving.example.com' resolves to an address that is not
                      public (10.0.0.7).
                    code: EXTERNAL_ENDPOINT_ADDRESS_REFUSED
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`NON_HUMAN_CALLER_DENIED`, `SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE`
            or `STEP_UP_AUTHORIZATION_INVALID`. Sign a new step up authorization
            for this change and action."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                sameActor:
                  summary: Real captured response
                  value:
                    error: Business signal source change '5ba7d3a6-d56d-4e90-b588-402d44aeee0c' was
                      proposed by this same caller — the proposer (maker) may
                      not also approve or reject it (checker).
                    code: SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE
        "404":
          description: "`BUSINESS_SIGNAL_SOURCE_CHANGE_NOT_FOUND`: no business signal
            source change has this id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: Business signal source change '00000000-0000-0000-0000-000000000000' not
                      found.
                    code: BUSINESS_SIGNAL_SOURCE_CHANGE_NOT_FOUND
        "409":
          description: "`CONFLICT`: the change is already resolved, the name now has an
            active registration (register) or no longer has one (revoke).
            Nothing was written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                alreadyResolved:
                  summary: Real captured response, the same change approved twice
                  value:
                    error: Business signal source change '5ba7d3a6-d56d-4e90-b588-402d44aeee0c' is
                      already APPROVED.
                    code: CONFLICT
