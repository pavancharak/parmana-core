  /audit/verify:
    post:
      tags:
        - Audit
      summary: Verify a signed caller-authentication audit event
      operationId: verifyAuditEvent
      description: >
        Checks the signature of a caller authentication audit event, the record
        the server keeps of every

        authentication, denial and governance action. Send the event and its
        signature; the server reads no

        storage and needs no key. Only production audit trails sign events. See

        [Caller audit trail](/concepts/caller-audit-trail).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/audit-verify-request.schema"
      responses:
        "200":
          description: The check ran. Read `valid`. A `200` alone does not mean the
            signature verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/verify-result-response.schema"
              examples:
                invalid:
                  summary: Real captured response (this environment's in-memory audit sink never
                    signs, so no genuinely valid signature is capturable here)
                  value:
                    valid: false
        "400":
          description: The body is not an `{ event, signature }` pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                malformed:
                  summary: Real captured response
                  value:
                    error: "Request body must be { event, signature } (event: type, occurredAt,
                      route; signature: algorithm, keyId, value required)."
        "429":
          $ref: "#/components/responses/RateLimited"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: >-
            # A signed audit event and its signature, as exported from
            caller_audit_events:

            curl -X POST https://parmana-api-real.vercel.app/audit/verify \
              -H "Content-Type: application/json" \
              --data @audit-event.json
        - lang: typescript
          label: TypeScript
          source: >-
            import { ParmanaClient } from "@parmana/sdk";

            import { readFileSync } from "node:fs";


            const client = new ParmanaClient({
              endpoint: "https://parmana-api-real.vercel.app",
              apiKey: process.env.PARMANA_API_KEY!,
            });


            // A signed audit event and its signature, as exported from
            caller_audit_events.

            const { event, signature } = JSON.parse(
              readFileSync("audit-event.json", "utf8"),
            );


            const valid = await client.verifyAuditEvent(event, signature);


            console.log(valid);
        - lang: python
          label: Python
          source: >-
            import json

            import os

            from datetime import datetime

            from pathlib import Path


            from parmana import ParmanaClient

            from parmana.models import Signature, SignatureAlgorithm


            client = ParmanaClient(
                endpoint="https://parmana-api-real.vercel.app",
                api_key=os.environ["PARMANA_API_KEY"],
            )


            # A signed audit event and its signature, as exported from
            caller_audit_events.

            exported = json.loads(Path("audit-event.json").read_text())


            signature = Signature(
                algorithm=SignatureAlgorithm(exported["signature"]["algorithm"]),
                key_id=exported["signature"]["keyId"],
                value=exported["signature"]["value"],
                signed_at=datetime.fromisoformat(exported["signature"]["signedAt"]),
            )


            valid = client.verify_audit_event(exported["event"], signature)


            print(valid)
