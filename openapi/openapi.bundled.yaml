  /external-connectors/changes/{id}/approve:
    post:
      tags:
        - External Connectors
      summary: Approve an external connector change
      operationId: approveExternalConnectorChange
      description: >
        Approves an external connector change and applies it at once: `register`
        makes the registration

        active, `revoke` ends it. For a register, the endpoint's address is
        checked again first, so a DNS

        change since the proposal cannot point it at a private address. Checked
        in order: a human key, not

        the proposer, and a step up authorization for this change id and action
        `approve`, valid once, with

        the change id in `payload.pendingPolicyChangeId`. Requests for the
        capability are refused until a

        version of its policy is approved.
      parameters:
        - name: id
          in: path
          required: true
          description: The `changeId` from the proposal.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/approve-policy-change-request.schema"
            examples:
              stepUp:
                summary: Real captured request
                value:
                  stepUpAuthorization:
                    payload:
