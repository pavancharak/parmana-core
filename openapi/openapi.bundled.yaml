  /policies/in-effect:
    get:
      tags:
        - Policies
      summary: Get the policy a capability's requests must declare right now
      operationId: getPolicyInEffect
      description: >
        Tells an agent what a request for a capability must declare and carry
        right now: the policy name and

        version, the policy's description, and its signals (every fact the rules
        read with its type, the

        facts that must equal a value of the intent, and the facts that need a
        signed human approval with

        what that approval must name). Call it before every `POST /execute`
        instead of hard coding a version:

        approving a new version changes the answer with no deploy. The rule
        conditions are never returned.

        Allowed for a key that may invoke the capability, and for human keys.
      parameters:
        - name: capability
          in: query
          required: true
          description: The action, as in `intent.action`, for example `paytm:refund`.
          schema:
            type: string
          example: paytm:refund
      responses:
        "200":
          description: What to declare and carry.
          content:
            application/json:
              schema:
                type: object
                required:
                  - capability
                  - policy
                  - description
                  - signals
                properties:
                  capability:
                    type: string
                  policy:
                    type: object
                    required:
                      - name
                      - version
                      - schemaVersion
                    properties:
                      name:
                        type: string
                      version:
                        type: string
                      schemaVersion:
                        type: string
                  description:
                    type:
                      - string
                      - "null"
                    description: The policy author's description for people, or null.
                  authorityGrantRequired:
                    type: boolean
                    const: true
                    description: >
                      Present only when the policy requires it. Your key needs a
                      current authority grant for this capability, made through
                      maker checker (/authority-grants), and each request must
                      be within the grant's limits.
                  signals:
                    type: object
                    description: What a request under this policy must carry.
                    required:
                      - facts
                      - schema
                      - bound
                      - approval
                    properties:
                      facts:
                        type: array
                        items:
                          type: string
                        description: Every fact the policy's rules read, sorted. Send each in the
                          request's signals.
                      schema:
                        type: object
                        additionalProperties:
                          type: string
                        description: The declared type of each signal (boolean, number, string).
                      bound:
                        type: object
                        additionalProperties:
                          type: string
                        description: >
                          Signals that must equal a value of the Intent, as
                          signal name to path (for example refundAmount to
                          parameters.amount). A mismatch is refused.
                      approval:
                        type: object
                        additionalProperties:
                          type: object
                          required:
                            - resourceId
                          properties:
                            resourceId:
                              type: string
                              description: Where the resource the approval names is in the request, target or
                                a parameters path.
                            value:
                              type: string
                              description: Where the amount the approval must cover is, when there is one.
                        description: >
                          Signals that count as true only with a signed approval
                          in signals.approvalArtifact, and what that approval
                          must name.
                      sourced:
                        type: object
                        additionalProperties:
                          type: object
                          required:
                            - source
                            - claim
                            - subject
                          properties:
                            source:
                              type: string
                              description: The registered business system the server asks.
                            claim:
                              type: string
                              description: What the server asks it.
                            subject:
                              type: string
                              description: Where the business object is in the request, target or a parameters
                                path.
                            maxAgeSeconds:
                              type: integer
                              description: How old the source's answer may be.
                        description: >
                          Present only when the policy has any. Facts the server
                          asks a business system for itself; you need not send
                          them, and a value you send that differs from the
                          source's is refused.
              examples:
                refund:
                  summary: The refund capability under customer-refund 1.2.0
                  value:
                    capability: paytm:refund
                    policy:
                      name: customer-refund
                      version: 1.2.0
                      schemaVersion: 1.0.0
                    description: Authorizes customer refunds. Every refund above 0 and up to 100000
                      needs a signed manager approval for that order, covering
                      that amount.
                    signals:
                      facts:
                        - fraudCheckPassed
                        - managerApproved
                        - refundAmount
                        - refundEligible
                      schema:
                        refundEligible: boolean
                        managerApproved: boolean
                        fraudCheckPassed: boolean
                        refundAmount: number
                      bound:
                        refundAmount: parameters.amount
                      approval:
                        managerApproved:
                          resourceId: parameters.orderId
                          value: parameters.amount
        "400":
          description: The `capability` query parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                missingCapability:
                  summary: Real captured response
                  value:
                    error: capability is required, for example ?capability=paytm:refund.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`CAPABILITY_NOT_ALLOWED`: your key may not invoke this capability."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                capabilityNotAllowed:
                  summary: Real captured response, a key allowed only slack:post-message
                  value:
                    error: Caller is not permitted to invoke this capability.
                    code: CAPABILITY_NOT_ALLOWED
        "404":
          description: "`CAPABILITY_NOT_BOUND`: no policy is bound to this capability, so
            no request for it can succeed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                capabilityNotBound:
                  summary: Real captured response
                  value:
                    error: No policy is bound to capability "test:fixture-execute".
                    code: CAPABILITY_NOT_BOUND
        "409":
          description: "`NO_APPROVED_POLICY_VERSION`: no version of the bound policy has
            been approved yet, so every request is refused. A person must
            propose and approve one."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                noApprovedVersion:
                  summary: Real captured response
                  value:
                    error: 'Every request for "paytm:refund" is refused right now: no version of
                      policy "customer-refund", which capability "paytm:refund"
                      requires, has been approved through policy governance.'
                    code: NO_APPROVED_POLICY_VERSION
        "503":
          description: "`POLICY_VERSION_UNAVAILABLE`: the version in effect could not be
            read, so every request is refused meanwhile. Retry later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                lookupFailed:
                  summary: Real captured response, the policy version store was unreachable
                  value:
                    error: 'Every request for "paytm:refund" is refused right now: the version of
                      policy "customer-refund" in effect for capability
                      "paytm:refund" could not be looked up: database
                      unreachable.'
                    code: POLICY_VERSION_UNAVAILABLE
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            curl "https://parmana-api-real.vercel.app/policies/in-effect?capability=paytm%3Arefund" \
              -H "Authorization: Bearer $PARMANA_API_KEY"
        - lang: typescript
          label: TypeScript
          source: |-
            import { ParmanaClient } from "@parmana/sdk";

            const client = new ParmanaClient({
              endpoint: "https://parmana-api-real.vercel.app",
              apiKey: process.env.PARMANA_API_KEY!,
            });

            const inEffect = await client.policyInEffect("paytm:refund");

            console.log(inEffect.policy, inEffect.signals.approval);
        - lang: python
          label: Python
          source: |-
            import os

            from parmana import ParmanaClient

            client = ParmanaClient(
                endpoint="https://parmana-api-real.vercel.app",
                api_key=os.environ["PARMANA_API_KEY"],
            )

            in_effect = client.policy_in_effect("paytm:refund")

            print(in_effect.policy, in_effect.signals.approval)
