    execution-trust-record.schema:
      title: Execution Trust Record
      description: "Canonical immutable record representing everything Parmana knows
        about a Business Transaction: the authoritative source for replay,
        verification, audit, and receipt generation. One Execution Trust Record
        exists per Business Transaction. overrides, executions, verifications,
        and receipts are append-only: existing entries are never modified or
        removed."
      type: object
      additionalProperties: true
      required:
        - trustRecordId
        - businessTransactionId
        - transaction
        - overrides
        - executions
        - verifications
        - receipts
        - trustRecordHash
        - signature
        - createdAt
        - updatedAt
      properties:
        trustRecordId:
          type: string
          description: Unique Execution Trust Record identifier.
        businessTransactionId:
          type: string
          description: Business Transaction identifier.
        transaction:
          $ref: "#/components/schemas/business-transaction.schema"
        overrides:
          type: array
          description: Override history. Append-only; empty on every transaction in this
            repository today (no route creates an Override).
          items:
            $ref: "#/components/schemas/override.schema"
        executions:
          type: array
          description: Execution history. Append-only.
          items:
            $ref: "#/components/schemas/execution.schema"
        verifications:
          type: array
          description: Verification history. Append-only.
          items:
            $ref: "#/components/schemas/verification.schema"
        receipts:
          type: array
          description: Receipt history. Append-only.
          items:
            $ref: "#/components/schemas/receipt.schema"
        trustRecordHash:
          type: string
          description: Canonical hash of the Execution Trust Record, computed over its
            canonical serialized form.
        signature:
          type: object
          description: Cryptographic signature over the canonical Execution Trust Record,
            proving it was produced by Parmana and has not been modified since
            signing.
          additionalProperties: true
          required:
            - algorithm
            - keyId
            - value
            - signedAt
          properties:
            algorithm:
              type: string
              examples:
                - ed25519
            keyId:
              type: string
              description: Identifier of the signing key.
            value:
              type: string
              description: Base64-encoded signature value.
            signedAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp when the Execution Trust Record was first created.
        updatedAt:
          type: string
          format: date-time
          description: UTC timestamp when the Execution Trust Record was last extended
            with a new immutable artifact.
        evidenceAnchor:
          type: object
          description: Explicit binding linking policy-governance provenance
            (transaction.policy.contentHash/governanceAnchor) to what a
            connector actually did (executions[].evidence.attributes.connector).
            Not a new cryptographic guarantee on its own -- both were already
            covered by trustRecordHash/signature -- but a single,
            explicitly-named pointer an auditor can check without reconstructing
            the binding themselves. Absent on a Trust Record built before this
            field existed.
          additionalProperties: false
          required:
            - anchorHash
          properties:
            policyContentHash:
              type: string
              description: Copied from transaction.policy.contentHash (G-24). Present on every
                real Execution Trust Record.
            governanceAnchorStatus:
              type: string
              enum:
                - VERIFIED
                - NO_APPROVAL_RECORD
                - SIGNATURE_INVALID
                - CONTENT_MISMATCH
              description: Copied from transaction.policy.governanceAnchor.status (G-45).
                Absent only when no governance anchor resolver was configured
                for this deployment.
            connectorEvidenceHash:
              type: string
              description: Copied from
                executions[0].evidence.attributes.connector.connectorEvidenceHash,
                when a real connector executed.
            anchorHash:
              type: string
              description: sha256 of the canonicalized {policyContentHash,
                governanceAnchorStatus, connectorEvidenceHash} above.
      examples:
        - trustRecordId: 759e916e-66d2-48c3-8869-55d557acf155
          businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
          transaction:
