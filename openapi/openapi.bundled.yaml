        "400":
          description: The request is malformed and nothing was stored.
            `businessTransactionId` is missing or not a UUID, or the trust chain
            does not hold together (for example `authorization.authorityId` is
            not `authority.authorityId`, or `metadata.businessTransactionId`
            differs). The message names the field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                badUuid:
                  summary: Real captured response, malformed businessTransactionId
                  value:
                    error: businessTransactionId must be a valid UUID.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Refused. `POLICY_DENIED`: the policy refused this request. Final
            for this request; nothing was released; do not resend the same
            facts. `CAPABILITY_NOT_ALLOWED`: your key may not invoke
            `intent.action`; an operator must add it to the key. No code:
            `authority.principalId` is missing, or your key may not act for it
            (it must equal your caller id, or be in the key's
            `allowedPrincipalIds`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                principalNotAllowed:
                  summary: Real captured response, principalId not permitted for this caller
                  value:
                    error: Caller is not permitted to assert this authority.principalId.
                capabilityNotAllowed:
                  summary: The key may not invoke this action
                  value:
                    error: Caller is not permitted to invoke this capability.
                    code: CAPABILITY_NOT_ALLOWED
                policyDenied:
                  summary: A policy rejected the transaction, a final decision
                  value:
                    error: "Execution rejected: Vendor payment rejected because the assessed payment
                      risk exceeds the maximum permitted threshold."
                    code: POLICY_DENIED
        "404":
          description: "`policy.name` and `policy.version` do not match a policy this
            server has. Ask `GET /policies/in-effect` which to declare."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                policyNotFound:
                  summary: Real captured response, unknown policy referenced by the transaction
                  value:
                    error: Policy 'does-not-exist' version '9.9.9' was not found.
        "409":
          description: "This `businessTransactionId` was already used: nothing ran again;
            read the existing result with `GET
            /trust-records/{businessTransactionId}` or `GET
            /execution-intents/{businessTransactionId}`. Or
            `AUTHORIZATION_NO_LONGER_VALID` (RFC-0023 phase 4): decided, but at
            release a business fact it rested on was past its `validUntil`, or
            the authority grant had expired or been revoked; nothing was sent
            (`executionStatus: NOT_EXECUTED`), so send a new request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                noLongerValid:
                  summary: "The response's exact form, from AuthorizationNoLongerValidError: the
                    grant was revoked between the decision and the release"
