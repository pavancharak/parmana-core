        - lang: bash
          label: cURL
          source: |-
            # Sign the step up authorization on your own machine first:
            #   npx tsx scripts/sign-policy-change-step-up.ts --private-key-file step-up.private.pem \
            #     --key-id checker-step-up-1 --pending-policy-change-id 5ba7d3a6-d56d-4e90-b588-402d44aeee0c --action approve > step-up.json
            curl -X POST https://parmana-api-real.vercel.app/business-signal-sources/changes/5ba7d3a6-d56d-4e90-b588-402d44aeee0c/approve \
              -H "Authorization: Bearer $PARMANA_API_KEY" \
              -H "Content-Type: application/json" \
              --data "{\"stepUpAuthorization\": $(cat step-up.json)}"
        - lang: typescript
          label: TypeScript
          source: >-
            import { ParmanaClient, signPolicyChangeStepUp } from
            "@parmana/sdk";

            import { readFileSync } from "node:fs";


            const client = new ParmanaClient({
              endpoint: "https://parmana-api-real.vercel.app",
              apiKey: process.env.PARMANA_API_KEY!,
            });


            const stepUp = signPolicyChangeStepUp({
              pendingPolicyChangeId: "5ba7d3a6-d56d-4e90-b588-402d44aeee0c",
              action: "approve",
              privateKeyPem: readFileSync("step-up.private.pem", "utf8"),
              keyId: "checker-step-up-1",
            });


            const change = await client.approveBusinessSignalSourceChange(
              "5ba7d3a6-d56d-4e90-b588-402d44aeee0c",
