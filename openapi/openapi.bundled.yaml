openapi: 3.1.0
info:
  title: Parmana API
  version: 1.0.0
  description: >
    Parmana sits between an AI agent and the systems it acts on. An agent sends
    a Business Transaction: who

    authorized it, what action it wants, and the facts that justify it. Parmana
    evaluates the policy bound to

    the action, checks any signed human approval the policy requires, releases
    the action to the connector

    only if the policy approves, and returns a signed Execution Trust Record
    anyone can verify.


    **Authentication.** Send `Authorization: Bearer <key>` on every request. The
    only routes that need no key

    are the probes, the documents and the independent verification routes: `GET
    /health`, `GET /ready`,

    `GET /openapi.yaml`, `GET /openapi.json`, `GET /api-manifest.json`, `GET
    /documentation`,

    `GET /reference`, `GET /parmana-handbook.pdf`, `GET
    /handbook/download-leads`,

    `POST /handbook/download-leads`, `POST /refusal/verify`, `POST
    /execution-intents/verify`,

    `POST /audit/verify`, `GET /keys/{keyId}` and `GET /.well-known/jwks.json`.
    A missing or unknown key

    returns `401` before anything else runs. The server holds only a hash of
    each key. See

    [Authentication](/api-reference/authentication).


    **Two kinds of key.** An agent or service key may invoke only the
    capabilities listed on it. A human key

    (`credentialHolderType: USER`) is required for governance: proposing and
    approving policies, approvers

    and external connectors, and repairing Execution Intents. Approving or
    rejecting a change also needs a

    step up authorization signed with the checker's own step up key, and the
    checker must not be the

    person who proposed it.


    **Ownership.** Every lookup by `businessTransactionId` is scoped to the key
    that submitted the

    transaction. A transaction submitted by another key returns the same `404`
    as one that does not exist.


    **Try it live.** The first server below is the public sandbox,
    `https://parmana-sandbox.vercel.app`: the same

    code as production with its own database, keys and demo approver, whose one
    action, `sandbox:receipt`,

    acts on nothing. Every "Try it" panel calls it with the published demo key
    prefilled. The demo key may

    invoke only `sandbox:receipt`, so other capabilities return `403` and
    governance routes return

    `403 NON_HUMAN_CALLER_DENIED`. Everything sent to the sandbox is visible to
    every visitor. See

    [Playground](/playground). Production needs a key issued by its operator.


    **Start here:** the [Playground](/playground) (no install), the
    [Quickstart](/quickstart), then [Integrate Parmana](/agents/integrate) for
    agents

    and [Connect any external system](/guides/connect-any-external-system) for
    your own endpoint.
  contact:
    name: Parmana Systems
    email: founder@parmanasystems.com
  license:
    name: Proprietary, source-available for evaluation only, see LICENSE
    url: https://github.com/pavancharak/parmana/blob/main/LICENSE
servers:
  - url: https://parmana-sandbox.vercel.app
    description: Public sandbox (the docs playground). Same code as production, demo
      data only, acts on nothing. Demo key prefilled.
  - url: https://parmana-api-real.vercel.app
    description: Production. Needs a key issued by the operator.
  - url: http://localhost:3000
    description: Local (packages/api, PORT env var, default 3000)
security:
  - bearerAuth: []
tags:
  - name: Execution
    description: Executes a Business Transaction through the complete Execution
      Trust pipeline
  - name: Transactions
    description: Business Transaction creation and retrieval
  - name: Verification
    description: Deterministic verification of an Execution Trust Record
  - name: Receipts
    description: Cryptographically signed Execution Trust Receipts
  - name: Trust Records
    description: Execution Trust Record retrieval
  - name: Replay
    description: Deterministic replay of a recorded Execution Trust Record
  - name: Policies
    description: Policy existence/readability check
  - name: Policy Governance
    description: Maker-checker proposal, listing, approval, and rejection of policy changes
  - name: Approvers
    description: Maker-checker for the keys trusted to sign approvals, without a deploy
  - name: External Connectors
    description: Maker-checker for binding a capability to an operator's HTTPS
      endpoint and its policy, without a deploy (ADR-0013)
  - name: Business Signal Sources
    description: Maker-checker for the business systems Parmana asks for the facts a
      policy needs, without a deploy (RFC-0023)
  - name: Authority Grants
    description: Maker-checker for which agent may have which action decided, within
      which limits, until when (RFC-0023)
  - name: Sandbox
    description: Routes that exist only on the public sandbox (ADR-0014), for trying
      Parmana from a browser
  - name: Refusal Records
    description: Durable, signed evidence that a policy decision rejected a
      transaction (RFC-0021)
  - name: Execution Intents
    description: A signed statement, stored before an action is released, of exactly
      what is about to be released, plus the operator tools to find and repair a
      released action that has no signed Trust Record (ADR-0012)
  - name: Audit
    description: Signed caller-authentication audit events, independently
      third-party-verifiable
  - name: System
    description: Operational endpoints
paths:
  /:
    get:
      tags:
        - System
      summary: Root
      operationId: getRoot
      description: >
        Returns the service name and `UP`. Use it to check that your key is
        accepted: unlike `GET /health`,

        this route requires a key.
      responses:
        "200":
          description: The key is valid and the service is responding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/root-response.schema"
              examples:
                root:
                  summary: Real captured response
                  value:
                    name: Parmana
                    status: UP
        "401":
          $ref: "#/components/responses/Unauthorized"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            curl https://parmana-api-real.vercel.app/ \
              -H "Authorization: Bearer $PARMANA_API_KEY"
        - lang: typescript
          label: TypeScript
          source: >-
            const response = await fetch("https://parmana-api-real.vercel.app/",
            {
              headers: { Authorization: `Bearer ${process.env.PARMANA_API_KEY}` },
            });


            console.log(response.status, await response.json());
        - lang: python
          label: Python
          source: >-
            import os


            import requests


            response = requests.get(
                "https://parmana-api-real.vercel.app/",
                headers={"Authorization": f"Bearer {os.environ['PARMANA_API_KEY']}"},
                timeout=30,
            )


            print(response.status_code, response.json())
  /health:
    get:
      tags:
        - System
      summary: Health check
      operationId: getHealth
      description: >
        Liveness probe. Always returns `UP` while the process is serving
        requests; it checks no dependency.

        Needs no key. For a check that includes storage, use `GET /ready`.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/health-response.schema"
              examples:
                health:
                  summary: Real captured response
                  value:
                    status: UP
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl https://parmana-api-real.vercel.app/health
        - lang: typescript
          label: TypeScript
          source: |-
            import { ParmanaClient } from "@parmana/sdk";

            const client = new ParmanaClient({
              endpoint: "https://parmana-api-real.vercel.app",
              apiKey: process.env.PARMANA_API_KEY!,
            });

            const health = await client.health();

            console.log(health.status);
        - lang: python
          label: Python
          source: |-
            import os

            from parmana import ParmanaClient

            client = ParmanaClient(
                endpoint="https://parmana-api-real.vercel.app",
                api_key=os.environ["PARMANA_API_KEY"],
            )

            health = client.health()

            print(health["status"])
  /ready:
    get:
      tags:
        - System
      summary: Readiness check
      operationId: getReady
      description: >
        Readiness probe. When storage is Postgres, it runs `SELECT 1` so an
        orchestrator can tell a process

        that is up but cannot reach its database from one that can serve
        traffic. With in memory storage

        there is nothing to check and it always returns `READY`. Needs no key.
      security: []
      responses:
        "200":
          description: Ready to serve traffic. `authDisabled` says whether caller
            authentication is off on this deployment, which must never be true
            in production.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ready-response.schema"
              examples:
                authEnabled:
                  summary: Real captured response
                  value:
                    status: READY
                    storage: not-supabase-backed
                    authDisabled: false
                authDisabled:
                  summary: Real captured response
                  value:
                    status: READY
                    storage: not-supabase-backed
                    authDisabled: true
                    warning: PARMANA_AUTH_DISABLED=true -- this deployment is accepting requests
                      with no caller authentication. Must never be set in a real
                      deployment.
        "503":
          description: Postgres storage is configured but could not be reached. Requests
            that need storage will fail until it recovers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ready-response.schema"
              examples:
                notReady:
                  summary: Shape, not a live capture
                  value:
                    status: NOT_READY
                    reason: connect ECONNREFUSED 127.0.0.1:5432
                    authDisabled: false
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl https://parmana-api-real.vercel.app/ready
        - lang: typescript
          label: TypeScript
          source: >-
            const response = await
            fetch("https://parmana-api-real.vercel.app/ready");


            console.log(response.status, await response.json());
        - lang: python
          label: Python
          source: |-
            import requests

            response = requests.get(
                "https://parmana-api-real.vercel.app/ready",
                timeout=30,
            )

            print(response.status_code, response.json())
  /openapi.yaml:
    get:
      tags:
        - System
      summary: Get the OpenAPI spec
      operationId: getOpenApiSpec
      description: >
        This API's complete OpenAPI 3.1 document as YAML, self contained with no
        external references. Needs

        no key, so a client can discover the API before it has one. Load it into
        a code generator, Postman or

        an agent. `GET /openapi.json` serves the same document as JSON.
      security: []
      responses:
        "200":
          description: The OpenAPI document, YAML.
          content:
            application/yaml:
              schema:
                type: string
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl https://parmana-api-real.vercel.app/openapi.yaml
        - lang: typescript
          label: TypeScript
          source: |-
            const response = await fetch(
              "https://parmana-api-real.vercel.app/openapi.yaml",
            );

            console.log(response.status, await response.text());
        - lang: python
          label: Python
          source: |-
            import requests

            response = requests.get(
                "https://parmana-api-real.vercel.app/openapi.yaml",
                timeout=30,
            )

            print(response.status_code, response.text)
  /openapi.json:
    get:
      tags:
        - System
      summary: Get the OpenAPI spec, as JSON
      operationId: getOpenApiSpecJson
      description: >
        The same document as `GET /openapi.yaml`, as JSON, for tools and agents
        that expect a spec at a

        `.json` path. Needs no key.
      security: []
      responses:
        "200":
          description: The OpenAPI document, JSON.
          content:
            application/json:
              schema:
                type: object
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl https://parmana-api-real.vercel.app/openapi.json
        - lang: typescript
          label: TypeScript
          source: |-
            const response = await fetch(
              "https://parmana-api-real.vercel.app/openapi.json",
            );

            console.log(response.status, await response.json());
        - lang: python
          label: Python
          source: |-
            import requests

            response = requests.get(
                "https://parmana-api-real.vercel.app/openapi.json",
                timeout=30,
            )

            print(response.status_code, response.json())
  /api-manifest.json:
    get:
      tags:
        - System
      summary: Machine-readable SDK and discovery manifest
      operationId: getApiManifest
      description: >
        One index for agents and tools: where the OpenAPI document and the
        rendered references are, how to

        authenticate, and both official SDKs with their package name, registry
        and current version. Read it

        first when an agent sets itself up. Go and Java are `null` because no
        SDK exists for them; call the

        REST API directly. Needs no key.
      security: []
      responses:
        "200":
          description: The manifest.
          content:
            application/json:
              schema:
                type: object
              examples:
                liveCapture:
                  summary: Real captured response
                  value:
                    name: Parmana
                    apiVersion: v1
                    buildVersion: 0.4.0
                    openapi:
                      json: /openapi.json
                      yaml: /openapi.yaml
                    documentation:
                      site: https://docs.parmanasystems.com
                      swaggerUi: /documentation
                      redoc: /reference
                    authentication:
                      type: bearer
                      header: "Authorization: Bearer <key>"
                      docs: https://docs.parmanasystems.com/api-reference/authentication
                    sdks:
                      typescript:
                        package: "@parmana/sdk"
                        registry: npm
                        version: 1.1.2
                        install: npm install @parmana/sdk
                        docs: https://docs.parmanasystems.com/sdks/typescript
                        reference: https://docs.parmanasystems.com/sdks/reference/typescript/classes/ParmanaClient
                      python:
                        package: parmana
                        registry: pypi
                        version: 1.1.4
                        install: pip install parmana
                        docs: https://docs.parmanasystems.com/sdks/python
                        reference: https://docs.parmanasystems.com/sdks/reference/python/client
                      go: null
                      java: null
                    connectorSdks:
                      typescript:
                        package: "@parmana/connector-sdk"
                        registry: npm
                        version: 0.1.0
                        install: npm install @parmana/connector-sdk
                        docs: https://docs.parmanasystems.com/reference/connector-sdk
                      python:
                        package: parmana-connector-sdk
                        registry: pypi
                        version: 0.1.0
                        install: pip install parmana-connector-sdk
                        docs: https://docs.parmanasystems.com/reference/connector-sdk-python
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl https://parmana-api-real.vercel.app/api-manifest.json
        - lang: typescript
          label: TypeScript
          source: |-
            const response = await fetch(
              "https://parmana-api-real.vercel.app/api-manifest.json",
            );

            console.log(response.status, await response.json());
        - lang: python
          label: Python
          source: |-
            import requests

            response = requests.get(
                "https://parmana-api-real.vercel.app/api-manifest.json",
                timeout=30,
            )

            print(response.status_code, response.json())
  /version:
    get:
      tags:
        - System
      summary: Service version
      operationId: getVersion
      description: >
        Returns `name`, `version` and `api`. These are literals in the server
        code, not a build number, so do

        not use them to detect a deploy. The SDKs carry their own versions; see

        `GET /api-manifest.json`.
      responses:
        "200":
          description: The version identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/version-response.schema"
              examples:
                version:
                  summary: Real captured response
                  value:
                    name: Parmana
                    version: 0.4.0
                    api: v1
        "401":
          $ref: "#/components/responses/Unauthorized"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            curl https://parmana-api-real.vercel.app/version \
              -H "Authorization: Bearer $PARMANA_API_KEY"
        - lang: typescript
          label: TypeScript
          source: |-
            import { ParmanaClient } from "@parmana/sdk";

            const client = new ParmanaClient({
              endpoint: "https://parmana-api-real.vercel.app",
              apiKey: process.env.PARMANA_API_KEY!,
            });

            const version = await client.version();

            console.log(version);
        - lang: python
          label: Python
          source: >-
            import os


            import requests


            response = requests.get(
                "https://parmana-api-real.vercel.app/version",
                headers={"Authorization": f"Bearer {os.environ['PARMANA_API_KEY']}"},
                timeout=30,
            )


            print(response.status_code, response.json())
  /keys/{keyId}:
    get:
      tags:
        - System
      summary: Fetch a public signing key for independent, offline verification
      operationId: getKey
      description: >
        Returns the public half of a signing key, so anyone can verify a Parmana
        signature without a Parmana

        account: "an auditor, a regulator, or an endpoint receiving a release.
        Every signed artifact names its"

        `keyId`; pass it here. Keys that were rotated out stay available as long
        as the server keeps them, so

        old records remain verifiable. Use the `pem` field with the SDK
        verifiers (`verifyParmanaRelease`,

        `verify_parmana_release`) or the offline verifier. Needs no key.
      parameters:
        - name: keyId
          description: The `keyId` named in the signature you want to verify, for example
            `default`.
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The public key.
          content:
            application/json:
              schema:
                type: object
                required:
                  - keyId
                  - algorithm
                  - use
                  - pem
                properties:
                  keyId:
                    type: string
                  algorithm:
                    type: string
                    description: >
                      The key's actual algorithm, derived from the key material
                      itself (asymmetricKeyType), not a global config value.
                  use:
                    type: string
                    enum:
                      - sig
                  pem:
                    type: string
                    description: PEM-encoded SPKI public key (RFC 7468).
                  jwk:
                    type: object
                    description: >
                      Node's native JWK export for this key's algorithm, when
                      available. Ed25519 exports as kty "OKP"; ML-DSA-65 exports
                      as kty "AKP" (the IETF JOSE/COSE key type for ML-DSA, not
                      an identifier this codebase invented). Omitted, not null,
                      when unavailable.
              examples:
                defaultKey:
                  summary: Real captured response
                  value:
                    keyId: default
                    algorithm: ed25519
                    use: sig
                    pem: |
                      -----BEGIN PUBLIC KEY-----
                      MCowBQYDK2VwAyEAQKyaz9ifANjaew96i34spqhM31mBatJ6TTHaMY7mclI=
                      -----END PUBLIC KEY-----
                    jwk:
                      crv: Ed25519
                      x: QKyaz9ifANjaew96i34spqhM31mBatJ6TTHaMY7mclI
                      kty: OKP
        "404":
          description: This deployment has no key with this id. Check the `keyId` in the
            signature, then try `GET /.well-known/jwks.json` to see every key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                unknownKey:
                  summary: Real captured response
                  value:
                    error: "Key not found: does-not-exist"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            curl https://parmana-api-real.vercel.app/keys/default \
              -H "Authorization: Bearer $PARMANA_API_KEY"
        - lang: typescript
          label: TypeScript
          source: |-
            import { ParmanaClient } from "@parmana/sdk";

            const client = new ParmanaClient({
              endpoint: "https://parmana-api-real.vercel.app",
              apiKey: process.env.PARMANA_API_KEY!,
            });

            const key = await client.publicKey("default");

            console.log(key.pem);
        - lang: python
          label: Python
          source: |-
            import os

            from parmana import ParmanaClient

            client = ParmanaClient(
                endpoint="https://parmana-api-real.vercel.app",
                api_key=os.environ["PARMANA_API_KEY"],
            )

            key = client.public_key("default")

            print(key.pem)
  /.well-known/jwks.json:
    get:
      tags:
        - System
      summary: List every public signing key this deployment can currently produce
      operationId: getJwks
      description: >
        Lists every public signing key this deployment can serve, the
        enumeration form of `GET /keys/{keyId}`.

        With local key files that is every key in the key directory. Under AWS
        KMS it is the keys this

        deployment signs with: `default` and the current
        `PARMANA_VERIFICATION_KEY_ID`. A record signed

        under an older key id is still served by `GET /keys/{keyId}`. Fetch and
        cache it when you verify

        many artifacts. Not a strict RFC 7517 JWK Set: use the `pem` of each
        entry; an entry may have no

        `jwk` field. Needs no key.
      responses:
        "200":
          description: Every public key this deployment can serve.
          content:
            application/json:
              schema:
                type: object
                required:
                  - keys
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required:
                        - keyId
                        - algorithm
                        - use
                        - pem
                      properties:
                        keyId:
                          type: string
                        algorithm:
                          type: string
                        use:
                          type: string
                          enum:
                            - sig
                        pem:
                          type: string
                        jwk:
                          type: object
              examples:
                keys:
                  summary: Real captured response
                  value:
                    keys:
                      - keyId: default
                        algorithm: ed25519
                        use: sig
                        pem: |
                          -----BEGIN PUBLIC KEY-----
                          MCowBQYDK2VwAyEAQKyaz9ifANjaew96i34spqhM31mBatJ6TTHaMY7mclI=
                          -----END PUBLIC KEY-----
                        jwk:
                          crv: Ed25519
                          x: QKyaz9ifANjaew96i34spqhM31mBatJ6TTHaMY7mclI
                          kty: OKP
                      - keyId: gateway
                        algorithm: ed25519
                        use: sig
                        pem: |
                          -----BEGIN PUBLIC KEY-----
                          MCowBQYDK2VwAyEAFIS92deNnIcw9U2ZrLxYo6Uqmt31SN0OKwoFhipfObk=
                          -----END PUBLIC KEY-----
                        jwk:
                          crv: Ed25519
                          x: FIS92deNnIcw9U2ZrLxYo6Uqmt31SN0OKwoFhipfObk
                          kty: OKP
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            curl https://parmana-api-real.vercel.app/.well-known/jwks.json \
              -H "Authorization: Bearer $PARMANA_API_KEY"
        - lang: typescript
          label: TypeScript
          source: >-
            const response = await fetch(
              "https://parmana-api-real.vercel.app/.well-known/jwks.json",
              {
                headers: { Authorization: `Bearer ${process.env.PARMANA_API_KEY}` },
              },
            );


            console.log(response.status, await response.json());
        - lang: python
          label: Python
          source: >-
            import os


            import requests


            response = requests.get(
                "https://parmana-api-real.vercel.app/.well-known/jwks.json",
                headers={"Authorization": f"Bearer {os.environ['PARMANA_API_KEY']}"},
                timeout=30,
            )


            print(response.status_code, response.json())
  /callers/me:
    get:
      tags:
        - System
      summary: Get the authenticated caller's identity and resolved scope
      operationId: getCallerMe
      description: >
        Returns who your key is and exactly what it may do: the caller id, the
        principals it may act for, the

        capabilities it may invoke and whether that includes every capability
        (`*`), after defaults are

        applied. Call it

        first when you set up an agent, and show it in a security review. An
        unset `allowedPrincipalIds`

        means the caller's own id; an unset `allowedCapabilities` means none.
        Never returns key material, and

        never another caller's record.
      responses:
        "200":
          description: Your key's identity and scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/callers-me-response.schema"
              examples:
                callerMe:
                  summary: Real captured response
                  value:
                    callerId: demo
                    allowedPrincipalIds:
                      - demo
                    allowedCapabilities:
                      - test:fixture-execute
                    unrestrictedCapabilities: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No caller identity on the request. Happens only when caller
            authentication is disabled, which is for local development.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                noCallerIdentity:
                  summary: Real captured response when caller-auth is disabled
                  value:
                    error: No authenticated caller identity available.
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            curl https://parmana-api-real.vercel.app/callers/me \
              -H "Authorization: Bearer $PARMANA_API_KEY"
        - lang: typescript
          label: TypeScript
          source: |-
            import { ParmanaClient } from "@parmana/sdk";

            const client = new ParmanaClient({
              endpoint: "https://parmana-api-real.vercel.app",
              apiKey: process.env.PARMANA_API_KEY!,
            });

            const me = await client.caller();

            console.log(me.callerId, me.allowedCapabilities);
