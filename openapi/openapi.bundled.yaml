  /execution-intents/{businessTransactionId}:
    get:
      tags:
        - Execution Intents
      summary: Get an Execution Intent and its status
      operationId: getExecutionIntent
      description: >
        Returns the signed Execution Intent for a transaction and where it got
        to. Read it after a timeout or

        a `5xx` before sending anything new. The `status.state` is one of:


        * `PREPARED`: signed and stored; the action may or may not have been
        released.

        * `RELEASED`: released and its result saved.

        * `FINALIZED`: a signed Trust Record exists.

        * `ERRORED`: the release failed; the action may still have run.

        * `RESOLVED`: a person checked the target system and closed it
        (`resolution`, `resolutionNote`,
          `resolvedBy`, `resolvedAt`; an unsigned statement).
      parameters:
        - name: businessTransactionId
          description: The transaction's id.
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The intent and its status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/execution-intent-response.schema"
              examples:
                finalized:
                  summary: Real captured response, an intent finalized inline
                  value:
                    intent:
                      intentId: eb477e41-97d5-4f06-b288-a82b285d43c8
