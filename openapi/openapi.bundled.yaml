          $ref: "#/components/responses/RateLimited"
        "500":
          description: "`EXECUTION_RECORD_INCOMPLETE`: the action was released but its
            signed record could not be produced or stored. Do not resend under a
            new id; an operator rebuilds the record with `POST
            /execution-intents/{businessTransactionId}/finalize`, which never
            calls the connector again. Without a code: an unexpected failure,
            for example a body missing a required nested object."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                executionRecordIncomplete:
                  summary: The action was released but its signed record could not be produced
                  value:
                    error: "The action for business transaction
                      'e54187e6-431f-4e1c-9c0e-ff2cb5d6d40a' was released to the
                      execution system, but its signed Execution Trust Record
                      could not be produced. Do not retry as a new transaction:
                      reconcile against the connector and the execution audit
                      events for this businessTransactionId. authorizationId:
                      381ef27a-0955-4085-9e5d-e4223fef2986."
                    code: EXECUTION_RECORD_INCOMPLETE
                malformedBody:
                  summary: Real captured response, valid UUID but missing required nested fields
                    (e.g. metadata); no code field, this is the generic 500
                    handler, not a typed RuntimeError
                  value:
                    error: Internal Server Error
        "502":
          description: "`EXECUTION_OUTCOME_UNKNOWN`: the action was released and the
            connector call failed (unreachable, timed out, or answered with an
            error), so whether it was performed is unknown. The Execution Intent
            is `ERRORED`, and the response says `executionStatus:
            EXECUTION_UNKNOWN`. Do not resend under a new id: check the target
            system, then close the intent with `POST
            /execution-intents/{businessTransactionId}/resolve`. The message
            carries the ids, never the connector's own error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
