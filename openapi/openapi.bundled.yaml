    execution-trust-record-response.schema:
      title: Execution Trust Record Response
      description: Response returned by POST /execute, POST /transactions, and GET
        /trust-records/{businessTransactionId}. A bare Execution Trust Record,
        no wrapper. POST /execute returns this with status 200; POST
        /transactions returns the identical shape with status 201.
      $ref: "#/components/schemas/execution-trust-record.schema"
    transactions-list-response.schema:
      title: Transactions List Response
      description: Response returned by GET /transactions. A bare array, no pagination
        envelope (no page/pageSize/totalItems metadata), even though the
        endpoint accepts page and pageSize query parameters.
      type: array
      items:
        $ref: "#/components/schemas/business-transaction.schema"
    transaction-response.schema:
      title: Transaction Response
      description: Response returned by GET /transactions/{businessTransactionId} (and
        as each item of GET /transactions' array). A bare Business Transaction,
        no wrapper, no links, no embedded Decision (that lives on each
        Execution, not on the transaction).
      $ref: "#/components/schemas/business-transaction.schema"
    verification-request.schema:
      title: Verification Request
      description: Request payload for POST /verify. businessTransactionId is required
        and must be a valid UUID; both are rejected with a 400, with distinct
        messages depending on which check fails.
      type: object
      additionalProperties: true
      required:
        - businessTransactionId
      properties:
        businessTransactionId:
          type: string
          format: uuid
          description: Business Transaction to verify.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
    verification-response.schema:
      title: Verification Response
      description: "Response returned by POST /verify and GET
        /verification/{businessTransactionId}: a Verification."
      allOf:
        - $ref: "#/components/schemas/verification.schema"
      examples:
        - verificationId: 0ad69d3f-7fd0-4507-ab38-e386146757ae
          businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
          status: VERIFIED
          message: Execution Trust Record verified successfully.
          verifiedAt: 2026-07-07T16:38:59.344Z
          trustRecordHash: 989aef83d595202ec02bb338ac00461abec0541098ea065f965b5cde342d3b25
    refusal-record.schema:
      title: Refusal Record
      description: "Durable, signed, independently verifiable evidence that a policy
        decision rejected a transaction (RFC-0021). Scope is deliberately
        narrow: covers PolicyEngine.evaluate REJECTs and SignalIntentBinder
        binding-violation REJECTs only, not caller-authentication failures or
        webhook signature failures, which are a separate, unsigned audit-sink
        capability. At most one Refusal Record exists per
        businessTransactionId."
      type: object
      additionalProperties: true
      required:
        - refusalRecordId
        - businessTransactionId
        - decision
        - evaluatedIntent
        - refusalRecordHash
        - signature
        - createdAt
      properties:
        refusalRecordId:
          type: string
          description: Unique Refusal Record identifier.
        businessTransactionId:
          type: string
          description: Business Transaction this refusal is about.
        decision:
          $ref: "#/components/schemas/decision.schema"
        evaluatedIntent:
          type: object
          description: "The Intent snapshot the signals were evaluated against: target and
            parameters only, present for every refusal, not only binding
            violations."
          additionalProperties: true
          properties:
            target:
              type: string
            parameters:
              type: object
              additionalProperties: true
        bindingViolations:
          type: array
          description: Present only when the rejection came from SignalIntentBinder.
            Absent (not an empty array) for an ordinary PolicyEngine.evaluate
            REJECT that never reached binding-violation logic at all.
          items:
            type: object
            additionalProperties: true
            required:
              - signalKey
              - intentPath
              - signalValue
              - intentValue
            properties:
              signalKey:
                type: string
              intentPath:
                type: string
              signalValue: {}
              intentValue: {}
        submittedBy:
          type: string
          description: Authenticated caller who submitted the rejected request. Absent
            when caller authentication is disabled.
        policyContentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 hash of the policy content that decided the refusal, the
            same value an Execution Trust Record carries in
            transaction.policy.contentHash. Inside the signed record. Absent on
            Refusal Records written before 2026-10-06.
        refusalRecordHash:
          type: string
          description: Canonical hash of this Refusal Record, same convention as
            ExecutionTrustRecord.trustRecordHash.
        signature:
          type: object
          description: Cryptographic signature over the canonical Refusal Record, signed
            with the same key as ExecutionTrustRecord, one root of trust for
            both approvals and refusals.
          additionalProperties: true
          required:
            - algorithm
            - keyId
            - value
            - signedAt
          properties:
            algorithm:
              type: string
              examples:
                - ed25519
            keyId:
              type: string
              description: Identifier of the signing key.
            value:
              type: string
              description: Base64-encoded signature value.
            signedAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp when this Refusal Record was created.
      examples:
        - refusalRecordId: eddc5dd1-a791-4470-9534-11b3fc573ab8
          businessTransactionId: 353c73fb-5e87-4dbe-8bfc-c15c8f18d871
          decision:
            decisionId: 3919f4b6-cbc8-44ec-a6a1-8887ee85f314
            intentId: 4ba6b14a-c593-4f5c-ab58-dcef38a29364
            policy:
              name: vendor-payment
              version: 2.0.0
              schemaVersion: 1.0.0
            signals:
              vendorVerified: false
              invoiceVerified: true
              paymentApproved: true
              sufficientFunds: true
              paymentAmount: 1000
              riskScore: 5
              vendorId: vendor://payments
            outcome: REJECTED
            reason: Vendor payment rejected because the vendor has not been verified.
            evaluatedAt: 2026-09-15T03:27:45.666Z
          evaluatedIntent:
            target: vendor://payments
            parameters:
              amount: 1000
              currency: USD
          createdAt: 2026-09-15T03:27:45.666Z
          refusalRecordHash: 47d8200e839f9b4a1a53dba941e318553c9b024bc64d26c5b613e5ae2aeb65ca
          signature:
            algorithm: ed25519
            keyId: default
            value: tT32/iJ0bEDxjc+/KPeAegTBSrzpRFW14f9Vyv3Ykx+H/rLHcgd7SlFH/BAXut8sEH2mpo0smg82tSoXmZkpDQ==
            signedAt: 2026-09-15T03:27:45.668Z
    refusal-verify-request.schema:
      title: Refusal Verify Request
      description: "Request body for POST /refusal/verify: the Refusal Record itself,
        not a lookup by ID. Checked structurally on the server (refusalRecordId,
        businessTransactionId, decision, refusalRecordHash, signature required)
        before signature verification runs."
      $ref: "#/components/schemas/refusal-record.schema"
    verify-result-response.schema:
      title: Verify Result Response
      description: "Response shared by POST /refusal/verify and POST /audit/verify: a
        bare signature-validity result, no wrapper, no partial-failure detail.
        Both routes verify a signature over bytes with no database lookup, so
        there is nothing more specific to report than valid or not."
      type: object
      additionalProperties: false
      required:
        - valid
      properties:
        valid:
          type: boolean
          description: Whether the signature verifies against Parmana's public key for the
            stated algorithm and key ID.
      examples:
        - valid: true
        - valid: false
    refusal-record-response.schema:
      title: Refusal Record Response
      description: Response returned by GET /refusal/{businessTransactionId}. A bare
        Refusal Record, no wrapper.
      $ref: "#/components/schemas/refusal-record.schema"
    execution-intent.schema:
      title: Execution Intent
      description: "A signed statement, made and stored BEFORE an action is released
        to a connector, of exactly what is about to be released (ADR-0012). It
        exists so that an action that was released always has signed evidence
        behind it, even when the Execution Trust Record cannot be produced
        afterwards. It contains only facts that exist before release: never the
        execution result, and never the raw intent parameters (the
        businessTransactionHash binds the intent to them). It is a separate
        record from the Execution Trust Record, which keeps its own format. An
        intent proves what was about to be released. It does NOT prove the
        action was released or what its result was. At most one Execution Intent
        exists per businessTransactionId."
      type: object
      additionalProperties: true
      required:
        - intentId
        - businessTransactionId
        - decisionId
        - authorizationId
        - policyName
        - policyVersion
        - businessTransactionHash
        - action
        - target
        - createdAt
        - intentHash
        - signature
      properties:
        intentId:
          type: string
          description: Unique Execution Intent identifier.
        businessTransactionId:
          type: string
          description: The Business Transaction this intent belongs to.
        decisionId:
          type: string
          description: The Decision that approved the action.
        authorizationId:
          type: string
          description: The signed execution authorization this intent refers to. Matches
            authorization.payload.authorizationId in the Execution Trust Record.
        policyName:
          type: string
        policyVersion:
          type: string
        policyContentHash:
          type: string
          description: Hash of the exact policy content in force, copied from the signed
            authorization. Absent when the authorization carries none.
        signalsHash:
          type: string
          description: Hash of the signals that were evaluated, copied from the signed
            authorization. Absent when the authorization carries none.
        businessTransactionHash:
          type: string
          description: Hash of the executable content (action, target and parameters),
            copied from the signed authorization. It binds the intent to the
            exact parameters that were authorized without repeating them here.
        action:
          type: string
          description: The capability about to be released, for example paytm:refund.
        target:
          type: string
          description: The target of the action, for example the order being refunded.
            Together with action and businessTransactionId it is what an
            operator searches for at the connector.
        submittedBy:
          type: string
          description: Authenticated caller who submitted the request. Absent when caller
            authentication is disabled.
        grantedCapability:
          type: string
          description: The capability the caller was granted, when one was recorded.
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp when the intent was created, before the action was
            released.
        intentHash:
          type: string
          description: Canonical hash of the intent, same convention as
            ExecutionTrustRecord.trustRecordHash.
        signature:
          type: object
          description: Signature over the canonical Execution Intent, made with the
            deployment's signing key (local or AWS KMS), the same root of trust
            as the Execution Trust Record.
          additionalProperties: true
          required:
            - algorithm
            - keyId
            - value
            - signedAt
          properties:
            algorithm:
              type: string
              examples:
                - ed25519
            keyId:
              type: string
              description: Identifier of the signing key. Fetch its public half from GET
                /keys/{keyId}.
            value:
              type: string
              description: Base64 encoded signature value.
            signedAt:
              type: string
              format: date-time
      examples:
        - intentId: b41fe9b9-5730-4d34-aab0-4ab63ae69d3b
          businessTransactionId: 4c2eb3b2-3382-4bc2-bf22-2a072e6cf428
          decisionId: 20b4e030-09cd-4447-86fc-b73279d23121
          authorizationId: 5977535b-d887-423d-b422-01ece1fc7bf1
          policyName: customer-refund
          policyVersion: 1.0.0
          policyContentHash: 6a2e92fbde0f4c5dc56b4e202bf45ce24c99e565cf3ddaacaa21a11c71b7e1ea
          signalsHash: e22a7b9fd6e0a39e28521f9ffb726d6a57499236055fa6ff2caabd2268f4a395
          businessTransactionHash: 9df286daf38c6eba272f47153e0fb3efef5ee61d778f6baecd5a53861763763a
          action: paytm:refund
          target: DRY-ORDER-1789969223742
          submittedBy: sandbox-agent
          grantedCapability: paytm:refund
          createdAt: 2026-09-21T05:40:28.434Z
          intentHash: 13922de380518d582c6bb3e88b1d88908e71565f191119f4cadc7de4e30cf5ed
          signature:
            keyId: default
            value: UhXnkSnm5A3QU4CVrKGbP3FcTWkShnitn86psJprJpqgEBnsXWzDcZ+ktSO0FJek1X+n9DvO3SjR+WvSofS1CA==
            signedAt: 2026-09-21T05:40:28.555Z
            algorithm: ed25519
    execution-intent-verify-request.schema:
      title: Execution Intent Verify Request
      description: "Request body for POST /execution-intents/verify: the Execution
        Intent itself (the intent field of GET
        /execution-intents/{businessTransactionId}), not a lookup by ID. Checked
        structurally on the server (intentId, businessTransactionId,
        authorizationId, intentHash, signature required) before signature
        verification runs."
      $ref: "#/components/schemas/execution-intent.schema"
    execution-intent-status.schema:
      title: Execution Intent Status
      description: "Operational status kept next to a signed Execution Intent. It is
        NOT part of what is signed, so it changes as the request progresses.
        PREPARED: the intent is signed and stored, and the action may or may not
        have been released. An intent that stays PREPARED needs reconciliation
        with the connector. RELEASED: the release stage returned and the
        execution context was saved, so the Trust Record can be rebuilt.
        FINALIZED: a signed Execution Trust Record exists for this transaction.
        ERRORED: the release stage raised an error. The action may still have
        been executed, so the outcome is unknown and must be reconciled.
        RESOLVED: a verified human reconciled a PREPARED or ERRORED intent at
        the connector and closed it with POST
        /execution-intents/{businessTransactionId}/resolve, recording what they
        found and a note. The resolution is an attributed operator statement
        stored in this unsigned status. It is NOT tamper evident and it is not a
        Trust Record."
      type: object
      additionalProperties: true
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - PREPARED
            - RELEASED
            - FINALIZED
            - ERRORED
            - RESOLVED
        releasedAt:
          type: string
          format: date-time
          description: When the release stage returned and the execution context was
            saved. Absent from PREPARED and from an ERRORED intent.
        finalizedAt:
          type: string
          format: date-time
          description: When the intent was marked FINALIZED. Present only when state is
            FINALIZED.
        finalizationMode:
          type: string
          enum:
            - INLINE
            - REPAIRED
          description: "INLINE: the Trust Record was produced in the original request.
            REPAIRED: it was rebuilt afterwards by POST
            /execution-intents/{businessTransactionId}/finalize. Present only
            when state is FINALIZED."
        trustRecordId:
          type: string
          description: The Execution Trust Record for this transaction. Present only when
            state is FINALIZED.
        failureReason:
          type: string
          description: The error message the release stage raised. Present only when state
            is ERRORED.
        resolution:
          type: string
          enum:
            - NOT_EXECUTED
            - EXECUTED
          description: What the operator found at the connector. Present only when state
            is RESOLVED.
        resolutionNote:
          type: string
          description: The operator's note. Required when resolving. Present only when
            state is RESOLVED.
        resolvedBy:
          type: string
          description: The authenticated caller who resolved it. Absent when caller
            authentication is disabled.
        resolvedAt:
          type: string
          format: date-time
          description: When it was resolved. Present only when state is RESOLVED.
      examples:
        - state: FINALIZED
          releasedAt: 2026-09-21T05:40:32.743Z
          finalizedAt: 2026-09-21T05:40:32.855Z
          finalizationMode: INLINE
          trustRecordId: a3c8d068-af6a-46c7-9976-e43612d5ab9c
    execution-intents-unfinalized-response.schema:
      title: Unfinalized Execution Intents Response
      description: "Response returned by GET /execution-intents/unfinalized: intents
        that never reached a signed Execution Trust Record and were not closed
        by hand, oldest first. Each is an action that may have been released
        with no signed record, or whose outcome nobody has reconciled yet.
        Entries in state RELEASED are repaired with POST
        /execution-intents/{businessTransactionId}/finalize. Entries in state
        PREPARED or ERRORED are reconciled at the connector and then closed with
        POST /execution-intents/{businessTransactionId}/resolve. A RESOLVED
        intent no longer appears here."
      type: object
      additionalProperties: false
      required:
        - intents
      properties:
        intents:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - intent
              - status
            properties:
              intent:
                $ref: "#/components/schemas/execution-intent.schema"
              status:
                $ref: "#/components/schemas/execution-intent-status.schema"
      examples:
        - intents: []
    execution-intent-response.schema:
      title: Execution Intent Response
      description: "Response returned by GET
        /execution-intents/{businessTransactionId}: the signed Execution Intent
        and its operational status. The saved release context used to rebuild a
        Trust Record is internal and is never returned."
      type: object
      additionalProperties: false
      required:
        - intent
        - status
      properties:
        intent:
          $ref: "#/components/schemas/execution-intent.schema"
        status:
          $ref: "#/components/schemas/execution-intent-status.schema"
      examples:
        - intent:
            intentId: b41fe9b9-5730-4d34-aab0-4ab63ae69d3b
            businessTransactionId: 4c2eb3b2-3382-4bc2-bf22-2a072e6cf428
            decisionId: 20b4e030-09cd-4447-86fc-b73279d23121
            authorizationId: 5977535b-d887-423d-b422-01ece1fc7bf1
            policyName: customer-refund
            policyVersion: 1.0.0
            policyContentHash: 6a2e92fbde0f4c5dc56b4e202bf45ce24c99e565cf3ddaacaa21a11c71b7e1ea
            signalsHash: e22a7b9fd6e0a39e28521f9ffb726d6a57499236055fa6ff2caabd2268f4a395
            businessTransactionHash: 9df286daf38c6eba272f47153e0fb3efef5ee61d778f6baecd5a53861763763a
            action: paytm:refund
            target: DRY-ORDER-1789969223742
            submittedBy: sandbox-agent
            grantedCapability: paytm:refund
            createdAt: 2026-09-21T05:40:28.434Z
            intentHash: 13922de380518d582c6bb3e88b1d88908e71565f191119f4cadc7de4e30cf5ed
            signature:
              keyId: default
              value: UhXnkSnm5A3QU4CVrKGbP3FcTWkShnitn86psJprJpqgEBnsXWzDcZ+ktSO0FJek1X+n9DvO3SjR+WvSofS1CA==
              signedAt: 2026-09-21T05:40:28.555Z
              algorithm: ed25519
          status:
            state: FINALIZED
            releasedAt: 2026-09-21T05:40:32.743Z
            finalizedAt: 2026-09-21T05:40:32.855Z
            finalizationMode: INLINE
            trustRecordId: a3c8d068-af6a-46c7-9976-e43612d5ab9c
    execution-intent-finalize-response.schema:
      title: Finalize Execution Intent Response
      description: "Response returned by POST
        /execution-intents/{businessTransactionId}/finalize. The finalize
        operation never calls a connector. It is safe to run more than once:
        FINALIZED means a Trust Record was rebuilt by this call,
        ALREADY_FINALIZED means one already existed and nothing was built."
      type: object
      additionalProperties: false
      required:
        - outcome
        - businessTransactionId
        - trustRecordId
        - trustRecord
      properties:
        outcome:
          type: string
          enum:
            - FINALIZED
            - ALREADY_FINALIZED
        businessTransactionId:
          type: string
        trustRecordId:
          type: string
          description: Identifier of the Execution Trust Record. Equal to
            trustRecord.trustRecordId.
        trustRecord:
          $ref: "#/components/schemas/execution-trust-record.schema"
    execution-intent-resolve-request.schema:
      title: Resolve Execution Intent Request
      description: Request body for POST
        /execution-intents/{businessTransactionId}/resolve. Both fields are
        required. The note is required on purpose, because it is the only record
        of what the operator found at the connector.
      type: object
      additionalProperties: false
      required:
        - resolution
        - note
      properties:
        resolution:
          type: string
          enum:
            - NOT_EXECUTED
            - EXECUTED
          description: "What you established at the connector. NOT_EXECUTED: the action
            did not run. EXECUTED: it did run."
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: What you checked and found, for example the connector and the
            reference you looked at. Surrounding space is trimmed.
      examples:
        - resolution: NOT_EXECUTED
          note: Checked the Paytm dashboard for this order. No refund exists.
    execution-intent-resolve-response.schema:
      title: Resolve Execution Intent Response
      description: "Response returned by POST
        /execution-intents/{businessTransactionId}/resolve. RESOLVED means this
        call closed the intent. ALREADY_RESOLVED means it was already closed and
        nothing was changed: the original resolution, note and author are
        returned, never the new request's."
      type: object
      additionalProperties: false
      required:
        - outcome
        - businessTransactionId
        - intent
        - status
      properties:
        outcome:
          type: string
          enum:
            - RESOLVED
            - ALREADY_RESOLVED
        businessTransactionId:
          type: string
        intent:
          $ref: "#/components/schemas/execution-intent.schema"
        status:
          $ref: "#/components/schemas/execution-intent-status.schema"
    audit-verify-request.schema:
      title: Audit Verify Request
      description: "Request body for POST /audit/verify: the signed
        caller-authentication audit event and its stored signature, not a lookup
        by ID. Checked structurally on the server before signature verification
        runs. Verification operates on canonical bytes and the signature alone,
        never on event.type."
      type: object
      additionalProperties: false
      required:
        - event
        - signature
      properties:
        event:
          type: object
          description: The caller-authentication audit event as stored. Only type,
            occurredAt, and route are structurally required; the event may carry
            further fields depending on what produced it.
          additionalProperties: true
          required:
            - type
            - occurredAt
            - route
          properties:
            type:
              type: string
            occurredAt:
              type: string
              format: date-time
            route:
              type: string
        signature:
          type: object
          description: The signature stored alongside the event. Only production
            (Supabase) audit sinks sign; in-memory test sinks never produce a
            genuine one of these.
          additionalProperties: true
          required:
            - algorithm
            - keyId
            - value
          properties:
            algorithm:
              type: string
              examples:
                - ed25519
            keyId:
              type: string
            value:
              type: string
              description: Base64-encoded signature value.
      examples:
        - event:
            type: caller_authenticated
            occurredAt: 2026-09-15T03:00:00.000Z
            route: /version
          signature:
            algorithm: ed25519
            keyId: default
            value: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
    receipt-request.schema:
      title: Receipt Request
      description: Request payload for POST /receipt. businessTransactionId is
        required and must be a valid UUID; both are rejected with a 400, with
        distinct messages depending on which check fails.
      type: object
      additionalProperties: true
      required:
        - businessTransactionId
      properties:
        businessTransactionId:
          type: string
          format: uuid
          description: Business Transaction to generate a Receipt for. Its Execution Trust
            Record must already have a successful (VERIFIED) Verification, or
            the request fails with a 409.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
    receipt-response.schema:
      title: Receipt Response
      description: Response returned by POST /receipt and GET
        /receipt/latest/{businessTransactionId}. A bare Receipt, no wrapper.
      $ref: "#/components/schemas/receipt.schema"
    trust-records-list-response.schema:
      title: Trust Records List Response
      description: Response returned by GET /trust-records (bulk/compliance export). A
        bare array, no pagination envelope (no page/pageSize/totalItems
        metadata) -- the same shape convention as GET /transactions. Each item
        is a full Execution Trust Record, the same shape GET
        /trust-records/{businessTransactionId} returns for one.
      type: array
      items:
        $ref: "#/components/schemas/execution-trust-record-response.schema"
    replay-request.schema:
      title: Replay Request
      description: Request payload for POST /replay. businessTransactionId is required
        (rejected with a 400 if missing or empty), unlike POST /verify and POST
        /receipt, this route does not additionally validate UUID format.
      type: object
      additionalProperties: true
      required:
        - businessTransactionId
      properties:
        businessTransactionId:
          type: string
          description: Business Transaction to replay.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
    replay-response.schema:
      title: Replay Response
      description: "Response returned by POST /replay. A deliberately small shape
        distinct from the Execution Trust Record it replays: it re-verifies the
        record's stored signature via VerificationCrypto and reports only
        whether that succeeded, alongside the hash it checked."
      type: object
      additionalProperties: false
      required:
        - businessTransactionId
        - trustRecordHash
        - verified
      properties:
        businessTransactionId:
          type: string
          description: Business Transaction that was replayed.
        trustRecordHash:
          type: string
          description: Hash of the Execution Trust Record that was replayed.
        verified:
          type: boolean
          description: Whether the Execution Trust Record's stored signature verified
            successfully.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
          trustRecordHash: 989aef83d595202ec02bb338ac00461abec0541098ea065f965b5cde342d3b25
          verified: true
    policy-validate-request.schema:
      title: Policy Validate Request
      description: Request payload for POST /policies/validate. policyId and
        policyVersion are each required non-empty strings, checked in that
        order; each missing/empty field is rejected with its own 400 and a
        distinct message.
      type: object
      additionalProperties: true
      required:
        - policyId
        - policyVersion
      properties:
        policyId:
          type: string
          minLength: 1
          description: Policy name, matching the directory name under the configured
            policy directory.
        policyVersion:
          type: string
          minLength: 1
          description: Policy version, matching the version subdirectory.
      examples:
        - policyId: vendor-payment
          policyVersion: 2.0.0
    policy-validate-response.schema:
      title: Policy Validate Response
      description: Response returned by POST /policies/validate on every status code
        (200, 400, and 404 all use this exact shape). This endpoint does NOT use
        the shared Error envelope (../common/error.schema.json) for its failure
        responses.
      type: object
      additionalProperties: false
      required:
        - valid
        - errors
      properties:
        valid:
          type: boolean
          description: Whether the referenced policy exists and is readable.
        errors:
          type: array
          description: Empty when valid is true; otherwise exactly one human-readable
            message.
          items:
            type: string
      examples:
        - valid: true
          errors: []
        - valid: false
          errors:
            - Policy 'does-not-exist' version '9.9.9' was not found.
        - valid: false
          errors:
            - policyVersion is required.
    propose-policy-change-request.schema:
      title: Propose Policy Change Request
      description: Request body for POST /policies/{name}/{version}/pending-changes.
      type: object
      additionalProperties: false
      required:
        - proposedContent
        - reason
      properties:
        proposedContent:
          type: object
          description: The full proposed policy.json content, in its entirety. Its
            policyId must equal the {name} path parameter, and its policyVersion
            must match ^[A-Za-z0-9._-]+$ and not be "." or "..". Validated
            against the same rules POST /policies/validate checks.
          additionalProperties: true
        reason:
          type: string
          description: Free-text justification. Required, non-empty.
      examples:
        - proposedContent:
            policyId: openapi-capture-demo
            policyVersion: 1.0.0
            schemaVersion: 1.0.0
            rules:
              - id: always-approve
                condition:
                  always: true
                outcome:
                  action: approve
                  reason: OpenAPI spec capture fixture
          reason: Capture a real Pending Policy Change for the OpenAPI spec
    pending-policy-change.schema:
      title: Pending Policy Change
      description: A proposed change to a policy's content, held in a durable pending
        state until a second, distinct human explicitly approves or rejects it
        (Policy Governance, maker-checker). Only ever moves from
        PENDING_APPROVAL to APPROVED or REJECTED, exactly once.
      type: object
      additionalProperties: true
      required:
        - pendingPolicyChangeId
        - policyName
        - policyVersion
        - proposedContent
        - proposedBy
        - proposedAt
        - status
        - reason
      properties:
        pendingPolicyChangeId:
          type: string
          description: Unique Pending Policy Change identifier.
        policyName:
          type: string
          description: The policy this proposal targets, same identifier as Policy.policyId.
        policyVersion:
          type: string
          description: "The existing version this proposal is a change against (\"the
            version being replaced\"). Not necessarily equal to
            proposedContent's own declared version: an in-place patch and a
            version bump are both legitimate."
        proposedContent:
          type: object
          description: The full proposed policy.json content, in its entirety, not a diff
            or patch.
          additionalProperties: true
        proposedBy:
          type: string
          description: Identity of the proposer (maker). Always a human-authenticated
            (credentialHolderType USER) caller.
        proposedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - REJECTED
        reason:
          type: string
          description: Free-text justification from the proposer, required at creation.
        resolvedBy:
          type: string
          description: Identity of the resolver (checker). Absent while PENDING_APPROVAL.
            Never equal to proposedBy.
        resolvedAt:
          type: string
          format: date-time
          description: Absent while PENDING_APPROVAL.
        rejectionReason:
          type: string
          description: Present only when status is REJECTED.
        coverageWarnings:
          type: array
          description: "Present only when non-empty: uncovered-fact warnings from
            PolicyValidator.findUncoveredFacts against proposedContent."
          items:
            type: string
        ruleConflicts:
          type: array
          description: "Present only when non-empty: advisory rule-conflict warnings from
            PolicyValidator.findRuleConflicts against proposedContent, never
            blocking."
          items:
            type: string
      examples:
        - pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
          policyName: openapi-capture-demo
          policyVersion: 1.0.0
          proposedContent:
            policyId: openapi-capture-demo
            policyVersion: 1.0.0
            schemaVersion: 1.0.0
            rules:
              - id: always-approve
                condition:
                  always: true
                outcome:
                  action: approve
                  reason: OpenAPI spec capture fixture
          proposedBy: human-maker
          proposedAt: 2026-09-15T03:47:13.920Z
          status: APPROVED
          reason: Capture a real Pending Policy Change for the OpenAPI spec
          resolvedBy: human-checker
          resolvedAt: 2026-09-15T03:48:03.586Z
    pending-policy-change-response.schema:
      title: Pending Policy Change Response
      description: Response returned by POST
        /policies/{name}/{version}/pending-changes (201), POST
        /policies/pending-changes/{id}/approve (200), and POST
        /policies/pending-changes/{id}/reject (200). A bare Pending Policy
        Change, no wrapper.
      $ref: "#/components/schemas/pending-policy-change.schema"
    pending-changes-list-response.schema:
      title: Pending Changes List Response
      description: "Response returned by GET /policies/pending-changes. Each entry is
        a Pending Policy Change plus a diff view: current (the live content at
        (policyName, policyVersion) today, or null if that version has never
        been published) and proposed (the change's own proposedContent)."
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/pending-policy-change.schema"
              - type: object
                required:
                  - diff
                properties:
                  diff:
                    type: object
                    additionalProperties: false
                    required:
                      - current
                      - proposed
                    properties:
                      current:
                        description: The live policy.json content today, or null if this version has
                          never been published.
                      proposed:
                        description: The same value as this entry's own proposedContent.
      examples:
        - changes:
            - pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
              policyName: openapi-capture-demo
              policyVersion: 1.0.0
              proposedContent:
                policyId: openapi-capture-demo
                policyVersion: 1.0.0
                schemaVersion: 1.0.0
                rules:
                  - id: always-approve
                    condition:
                      always: true
                    outcome:
                      action: approve
                      reason: OpenAPI spec capture fixture
              proposedBy: human-maker
              proposedAt: 2026-09-15T03:47:13.920Z
              status: PENDING_APPROVAL
              reason: Capture a real Pending Policy Change for the OpenAPI spec
              diff:
                current: null
                proposed:
                  policyId: openapi-capture-demo
                  policyVersion: 1.0.0
                  schemaVersion: 1.0.0
                  rules:
                    - id: always-approve
                      condition:
                        always: true
                      outcome:
                        action: approve
                        reason: OpenAPI spec capture fixture
    policy-change-step-up-authorization.schema:
      title: Policy Change Step-Up Authorization
      description: "Signed envelope proving a checker's explicit, fresh intent to
        approve or reject one specific Pending Policy Change (Policy Governance,
        Layer 4). Produced by PolicyChangeStepUpAuthorizationSigner
        (@parmana/crypto) using the checker's own step-up private key, never the
        bearer API key. Verified server-side against: the checker's registered
        stepUpPublicKey, payload.pendingPolicyChangeId matching the URL's {id},
        payload.action matching the endpoint (approve vs reject),
        payload.expiresAt not yet passed, and payload.nonce not previously seen
        (single-use, replay-rejected on a second attempt with the same
        envelope)."
      type: object
      additionalProperties: true
      required:
        - payload
        - signature
        - keyId
        - algorithm
      properties:
        payload:
          type: object
          additionalProperties: true
          required:
            - version
            - nonce
            - pendingPolicyChangeId
            - action
            - authorizedAt
            - expiresAt
          properties:
            version:
              type: integer
            nonce:
              type: string
              description: Single-use value; a second request replaying the same envelope is
                rejected.
            pendingPolicyChangeId:
              type: string
            action:
              type: string
              enum:
                - approve
                - reject
            authorizedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
        signature:
          type: string
          description: Base64-encoded signature over the canonical payload, signed with
            the checker's step-up private key.
        keyId:
          type: string
        algorithm:
          type: string
          examples:
            - ed25519
      examples:
        - payload:
            version: 1
            nonce: 343ee454-92c6-4ef9-9cfe-e98329e51f53
            pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
            action: approve
            authorizedAt: 2026-09-15T03:47:51.939Z
            expiresAt: 2026-09-15T03:49:51.939Z
          signature: keOXnzUk8KcGrQTkpXC4Ki8ps3GTvMANwqq96b+toxba07gjkcmpyL/vaPZ7+pPZ1HAOJOOy3rj5XfhcwOTnAw==
          keyId: human-checker-step-up-key
          algorithm: ed25519
    approve-policy-change-request.schema:
      title: Approve Policy Change Request
      description: Request body for POST /policies/pending-changes/{id}/approve.
      type: object
      additionalProperties: false
      required:
        - stepUpAuthorization
      properties:
        stepUpAuthorization:
          $ref: "#/components/schemas/policy-change-step-up-authorization.schema"
      examples:
        - stepUpAuthorization:
            payload:
              version: 1
              nonce: 343ee454-92c6-4ef9-9cfe-e98329e51f53
              pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
              action: approve
              authorizedAt: 2026-09-15T03:47:51.939Z
              expiresAt: 2026-09-15T03:49:51.939Z
            signature: keOXnzUk8KcGrQTkpXC4Ki8ps3GTvMANwqq96b+toxba07gjkcmpyL/vaPZ7+pPZ1HAOJOOy3rj5XfhcwOTnAw==
            keyId: human-checker-step-up-key
            algorithm: ed25519
    reject-policy-change-request.schema:
      title: Reject Policy Change Request
      description: Request body for POST /policies/pending-changes/{id}/reject.
      type: object
      additionalProperties: false
      required:
        - rejectionReason
        - stepUpAuthorization
      properties:
        rejectionReason:
          type: string
          description: Free-text reason. Required, non-empty.
        stepUpAuthorization:
          $ref: "#/components/schemas/policy-change-step-up-authorization.schema"
      examples:
        - rejectionReason: Does not meet the bar for this fixture
          stepUpAuthorization:
            payload:
              version: 1
              nonce: 4807fe45-0379-415b-9455-b8cb84eb5554
              pendingPolicyChangeId: 5617ba3c-fb07-437d-9131-232b84bbb863
              action: reject
              authorizedAt: 2026-09-15T03:48:16.755Z
              expiresAt: 2026-09-15T03:50:16.755Z
            signature: Wu5/oibGCjvkTklGQPiDMDemqxCVbSyuoVT7WHW63rGq8Av5KFTW6vMkUCP03pANv8bDu60bZVuVcTDVmLXpDA==
            keyId: human-checker-step-up-key
            algorithm: ed25519
    approval-issuer.schema:
      title: Approver Key
      description: An approver key the server trusts, or trusted, to sign approvals.
        source is code for keys listed in the server's code, and governed for
        keys added through approver changes.
      type: object
      additionalProperties: false
      required:
        - approverId
        - keyId
        - publicKeyPem
        - revoked
        - source
      properties:
        approverId:
          type: string
        keyId:
          type: string
        publicKeyPem:
          type: string
          description: Ed25519 public key, PEM (SPKI).
        revoked:
          type: boolean
          description: "true: every approval signed with this key is refused."
        source:
          type: string
          enum:
            - code
            - governed
          description: "code: listed in createApprovalIssuerRegistry.ts, changed only by a
            deploy. governed: added through POST /approval-issuers/changes."
        addedByChangeId:
          type: string
          description: "governed only: the approved change that added it."
        addedAt:
          type: string
          format: date-time
          description: governed only.
        revokedByChangeId:
          type: string
          description: "governed and revoked only: the approved change that revoked it."
        revokedAt:
          type: string
          format: date-time
          description: governed and revoked only.
    approval-issuers-list-response.schema:
      title: Approver Keys List Response
      description: "Response of GET /approval-issuers: keys in code first, then keys
        added through approver changes, revoked ones included."
      type: object
      additionalProperties: false
      required:
        - issuers
      properties:
        issuers:
          type: array
          items:
            $ref: "#/components/schemas/approval-issuer.schema"
    approval-issuer-change.schema:
      title: Approver Change
      description: A proposal to add an approver key, or to revoke one added this way,
        and its resolution. One person proposes it; a different person approves
        or rejects it with a step up authorization. Only an approved change
        affects which approvals verify.
      type: object
      additionalProperties: false
      required:
        - changeId
        - action
        - approverId
        - keyId
        - reason
        - proposedBy
        - proposedAt
        - status
      properties:
        changeId:
          type: string
          description: Unique id of the change, a UUID. The step up authorization for
            approve or reject names it in payload.pendingPolicyChangeId.
        action:
          type: string
          enum:
            - add
            - revoke
          description: add trusts a new key; revoke stops trusting a key added this way,
            and every approval it ever signed.
        approverId:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,128}$
          description: The approver, as named in the payload.issuer.approverId of the
            approvals they sign.
        keyId:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,128}$
          description: "The approver's key, as named in payload.issuer.keyId. A key id is
            used once: a revoked key id cannot be added again."
        publicKeyPem:
          type: string
          description: The approver's Ed25519 public key, PEM (SPKI), as the server stored
            it. Present on add, absent on revoke.
        reason:
          type: string
          maxLength: 2000
          description: Why, from the proposer.
        proposedBy:
          type: string
          description: The proposer's caller id. Always a human credential.
        proposedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - REJECTED
          description: PENDING_APPROVAL until a second person approves or rejects it; then
            APPROVED or REJECTED, once.
        resolvedBy:
          type: string
          description: Who approved or rejected it. Never the proposer.
        resolvedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
          description: Present when REJECTED.
      examples:
        - changeId: ba7c5827-5844-4069-94fc-9b438ef08f78
          action: add
          approverId: manager-priya
          keyId: manager-priya-key-1
          publicKeyPem: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAEDuWHf+bbRY7J/Mr0RVmAKYHH5CDijTWhdnISXWLD6Y=
            -----END PUBLIC KEY-----
          reason: Priya approves refunds for the West region from October.
          proposedBy: human-maker
          proposedAt: 2026-09-28T19:05:59.726Z
          status: APPROVED
          resolvedBy: human-checker
          resolvedAt: 2026-09-28T19:05:59.738Z
    approval-issuer-changes-list-response.schema:
      title: Approver Changes List Response
      description: Response of GET /approval-issuers/changes, newest first.
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/approval-issuer-change.schema"
    propose-approval-issuer-change-request.schema:
      title: Propose Approver Change Request
      description: Request body for POST /approval-issuers/changes.
      type: object
      additionalProperties: true
      required:
        - action
        - approverId
        - keyId
        - reason
      properties:
        action:
          type: string
          enum:
            - add
            - revoke
        approverId:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,128}$
        keyId:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,128}$
        publicKeyPem:
          type: string
          description: Required for add, not allowed for revoke. The .public.pem file
            scripts/generate-approver-key.ts writes.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      examples:
        - action: add
          approverId: manager-priya
          keyId: manager-priya-key-1
          publicKeyPem: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAEDuWHf+bbRY7J/Mr0RVmAKYHH5CDijTWhdnISXWLD6Y=
            -----END PUBLIC KEY-----
          reason: Priya approves refunds for the West region from October.
        - action: revoke
          approverId: manager-priya
          keyId: manager-priya-key-1
          reason: Priya moved to another team.
    approval-issuer-change-response.schema:
      title: Approver Change Response
      description: Response of POST /approval-issuers/changes (201) and of approve and
        reject (200). A bare Approver Change, no wrapper.
      $ref: "#/components/schemas/approval-issuer-change.schema"
    external-connector.schema:
      title: External Connector
      description: "A capability bound to an HTTPS endpoint an operator runs, and to
        the policy that governs it, registered through external connector
        changes (ADR-0013). Nothing is deleted: a revoked registration stays
        listed."
      type: object
      additionalProperties: false
      required:
        - registrationId
        - capability
        - endpointUrl
        - policy
        - allowedParameters
        - timeoutMs
        - status
        - registeredAt
      properties:
        registrationId:
          type: string
          description: The changeId of the approved register change that created it.
        capability:
          type: string
        endpointUrl:
          type: string
        policy:
          type: string
        allowedParameters:
          type: array
          items:
            type: string
        timeoutMs:
          type: integer
        status:
          type: string
          enum:
            - active
            - revoked
          description: At most one active registration per capability.
        registeredAt:
          type: string
          format: date-time
        revokedByChangeId:
          type: string
          description: "revoked only: the approved change that revoked it."
        revokedAt:
          type: string
          format: date-time
          description: revoked only.
    external-connectors-list-response.schema:
      title: External Connectors List Response
      description: "Response of GET /external-connectors: every registration, active
        and revoked."
      type: object
      additionalProperties: false
      required:
        - connectors
      properties:
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/external-connector.schema"
    external-connector-change.schema:
      title: External Connector Change
      description: A proposal to register an external connector, or to revoke the
        active one for a capability, and its resolution (ADR-0013). One person
        proposes it; a different person approves or rejects it with a step up
        authorization. Only an approved change affects which external connectors
        are registered.
      type: object
      additionalProperties: false
      required:
        - changeId
        - action
        - capability
        - reason
        - proposedBy
        - proposedAt
        - status
      properties:
        changeId:
          type: string
          description: Unique id of the change, a UUID. The step up authorization for
            approve or reject names it in payload.pendingPolicyChangeId. An
            approved register change's id is also the registrationId.
        action:
          type: string
          enum:
            - register
            - revoke
          description: register binds the capability to the endpoint; revoke ends the
            active registration for the capability.
        capability:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*:[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$
          maxLength: 128
          description: namespace:verb. Never in a built in connector's namespace (paytm,
            hubspot, github, slack, test).
        endpointUrl:
          type: string
          description: "register only. The endpoint as the server stored it, normalized by
            URL parsing: https, a host name with a domain, no IP literal, no
            localhost, no user name, password or fragment, resolving only to
            public addresses. It is the audience of every release to this
            endpoint."
        policy:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,127}$
          description: register only. The name of the policy that governs the capability.
            The version in effect is decided by policy governance.
        allowedParameters:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
          description: register only. The only parameter names Parmana will forward to the
            endpoint.
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 30000
          description: register only. How long Parmana waits for the endpoint's answer.
            Defaults to 10000.
        reason:
          type: string
          maxLength: 2000
          description: Why, from the proposer.
        proposedBy:
          type: string
          description: The proposer's caller id. Always a human credential.
        proposedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - REJECTED
          description: PENDING_APPROVAL until a second person approves or rejects it; then
            APPROVED or REJECTED, once.
        resolvedBy:
          type: string
          description: Who approved or rejected it. Never the proposer.
        resolvedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
          description: Present when REJECTED.
      examples:
        - changeId: 1aa68ad8-ab5c-4beb-9ff3-7a6b1fc1ff37
          action: register
          capability: erp:create-invoice
          endpointUrl: https://erp.example.com/parmana/release
          policy: erp-invoice
          allowedParameters:
            - amount
            - currency
            - customerId
          timeoutMs: 10000
          reason: Finance creates invoices in the ERP through Parmana from October.
          proposedBy: human-maker
          proposedAt: 2026-09-30T17:25:46.316Z
          status: APPROVED
          resolvedBy: human-checker
          resolvedAt: 2026-09-30T17:25:46.385Z
    external-connector-changes-list-response.schema:
      title: External Connector Changes List Response
      description: Response of GET /external-connectors/changes, newest first.
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/external-connector-change.schema"
    propose-external-connector-change-request.schema:
      title: Propose External Connector Change Request
      description: Request body for POST /external-connectors/changes. A register
        carries endpointUrl, policy, allowedParameters and optionally timeoutMs;
        a revoke carries none of them.
      type: object
      additionalProperties: true
      required:
        - action
        - capability
        - reason
      properties:
        action:
          type: string
          enum:
            - register
            - revoke
        capability:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*:[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$
          maxLength: 128
        endpointUrl:
          type: string
          maxLength: 2048
          description: Required for register. https only, a public host name.
        policy:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,127}$
          description: Required for register.
        allowedParameters:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
          description: Required for register. May be empty.
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 30000
          default: 10000
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      examples:
        - action: register
          capability: erp:create-invoice
          endpointUrl: https://erp.example.com/parmana/release
          policy: erp-invoice
          allowedParameters:
            - amount
            - currency
            - customerId
          timeoutMs: 10000
          reason: Finance creates invoices in the ERP through Parmana from October.
        - action: revoke
          capability: erp:create-invoice
          reason: The ERP endpoint moves to a new host.
    external-connector-change-response.schema:
      title: External Connector Change Response
      description: Response of POST /external-connectors/changes (201) and of approve
        and reject (200). A bare External Connector Change, no wrapper.
      $ref: "#/components/schemas/external-connector-change.schema"
    business-signal-source.schema:
      title: Business Signal Source
      description: "A business system Parmana asks for the facts a policy declares in
        signalSources (RFC-0023), registered through business signal source
        changes. Nothing is deleted: a revoked registration stays listed."
      type: object
      additionalProperties: false
      required:
        - registrationId
        - name
        - endpointUrl
        - timeoutMs
        - status
        - registeredAt
      properties:
        registrationId:
          type: string
          description: The changeId of the approved register change that created it.
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          description: The name a policy's signalSources uses in `source`.
        endpointUrl:
          type: string
          description: The HTTPS endpoint Parmana posts each signed query to. It is the
            query's audience.
        timeoutMs:
          type: integer
        publicKeyPem:
          type: string
          description: The Ed25519 public key, SPKI PEM, the source signs its answers
            with. When present, an answer without a valid signature is refused
            as SOURCE_UNAVAILABLE.
        keyId:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,128}$
          description: A label for publicKeyPem. When present, an answer signed under
            another keyId is refused.
        status:
          type: string
          enum:
            - active
            - revoked
          description: At most one active registration per name.
        registeredAt:
          type: string
          format: date-time
        revokedByChangeId:
          type: string
          description: "revoked only: the approved change that revoked it."
        revokedAt:
          type: string
          format: date-time
          description: revoked only.
    business-signal-sources-list-response.schema:
      title: Business Signal Sources List Response
      description: "Response of GET /business-signal-sources: every registration,
        active and revoked."
      type: object
      additionalProperties: false
      required:
        - sources
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/business-signal-source.schema"
    business-signal-source-change.schema:
      title: Business Signal Source Change
      description: A proposal to register a business signal source, or to revoke the
        active one for a name, and its resolution (RFC-0023 phase 2). One person
        proposes it; a different person approves or rejects it with a step up
        authorization. Only an approved change affects which sources Parmana
        asks.
      type: object
      additionalProperties: false
      required:
        - changeId
        - action
        - name
        - reason
        - proposedBy
        - proposedAt
        - status
      properties:
        changeId:
          type: string
          description: Unique id of the change, a UUID. The step up authorization for
            approve or reject names it in payload.pendingPolicyChangeId. An
            approved register change's id is also the registrationId.
        action:
          type: string
          enum:
            - register
            - revoke
          description: register names a source and its endpoint; revoke ends the active
            registration for the name.
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          description: The name a policy's signalSources uses in `source`.
        endpointUrl:
          type: string
          description: "register only. The endpoint as the server stored it, normalized by
            URL parsing: https, a host name with a domain, no IP literal, no
            localhost, no user name, password or fragment, resolving only to
            public addresses."
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 30000
          description: register only. How long Parmana waits for the source's answer.
            Defaults to 10000.
        publicKeyPem:
          type: string
          description: register only, optional. The Ed25519 public key the source signs
            its answers with, as the server stored it (SPKI PEM).
        keyId:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,128}$
          description: register only, optional, and only with publicKeyPem.
        reason:
          type: string
          maxLength: 2000
          description: Why, from the proposer.
        proposedBy:
          type: string
          description: The proposer's caller id. Always a human credential.
        proposedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - REJECTED
          description: PENDING_APPROVAL until a second person approves or rejects it; then
            APPROVED or REJECTED, once.
        resolvedBy:
          type: string
          description: Who approved or rejected it. Never the proposer.
        resolvedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
          description: Present when REJECTED.
      examples:
        - changeId: 5ba7d3a6-d56d-4e90-b588-402d44aeee0c
          action: register
          name: erp
          endpointUrl: https://orders.example.com/parmana/signals
          timeoutMs: 5000
          publicKeyPem: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAsgWd/PtRf9OsENif9bgJegghUpmEOOZN5NROxc3zpPc=
            -----END PUBLIC KEY-----
          keyId: erp-2026-10
          reason: Release goods only against invoices the ERP says are paid.
          proposedBy: source-maker
          proposedAt: 2026-10-11T02:58:24.725Z
          status: APPROVED
          resolvedBy: source-checker
          resolvedAt: 2026-10-11T02:58:24.745Z
    business-signal-source-changes-list-response.schema:
      title: Business Signal Source Changes List Response
      description: Response of GET /business-signal-sources/changes, newest first.
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/business-signal-source-change.schema"
    propose-business-signal-source-change-request.schema:
      title: Propose Business Signal Source Change Request
      description: Request body for POST /business-signal-sources/changes. A register
        carries endpointUrl and optionally timeoutMs, publicKeyPem and keyId; a
        revoke carries none of them.
      type: object
      additionalProperties: true
      required:
        - action
        - name
        - reason
      properties:
        action:
          type: string
          enum:
            - register
            - revoke
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        endpointUrl:
          type: string
          maxLength: 2048
          description: Required for register. https only, a public host name.
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 30000
          default: 10000
        publicKeyPem:
          type: string
          maxLength: 1000
          description: "Optional, register only. An Ed25519 public key in PEM.
            Recommended: without it, Parmana trusts the answer on the strength
            of the pinned HTTPS connection alone."
        keyId:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,128}$
          description: Optional, register only, and only with publicKeyPem.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      examples:
        - action: register
          name: erp
          endpointUrl: https://orders.example.com/parmana/signals
          timeoutMs: 5000
          publicKeyPem: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAsgWd/PtRf9OsENif9bgJegghUpmEOOZN5NROxc3zpPc=
            -----END PUBLIC KEY-----
          keyId: erp-2026-10
          reason: Release goods only against invoices the ERP says are paid.
        - action: revoke
          name: erp
          reason: The ERP moves to a new host.
    business-signal-source-change-response.schema:
      title: Business Signal Source Change Response
      description: Response of POST /business-signal-sources/changes (201) and of
        approve and reject (200). A bare Business Signal Source Change, no
        wrapper.
      $ref: "#/components/schemas/business-signal-source-change.schema"
    authority-grant.schema:
      title: Authority Grant
      description: "Authority granted to one caller for one capability, within limits,
        until an expiry (RFC-0023 phase 3), made through authority grant
        changes. A policy with requireAuthorityGrant decides a request only when
        its authenticated caller holds a grant in force and the request is
        within its limits. Nothing is deleted: a revoked grant stays listed."
      type: object
      additionalProperties: false
      required:
        - grantId
        - callerId
        - capability
        - validFrom
        - validUntil
        - status
        - grantedAt
      properties:
        grantId:
          type: string
          description: The changeId of the approved grant change that created it.
        callerId:
          type: string
          description: The callerId of the API key the grant is for.
        capability:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*:[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$
        limits:
          type: object
          description: "Limits on the request, by Intent path: target or
            parameters.<name>. min and max (inclusive) apply to a number there;
            oneOf lists the only values allowed there. A request whose value is
            missing, of another type, or outside a limit is NOT_AUTHORIZED."
          maxProperties: 32
          propertyNames:
            pattern: ^(?:target|parameters\.[A-Za-z_][A-Za-z0-9_]{0,63})$
          additionalProperties:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              min:
                type: number
              max:
                type: number
              oneOf:
                type: array
                minItems: 1
                maxItems: 64
                items:
                  type:
                    - string
                    - number
        validFrom:
          type: string
          format: date-time
          description: "From when it holds: the proposal's validFrom, or the approval time."
        validUntil:
          type: string
          format: date-time
          description: Until when it holds. After this, requests are refused as
            AUTHORITY_EXPIRED.
        status:
          type: string
          enum:
            - active
            - revoked
          description: At most one active grant per caller and capability. Active says not
            revoked; check validFrom and validUntil for whether it is in force.
        grantedAt:
          type: string
          format: date-time
        revokedByChangeId:
          type: string
          description: "revoked only: the approved change that revoked it."
        revokedAt:
          type: string
          format: date-time
          description: revoked only.
    authority-grants-list-response.schema:
      title: Authority Grants List Response
      description: "Response of GET /authority-grants: every grant, active and revoked."
      type: object
      additionalProperties: false
      required:
        - grants
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/authority-grant.schema"
    authority-grant-change.schema:
      title: Authority Grant Change
      description: A proposal to grant a caller authority for a capability, or to
        revoke the active grant, and its resolution (RFC-0023 phase 3). One
        person proposes it; a different person approves or rejects it with a
        step up authorization; neither may be the caller the grant is for.
      type: object
      additionalProperties: false
      required:
        - changeId
        - action
        - callerId
        - capability
        - reason
        - proposedBy
        - proposedAt
        - status
      properties:
        changeId:
          type: string
          description: Unique id of the change, a UUID. The step up authorization for
            approve or reject names it in payload.pendingPolicyChangeId. An
            approved grant change's id is also the grantId.
        action:
          type: string
          enum:
            - grant
            - revoke
        callerId:
          type: string
        capability:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*:[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$
        limits:
          type: object
          description: "grant only, optional. Limits on the request, by Intent path:
            target or parameters.<name>. min and max (inclusive) apply to a
            number there; oneOf lists the only values allowed there. A request
            whose value is missing, of another type, or outside a limit is
            NOT_AUTHORIZED."
          maxProperties: 32
          propertyNames:
            pattern: ^(?:target|parameters\.[A-Za-z_][A-Za-z0-9_]{0,63})$
          additionalProperties:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              min:
                type: number
              max:
                type: number
              oneOf:
                type: array
                minItems: 1
                maxItems: 64
                items:
                  type:
                    - string
                    - number
        validFrom:
          type: string
          format: date-time
          description: grant only, optional. Without it the grant starts when it is
            approved.
        validUntil:
          type: string
          format: date-time
          description: grant only, required. At most 366 days after validFrom (or the
            proposal).
        reason:
          type: string
          maxLength: 2000
        proposedBy:
          type: string
          description: The proposer's caller id. Always a human credential, never the
            grantee.
        proposedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - REJECTED
        resolvedBy:
          type: string
          description: Who approved or rejected it. Never the proposer or the grantee.
        resolvedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
          description: Present when REJECTED.
      examples:
        - changeId: 9f3cf733-a8ed-487c-bb58-a53950388cdf
          action: grant
          callerId: warehouse-agent
          capability: erp:release-goods
          limits:
            parameters.amount:
              max: 100000
            parameters.currency:
              oneOf:
                - INR
          validUntil: 2026-12-30T00:00:00.000Z
          reason: The warehouse agent releases goods for paid invoices up to 100000 INR
            this quarter.
          proposedBy: grant-maker
          proposedAt: 2026-10-11T03:29:05.220Z
          status: APPROVED
          resolvedBy: grant-checker
          resolvedAt: 2026-10-11T03:29:05.247Z
    authority-grant-changes-list-response.schema:
      title: Authority Grant Changes List Response
      description: Response of GET /authority-grants/changes, newest first.
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/authority-grant-change.schema"
    propose-authority-grant-change-request.schema:
      title: Propose Authority Grant Change Request
      description: Request body for POST /authority-grants/changes. A grant carries
        validUntil and optionally limits and validFrom; a revoke carries none of
        them.
      type: object
      additionalProperties: true
      required:
        - action
        - callerId
        - capability
        - reason
      properties:
        action:
          type: string
          enum:
            - grant
            - revoke
        callerId:
          type: string
          pattern: ^\S{1,256}$
          description: The callerId of the API key the grant is for. Not your own.
        capability:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*:[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$
          maxLength: 128
        limits:
          type: object
          description: "Optional, grant only. Limits on the request, by Intent path:
            target or parameters.<name>. min and max (inclusive) apply to a
            number there; oneOf lists the only values allowed there. A request
            whose value is missing, of another type, or outside a limit is
            NOT_AUTHORIZED."
          maxProperties: 32
          propertyNames:
            pattern: ^(?:target|parameters\.[A-Za-z_][A-Za-z0-9_]{0,63})$
          additionalProperties:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              min:
                type: number
              max:
                type: number
              oneOf:
                type: array
                minItems: 1
                maxItems: 64
                items:
                  type:
                    - string
                    - number
        validFrom:
          type: string
          format: date-time
          description: Optional, grant only.
        validUntil:
          type: string
          format: date-time
          description: Required for grant. In the future, after validFrom, and at most 366
            days after it.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      examples:
        - action: grant
          callerId: warehouse-agent
          capability: erp:release-goods
          limits:
            parameters.amount:
              max: 100000
            parameters.currency:
              oneOf:
                - INR
          validUntil: 2026-12-30T00:00:00.000Z
          reason: The warehouse agent releases goods for paid invoices up to 100000 INR
            this quarter.
        - action: revoke
          callerId: warehouse-agent
          capability: erp:release-goods
          reason: The warehouse agent's key is being rotated.
    authority-grant-change-response.schema:
      title: Authority Grant Change Response
      description: Response of POST /authority-grants/changes (201) and of approve and
        reject (200). A bare Authority Grant Change, no wrapper.
      $ref: "#/components/schemas/authority-grant-change.schema"
    sandbox-approval-request.schema:
      title: Sandbox Approval Request
      description: Asks the sandbox's demo approver to approve one sandbox:receipt request.
      type: object
      additionalProperties: false
      required:
        - capability
        - resourceId
      properties:
        capability:
          type: string
          const: sandbox:receipt
          description: The only capability the demo approver signs for.
        resourceId:
          type: string
          minLength: 1
          maxLength: 200
          description: The target of the request you will send, its intent.target.
    signed-approval.schema:
      title: Signed Approval
      description: A person's approval of one action, signed with their approver key.
        A request carries it in signals.approvalArtifact when its policy
        declares approvalSignals. The server checks the issuer is a trusted
        approver key, the signature, the capability, the resource, the scope and
        the expiry, and consumes the nonce, so an approval is used once.
      type: object
      additionalProperties: false
      required:
        - payload
        - signature
      properties:
        payload:
          type: object
          additionalProperties: false
          required:
            - version
            - approvalId
            - issuer
            - issuedAt
            - expiresAt
            - capability
            - resourceId
            - scope
            - nonce
          properties:
            version:
              const: 1
            approvalId:
              type: string
            issuer:
              type: object
              additionalProperties: false
              required:
                - approverId
                - keyId
              properties:
                approverId:
                  type: string
                keyId:
                  type: string
            issuedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
            capability:
              type: string
              description: The action approved, the request's intent.action.
            resourceId:
              type: string
              description: The resource approved, as the policy's approvalSignals names it,
                for example the request's target.
            scope:
              type: object
              additionalProperties: false
              required:
                - field
                - comparator
                - value
              description: "What exactly is approved: an amount limit, or exactly this
                resource."
              properties:
                field:
                  type: string
                comparator:
                  type: string
                  enum:
                    - eq
                    - lte
                    - gte
                    - lt
                    - gt
                    - between
                value:
                  oneOf:
                    - type: number
                    - type: string
                    - type: object
                      additionalProperties: false
                      required:
                        - min
                        - max
                      properties:
                        min:
                          type: number
                        max:
                          type: number
            constraints:
              type: object
            nonce:
              type: string
              description: Consumed when the approval is used, so it is accepted once.
        signature:
          type: object
          additionalProperties: false
          required:
            - algorithm
            - keyId
            - value
            - signedAt
          properties:
            algorithm:
              type: string
              const: ed25519
            keyId:
              type: string
            value:
              type: string
              description: Base64 Ed25519 signature over the canonical payload.
            signedAt:
              type: string
              format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      x-default: 2VfYWCzt_cBAPK-8uufX6ordfY2JuQhFPsohuEumKME
      description: >
        Caller API key issued by scripts/generate-api-key.ts. Sent as
        Authorization: Bearer <key>. Verified against a stored SHA-256 hash in
        constant time by packages/api/src/auth/StaticKeyAuthenticator.ts.
        Required on every route not listed as exempt in this document's
        top-level description. See /api-reference/authentication.
  responses:
    Unauthorized:
      description: The `Authorization` header is missing, is not a bearer key, or
        names a key the server does not know. Nothing ran. Send a valid key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error.schema"
          examples:
            authRequired:
              summary: Real captured response, missing or invalid Authorization header
              value:
                error: authentication required
    RateLimited:
      description: Too many requests from this caller on this route in the last
        minute. The default limits are 30 per caller per minute on `/execute`,
        300 per IP address on `/health` and `/ready`, and 60 per IP address
        shared by the unauthenticated verification and handbook routes. The
        request never reached the handler, so nothing was recorded or executed.
        Wait the number of seconds in the `Retry-After` header, then retry.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error.schema"
          examples:
            rateLimited:
              summary: Rate limit exceeded
              value:
                error: Rate limit exceeded. Try again later.
                code: RATE_LIMITED
    SigningUnavailable:
      description: "Refused before release: nothing was executed.
        `SIGNING_UNAVAILABLE`: the server could not prove it can sign a Trust
        Record. `AUDIT_UNAVAILABLE`: the caller audit trail could not be
        written. `EXECUTION_INTENT_UNAVAILABLE`: the signed Execution Intent
        could not be stored. For these three, retry later with a new
        `businessTransactionId`, because the first one was already accepted.
        `CONNECTOR_NOT_REGISTERED`: no connector is configured for this action
        on this deployment; the operator must configure it before any retry."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error.schema"
          examples:
            executionIntentUnavailable:
              summary: The signed Execution Intent could not be stored, nothing was executed
                (real captured response)
              value:
                error: "The signed Execution Intent for business transaction
                  '2c3cae0f-fd3c-4962-8147-83f3710a2fc9' could not be created
                  and stored; refusing to release the action. Nothing was
                  executed. Cause: new row for relation \"execution_intents\"
                  violates check constraint \"sbx_block_intents\""
                code: EXECUTION_INTENT_UNAVAILABLE
            signingUnavailable:
              summary: Evidence signing is unhealthy, nothing was executed
              value:
                error: Evidence signing is unavailable; refusing to release the action because a
                  signed Execution Trust Record could not be produced. Nothing
                  was executed.
                code: SIGNING_UNAVAILABLE
            auditUnavailable:
              summary: The caller audit trail could not be written
              value:
                error: Caller authentication audit trail is unavailable; refusing to proceed
                  without an audit record.
                code: AUDIT_UNAVAILABLE
            connectorNotRegistered:
              summary: No connector is registered for the action, nothing was executed
              value:
                error: No connector is registered for capability 'paytm:refund' on this
                  deployment. Nothing was executed. The operator must configure
                  the connector.
                code: CONNECTOR_NOT_REGISTERED
