  /replay:
    post:
      tags:
        - Replay
      summary: Replay an Execution Trust Record
      operationId: replayTransaction
      description: >
        Verifies the stored signature on a Trust Record and returns its hash
        with the result. It does not

        evaluate the policy again and does not execute anything. Nothing is
        appended to the record; for a

        recorded check use `POST /verify`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/replay-request.schema"
            examples:
              vendor-payment-flow:
                summary: Real captured request
                value:
                  businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
      responses:
        "200":
          description: The check ran. Read `verified`; a `200` alone does not mean the
            signature verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/replay-response.schema"
              examples:
                vendor-payment-flow:
                  summary: Real captured response
                  value:
                    businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                    trustRecordHash: e20a8861864f1a0a6c5fe00e64abca04de18a7d165a82ef9d7beb458c2096b3f
                    verified: true
        "400":
          description: "`businessTransactionId` is missing."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                missingField:
                  summary: Real captured response
                  value:
                    error: businessTransactionId is required.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Your key has no Trust Record with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                notFound:
                  summary: Real captured response
