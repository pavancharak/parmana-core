  /trust-records:
    get:
      tags:
        - Trust Records
      summary: Bulk-export Execution Trust Records (compliance/audit)
      operationId: listTrustRecords
      description: >
        Exports your full, signed Trust Records (transaction, decision,
        executions, verifications, receipts)

        a page at a time, for audit and compliance. Filter by date with `since`
        and `until`. Paging works as

        on `GET /transactions`: a bare array, scoped to your key, and a page can
        hold fewer than `pageSize`

        items.
      parameters:
        - name: page
          description: Page number, starting at 1. Default 1.
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          description: Items per page before filtering. Default 25. Maximum 100.
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: since
          in: query
          required: false
          description: Only include records whose transaction.createdAt is on or after
            this ISO 8601 timestamp.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: Only include records whose transaction.createdAt is on or before
            this ISO 8601 timestamp.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Your Trust Records on this page. May be empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/trust-records-list-response.schema"
