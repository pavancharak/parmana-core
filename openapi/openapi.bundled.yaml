  /authority-grants/changes/{id}/approve:
    post:
      tags:
        - Authority Grants
      summary: Approve an authority grant change
      operationId: approveAuthorityGrantChange
      description: >
        Approves an authority grant change and applies it at once: `grant` makes
        the grant active,

        starting now unless it names a later `validFrom`; `revoke` ends it, so
        the caller's next request

        under a policy with `requireAuthorityGrant` is refused. A grant whose
        `validUntil` has passed is

        refused. Checked in order: a human key, not the proposer, not the
        grantee, and a step up

        authorization for this change id and action `approve`, valid once, with
        the change id in

        `payload.pendingPolicyChangeId`.
      parameters:
        - name: id
          in: path
          required: true
          description: The `changeId` from the proposal.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/approve-policy-change-request.schema"
            examples:
              stepUp:
                summary: Real captured request
                value:
                  stepUpAuthorization:
                    payload:
                      version: 1
                      nonce: 3cc39c28-9ed5-4e7d-ae2e-3f3c2bbc06ba
                      pendingPolicyChangeId: 9f3cf733-a8ed-487c-bb58-a53950388cdf
                      action: approve
                      authorizedAt: 2026-10-11T03:29:05.244Z
                      expiresAt: 2026-10-11T03:31:05.244Z
                    signature: HCrlwJPXLRR4YNa1RAW7f6mq46l0gNoqPt52vqvIzQv2NWg5EaCuqO0gAkDOgTL6nbUsTy8E0gpyf5PyKVI6Ag==
                    keyId: checker-step-up-key
                    algorithm: ed25519
      responses:
        "200":
          description: Approved and applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/authority-grant-change-response.schema"
              examples:
                approved:
                  summary: Real captured response
                  value:
                    changeId: 9f3cf733-a8ed-487c-bb58-a53950388cdf
                    action: grant
                    callerId: warehouse-agent
                    capability: erp:release-goods
                    limits:
                      parameters.amount:
                        max: 100000
                      parameters.currency:
                        oneOf:
                          - INR
                    validUntil: 2026-12-30T00:00:00.000Z
                    reason: The warehouse agent releases goods for paid invoices up to 100000 INR
                      this quarter.
                    proposedBy: grant-maker
                    proposedAt: 2026-10-11T03:29:05.220Z
                    status: APPROVED
                    resolvedBy: grant-checker
                    resolvedAt: 2026-10-11T03:29:05.247Z
                revokeApproved:
                  summary: Real captured response, a revoke
                  value:
                    changeId: 77a3b517-4ae0-4c72-8f0c-5aa6ed913df1
                    action: revoke
                    callerId: warehouse-agent
                    capability: erp:release-goods
                    reason: The warehouse agent's key is being rotated.
                    proposedBy: grant-maker
                    proposedAt: 2026-10-11T03:29:05.296Z
                    status: APPROVED
                    resolvedBy: grant-checker
                    resolvedAt: 2026-10-11T03:29:05.300Z
        "400":
          description: "`INVALID_AUTHORITY_GRANT`: the grant's `validUntil` has passed.
            Reject it and propose a new one."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                expired:
                  summary: Real captured response, a grant whose validUntil passed while it waited
                  value:
                    error: This grant's validUntil has passed. Reject it and propose a new one.
                    code: INVALID_AUTHORITY_GRANT
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`NON_HUMAN_CALLER_DENIED`, `SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE`,
            `AUTHORITY_SELF_GRANT_DENIED` (you are the grantee) or
            `STEP_UP_AUTHORIZATION_INVALID`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                sameActor:
                  summary: Real captured response
                  value:
                    error: Authority grant change '9f3cf733-a8ed-487c-bb58-a53950388cdf' was
                      proposed by this same caller — the proposer (maker) may
                      not also approve or reject it (checker).
                    code: SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE
                grantee:
                  summary: Real captured response, the grantee approving its own grant
                  value:
                    error: "'grant-checker' may not propose, approve or reject authority for
                      itself."
                    code: AUTHORITY_SELF_GRANT_DENIED
        "404":
          description: "`AUTHORITY_GRANT_CHANGE_NOT_FOUND`: no authority grant change has
            this id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: Authority grant change '00000000-0000-0000-0000-000000000000' not found.
                    code: AUTHORITY_GRANT_CHANGE_NOT_FOUND
        "409":
          description: "`CONFLICT`: the change is already resolved, or the caller now
            holds a grant (grant) or no longer does (revoke). Nothing was
            written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                alreadyResolved:
                  summary: Real captured response, the same change approved twice
                  value:
                    error: Authority grant change '9f3cf733-a8ed-487c-bb58-a53950388cdf' is already
                      APPROVED.
                    code: CONFLICT
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            # Sign the step up authorization on your own machine first:
            #   npx tsx scripts/sign-policy-change-step-up.ts --private-key-file step-up.private.pem \
            #     --key-id checker-step-up-1 --pending-policy-change-id 9f3cf733-a8ed-487c-bb58-a53950388cdf --action approve > step-up.json
            curl -X POST https://parmana-api-real.vercel.app/authority-grants/changes/9f3cf733-a8ed-487c-bb58-a53950388cdf/approve \
              -H "Authorization: Bearer $PARMANA_API_KEY" \
              -H "Content-Type: application/json" \
              --data "{\"stepUpAuthorization\": $(cat step-up.json)}"
        - lang: typescript
          label: TypeScript
          source: >-
            import { ParmanaClient, signPolicyChangeStepUp } from
            "@parmana/sdk";

            import { readFileSync } from "node:fs";


            const client = new ParmanaClient({
              endpoint: "https://parmana-api-real.vercel.app",
              apiKey: process.env.PARMANA_API_KEY!,
            });


            const stepUp = signPolicyChangeStepUp({
              pendingPolicyChangeId: "9f3cf733-a8ed-487c-bb58-a53950388cdf",
              action: "approve",
              privateKeyPem: readFileSync("step-up.private.pem", "utf8"),
              keyId: "checker-step-up-1",
            });


            const change = await client.approveAuthorityGrantChange(
              "9f3cf733-a8ed-487c-bb58-a53950388cdf",
              stepUp,
            );


            console.log(change.status);
        - lang: python
          label: Python
          source: |-
            import os
            from pathlib import Path

            from parmana import ParmanaClient
            from parmana.crypto import sign_policy_change_step_up

            client = ParmanaClient(
                endpoint="https://parmana-api-real.vercel.app",
                api_key=os.environ["PARMANA_API_KEY"],
            )

            step_up = sign_policy_change_step_up(
                pending_policy_change_id="9f3cf733-a8ed-487c-bb58-a53950388cdf",
                action="approve",
                private_key_pem=Path("step-up.private.pem").read_text(),
                key_id="checker-step-up-1",
            )

            change = client.approve_authority_grant_change(
                "9f3cf733-a8ed-487c-bb58-a53950388cdf", step_up
            )

            print(change.status)
