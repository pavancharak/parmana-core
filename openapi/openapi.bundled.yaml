            )

            me = client.caller()

            print(me.caller_id, me.allowed_capabilities)
  /execute:
    post:
      tags:
        - Execution
      summary: Execute a Business Transaction
      operationId: executeTransaction
      description: >
        Sends one action for a decision and, if approved, performs it. This is
        the call an agent makes. The

        server stores the Business Transaction, evaluates the policy, checks any
        signed human approval the

        policy requires, releases the action to its connector, and returns the
        signed Execution Trust Record.

        It runs synchronously: an approved action that calls an external system
        took 24 to 32 seconds in

        production, so set your client timeout to 120 seconds.


        **Before you send:** ask `GET /policies/in-effect?capability=<action>`
        which policy and version to

        declare and which facts to carry.


        **Idempotency:** `businessTransactionId` is a UUID you choose and the
        idempotency key. Sending the

        same id again returns `409`; it never runs twice. After a timeout, read

        `GET /execution-intents/{businessTransactionId}` before sending anything
        new.


        **What the server sets:** `status`, `createdAt` and
        `metadata.submittedBy` (from your key). Top level

        fields not in the schema are dropped.


        **Outcomes:**

        1. `200`: approved and released. The body is the signed Trust Record.

        2. `403` `POLICY_DENIED`: the policy refused. Final; nothing was
        released. A Refusal Record is kept at
           `GET /refusal/{businessTransactionId}`.
        3. `403` `CAPABILITY_NOT_ALLOWED`, or no code: your key may not invoke
        this action, or may not act for
           this principal.
        4. `503`: refused before release; nothing was executed. See the codes on
        that response.

        5. `502` `EXECUTION_OUTCOME_UNKNOWN`, `executionStatus:
        EXECUTION_UNKNOWN`: released, then the
           connector call failed, so the outcome is unknown. Do not resend under a new id. Check the target
           system, then close the intent with `POST /execution-intents/{businessTransactionId}/resolve`.
        6. `409` `AUTHORIZATION_NO_LONGER_VALID`, `executionStatus:
        NOT_EXECUTED`: decided, but at release a
           business fact it rested on was past its `validUntil`, or the authority grant had expired or been
           revoked (RFC-0023 phase 4). Nothing was sent. Send a new request.
        7. `500` `EXECUTION_RECORD_INCOMPLETE`: released, but the signed record
        could not be produced. Do not
           resend. An operator rebuilds it with `POST /execution-intents/{businessTransactionId}/finalize`.

        The examples named `vendor-payment-flow` show the response shape; their
        `payments:execute` action no

        longer exists. See [Integrate Parmana](/agents/integrate) and the

        [Error catalog](/api-reference/error-catalog).
