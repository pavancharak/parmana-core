                  summary: Real captured response
                  value:
                    pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
                    policyName: openapi-capture-demo
                    policyVersion: 1.0.0
                    proposedContent:
                      policyId: openapi-capture-demo
                      policyVersion: 1.0.0
                      schemaVersion: 1.0.0
                      rules:
                        - id: always-approve
                          condition:
                            always: true
                          outcome:
                            action: approve
                            reason: OpenAPI spec capture fixture
                    proposedBy: human-maker
                    proposedAt: 2026-09-15T03:47:13.920Z
                    status: PENDING_APPROVAL
                    reason: Capture a real Pending Policy Change for the OpenAPI spec
        "400":
          description: The name or version is malformed, `reason` is missing, or the
            content is not a valid policy. The message says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                missingReason:
                  summary: Real captured response
                  value:
                    error: reason is required.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`NON_HUMAN_CALLER_DENIED`: this needs a human key. The attempt is
            recorded in the audit trail."
          content:
            application/json:
              schema:
