    post:
      tags:
        - Approvers
      summary: Approve an approver change
      operationId: approveApprovalIssuerChange
      description: >
        Approves an approver change and applies it at once: an added key is
        trusted from the next approval

        checked; a revoked key's approvals are refused from the next request on,
        including ones it already

        signed. Checked in order: a human key, not the proposer, and a step up
        authorization for this change

        id and action `approve`, valid once. The step up authorization is the
        same one policy changes use,

        with the change id in `payload.pendingPolicyChangeId`.
      parameters:
        - name: id
          in: path
          required: true
          description: The `changeId` from the proposal.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/approve-policy-change-request.schema"
            examples:
              stepUp:
                summary: Real captured request
                value:
                  stepUpAuthorization:
                    payload:
                      version: 1
                      nonce: 0b6081da-cd57-4519-ae36-71eb1bb62432
                      pendingPolicyChangeId: ba7c5827-5844-4069-94fc-9b438ef08f78
                      action: approve
                      authorizedAt: 2026-09-28T19:05:59.733Z
                      expiresAt: 2026-09-28T19:07:59.733Z
                    signature: Nv94Q62/g4IQ0zFxDqF621Stz+JBy/4KOvLJ9+RfJO8xMw6hw06X4gzdDNEh2DxJt9xmL7VTF9TxDd9s9qmkCg==
                    keyId: human-checker-step-up-key
                    algorithm: ed25519
      responses:
        "200":
          description: Approved and applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/approval-issuer-change-response.schema"
              examples:
                approved:
                  summary: Real captured response
                  value:
                    changeId: ba7c5827-5844-4069-94fc-9b438ef08f78
                    action: add
                    approverId: manager-priya
                    keyId: manager-priya-key-1
                    publicKeyPem: |
                      -----BEGIN PUBLIC KEY-----
                      MCowBQYDK2VwAyEAEDuWHf+bbRY7J/Mr0RVmAKYHH5CDijTWhdnISXWLD6Y=
                      -----END PUBLIC KEY-----
                    reason: Priya approves refunds for the West region from October.
                    proposedBy: human-maker
                    proposedAt: 2026-09-28T19:05:59.726Z
                    status: APPROVED
                    resolvedBy: human-checker
                    resolvedAt: 2026-09-28T19:05:59.738Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`NON_HUMAN_CALLER_DENIED`, `SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE`
            or `STEP_UP_AUTHORIZATION_INVALID`. Sign a new step up authorization
            for this change and action."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                sameActor:
                  summary: Real captured response
                  value:
                    error: Approver change 'ba7c5827-5844-4069-94fc-9b438ef08f78' was proposed by
                      this same caller — the proposer (maker) may not also
                      approve or reject it (checker).
                    code: SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE
