            1 to 128 letters, digits, dots, underscores or hyphens, `reason` is
            missing or over 2000 characters, or `publicKeyPem` is not an Ed25519
            public key (on add) or is present (on revoke)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
