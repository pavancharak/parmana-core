  /policies/{name}/{version}/pending-changes:
    post:
      tags:
        - Policy Governance
      summary: Propose a policy change (maker)
      operationId: proposePolicyChange
      description: >
        Proposes new content for a policy, the maker's step in maker checker
        governance. Nothing changes

        until a different person approves it. `{version}` is the version this
        proposal changes;

        `proposedContent.policyVersion` may be the same (a correction) or new (a
        new version). The content is

        checked as `POST /policies/validate` would, and
        `proposedContent.policyId` must equal `{name}`. Needs

        a human key. See [Policy lifecycle and
        approvals](/guides/policy-lifecycle-and-approvals).
      parameters:
        - name: name
          description: The policy name, for example `customer-refund`. Not `.` or `..`.
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9._-]+$
        - name: version
          description: The version this proposal changes, for example `1.2.0`. Not `.` or
            `..`.
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9._-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/propose-policy-change-request.schema"
      responses:
        "201":
          description: Proposed and waiting for a checker. Keep the `pendingPolicyChangeId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/pending-policy-change-response.schema"
              examples:
