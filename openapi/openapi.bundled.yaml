        (the target of the request you will

        send), valid 5 minutes. Put it in your request's
        `signals.approvalArtifact`. `POST /execute` checks it like

        any other approval: a trusted approver key, the signature, the
        capability, the resource and the expiry, and

        it accepts it once. Needs the published demo key.


        Live at `https://parmana-sandbox.vercel.app`. The request that uses it
        carries

        `signals: { "note": "<the same text as parameters.note>",
        "receiptApproved": true, "approvalArtifact": <this response> }`,

        with `target` equal to the `resourceId` you named here. The
        [Playground](/playground) walks through every step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/sandbox-approval-request.schema"
      responses:
        "201":
          description: The signed approval. Send it as `signals.approvalArtifact` within 5
            minutes; it is accepted once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/signed-approval.schema"
              examples:
                approved:
                  summary: Real captured response
                  value:
                    payload:
                      version: 1
                      approvalId: f328a67e-a527-4119-8617-1eadead9367d
                      issuer:
                        approverId: sandbox-demo-approver
                        keyId: sandbox-demo-approver-key-1
                      issuedAt: 2026-10-01T11:10:57.825Z
                      expiresAt: 2026-10-01T11:15:57.825Z
                      capability: sandbox:receipt
                      resourceId: demo-order-1
                      scope:
                        field: resourceId
                        comparator: eq
                        value: demo-order-1
                      nonce: 9c199e50-746d-409f-98f4-26c319af22ae
                    signature:
                      algorithm: ed25519
                      keyId: sandbox-demo-approver-key-1
                      value: H5Anvojj4J3325IkJnL/SD50WEDJxhv7AafGgkSauSyQKQ6y3Fw5d+ZoC0k2BUfDDJvR0jn1IDgZ/1I+nx6ZAQ==
                      signedAt: 2026-10-01T11:10:57.825Z
        "400":
          description: "`INVALID_SANDBOX_APPROVAL_REQUEST`: `capability` is not
            `sandbox:receipt`, or `resourceId` is missing, empty or over 200
            characters. Nothing was signed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                otherCapability:
                  summary: Real captured response, capability paytm:refund
                  value:
                    error: The sandbox approver signs only for capability "sandbox:receipt".
                    code: INVALID_SANDBOX_APPROVAL_REQUEST
                missingResource:
                  summary: Real captured response, no resourceId
                  value:
                    error: "resourceId is required: the request's target, at most 200 characters."
                    code: INVALID_SANDBOX_APPROVAL_REQUEST
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: >-
            curl -X POST
            https://parmana-sandbox.vercel.app/sandbox/approvals   -H
            "Authorization: Bearer $PARMANA_API_KEY"   -H "Content-Type:
            application/json"   -d '{
                "capability": "sandbox:receipt",
                "resourceId": "demo-order-1"
              }'
        - lang: typescript
          label: TypeScript
          source: >-
            // Sandbox only, and not in the SDK: a demo for trying Parmana, not
            part of

            // the product API. Call the route directly.

            const response = await fetch(
              "https://parmana-sandbox.vercel.app/sandbox/approvals",
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${process.env.PARMANA_API_KEY}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  capability: "sandbox:receipt",
                  resourceId: "demo-order-1",
                }),
              },
            );


            // Send it as signals.approvalArtifact within 5 minutes.

            const approval: unknown = await response.json();


            console.log(response.status, approval);
        - lang: python
          label: Python
          source: >-
            # Sandbox only, and not in the SDK: a demo for trying Parmana, not
            part of

            # the product API. Call the route directly.

            import os


            import requests


            response = requests.post(
                "https://parmana-sandbox.vercel.app/sandbox/approvals",
                headers={"Authorization": f"Bearer {os.environ['PARMANA_API_KEY']}"},
                json={"capability": "sandbox:receipt", "resourceId": "demo-order-1"},
                timeout=30,
            )


            # Send it as signals.approvalArtifact within 5 minutes.

            approval = response.json()


            print(response.status_code, approval)
components:
  schemas:
    Error:
      $ref: "#/components/schemas/error.schema"
    root-response.schema:
      title: Root Response
      description: Response returned by GET / (packages/api/src/app.ts). Distinct
        from, and simpler than, GET /health and GET /version; it is not
        registered under any router file.
      type: object
      additionalProperties: false
      required:
        - name
        - status
      properties:
        name:
          type: string
          enum:
            - Parmana
        status:
          type: string
          enum:
            - UP
      examples:
        - name: Parmana
          status: UP
    error.schema:
      title: Error Response
      description: Shared error envelope produced by
        packages/api/src/middleware/error-handler.ts and by every route's inline
        validation checks. error is always a plain human-readable string (never
        a nested object). code is present only when the failure was a
        RuntimeError subclass reaching the centralized error handler
        (VerificationFailedError, ReceiptGenerationError, or an uncategorized
        RuntimeError); it is absent from every inline route-level check
        (businessTransactionId format/required checks) and from
        BusinessTransactionValidationError, PolicyValidationError,
        SignalValidationError, PolicyNotFoundError,
        DuplicateBusinessTransactionError, and the generic 500 fallback. POST
        /policies/validate does NOT use this envelope at all. See its own
        response schema. For the triggering condition and recommended caller
        action behind any specific error/code/status combination, see the Error
        catalog at /api-reference/error-catalog.
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Stable machine-readable error code. Only present for errors that
            reach the handler as a RuntimeError.
          examples:
            - RUNTIME_ERROR
            - VERIFICATION_FAILED
            - RECEIPT_GENERATION_FAILED
            - POLICY_DENIED
            - CAPABILITY_NOT_ALLOWED
            - RATE_LIMITED
            - AUDIT_UNAVAILABLE
            - SIGNING_UNAVAILABLE
            - CONNECTOR_NOT_REGISTERED
            - EXECUTION_RECORD_INCOMPLETE
            - EXECUTION_INTENT_UNAVAILABLE
            - EXECUTION_INTENT_RESULT_NOT_RECORDED
            - EXECUTION_INTENT_NOT_FOUND
            - EXECUTION_INTENTS_NOT_ENABLED
            - EXECUTION_INTENT_NOT_RESOLVABLE
            - EXECUTION_INTENT_RESOLUTION_INVALID
            - NON_HUMAN_CALLER_DENIED
            - EXECUTION_OUTCOME_UNKNOWN
            - AUTHORIZATION_NO_LONGER_VALID
        executionStatus:
          type: string
          enum:
            - EXECUTION_UNKNOWN
            - NOT_EXECUTED
          description: "RFC-0023 phase 4. EXECUTION_UNKNOWN with
            EXECUTION_OUTCOME_UNKNOWN: the action was released and the call
            failed, so whether it ran is unknown; never reported as failed, and
            the Execution Intent stays ERRORED until a person resolves it.
            NOT_EXECUTED with AUTHORIZATION_NO_LONGER_VALID: the release was
            refused because a business condition or the authority grant it
            rested on no longer held, and nothing was sent."
      examples:
        - error: businessTransactionId must be a valid UUID.
        - error: Business Transaction 'eed2a972-1bf5-4166-8472-761f76fbf1b2' already
            exists.
        - error: "Execution rejected: Vendor payment rejected because the assessed payment
            risk exceeds the maximum permitted threshold."
          code: RUNTIME_ERROR
    health-response.schema:
      title: Health Response
      description: 'Response returned by GET /health. The route unconditionally
        returns status: "UP"; it does not check storage, policy, or any
        dependent component; a 200 response means only that the Express process
        is handling requests.'
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
      examples:
        - status: UP
    ready-response.schema:
      title: Ready Response
      description: "Response returned by GET /ready on both status codes (200 READY,
        503 NOT_READY). Distinct from GET /health's pure liveness check: when
        storage is Supabase-backed, this one actually queries Postgres (SELECT
        1) so an orchestrator can route around a process that is up but backed
        by dead storage."
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - READY
            - NOT_READY
        storage:
          type: string
          description: "Present only when status is READY and storage is not
            Supabase-backed (NODE_ENV=test, or PARMANA_STORAGE=memory outside
            test): there is no external dependency to probe, so readiness is
            reported unconditionally."
          enum:
            - not-supabase-backed
        reason:
          type: string
          description: "Present only when status is NOT_READY: the underlying Postgres
            error message."
        authDisabled:
          type: boolean
          description: True when this process was started with PARMANA_AUTH_DISABLED=true.
            Surfaced here, not only as a startup log line, so an operator's own
            synthetic checks against GET /ready can alert on it directly.
        warning:
          type: string
          description: Present only when authDisabled is true.
      examples:
        - status: READY
          storage: not-supabase-backed
          authDisabled: false
        - status: READY
          storage: not-supabase-backed
          authDisabled: true
          warning: PARMANA_AUTH_DISABLED=true -- this deployment is accepting requests
            with no caller authentication. Must never be set in a real
            deployment.
    version-response.schema:
      title: Version Response
      description: Response returned by GET /version. All three fields are hardcoded
        literals in packages/api/src/routes/version.ts, not read from
        package.json or any build metadata.
      type: object
      additionalProperties: false
      required:
        - name
        - version
        - api
      properties:
        name:
          type: string
          enum:
            - Parmana
        version:
          type: string
          description: Hardcoded running service version string.
        api:
          type: string
          enum:
            - v1
      examples:
        - name: Parmana
          version: 0.4.0
          api: v1
    callers-me-response.schema:
      title: Callers Me Response
      description: "Response returned by GET /callers/me
        (packages/api/src/routes/callers-me.ts). Resolved, not raw:
        allowedPrincipalIds/allowedCapabilities reflect the effective scope
        after defaults are applied (isPrincipalAllowed.ts /
        isCapabilityAllowed.ts), not the raw ApiKeyEntry configuration. Never
        returns key material."
      type: object
      additionalProperties: false
      required:
        - callerId
        - allowedPrincipalIds
        - allowedCapabilities
        - unrestrictedCapabilities
      properties:
        callerId:
          type: string
          description: The authenticated caller's identity.
        allowedPrincipalIds:
          type: array
          items:
            type: string
          description: Principal IDs this caller may assert as authority.principalId.
            Defaults to [callerId] when the key's allowedPrincipalIds is unset.
        allowedCapabilities:
          type: array
          items:
            type: string
          description: Capabilities (intent.action values) this caller may execute.
            Defaults to an empty array, not all capabilities, when the key's
            allowedCapabilities is unset.
        unrestrictedCapabilities:
          type: boolean
          description: True when allowedCapabilities contains the wildcard "*".
      examples:
        - callerId: demo
          allowedPrincipalIds:
            - demo
          allowedCapabilities:
            - test:fixture-execute
          unrestrictedCapabilities: false
    metadata.schema:
      title: Metadata
      description: Immutable Business Transaction metadata supplied by the calling
        application. Not evaluated by Policy. businessTransactionId is the only
        required field; it must match the top-level businessTransactionId.
        Parmana rejects a mismatch with a 400.
      type: object
      additionalProperties: true
      required:
        - businessTransactionId
      properties:
        businessTransactionId:
          type: string
          format: uuid
          description: Unique Business Transaction identifier. Must be a valid UUID.
        correlationId:
          type: string
          description: Optional correlation identifier used by the calling application.
        tenantId:
          type: string
          description: Optional tenant identifier for multi-tenant deployments.
        sourceSystem:
          type: string
          description: Originating application or service.
        submittedBy:
          type: string
          description: Identity of the calling application or principal.
        submittedAt:
          type: string
          format: date-time
          description: UTC timestamp when the Business Transaction was submitted.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
          correlationId: 6b97caca-1605-4711-bf00-7e5a65434d93
          sourceSystem: vendor-payment-service
          submittedBy: ap-automation
          submittedAt: 2026-07-07T16:38:59.285Z
    authority.schema:
      title: Authority
      description: Entity empowered to authorize execution within a trust domain.
        Immutable once issued.
      type: object
      additionalProperties: true
      required:
        - authorityId
        - authorityType
        - principalId
        - issuedAt
      properties:
        authorityId:
          type: string
          description: Unique Authority identifier.
        authorityType:
          type: string
          description: Type of authority.
          enum:
            - USER
            - ROLE
            - SERVICE
            - ORGANIZATION
        principalId:
          type: string
          description: Principal identifier.
        displayName:
          type: string
          description: Human-readable display name.
        issuedAt:
          type: string
          format: date-time
          description: UTC timestamp when Authority became effective.
      examples:
        - authorityId: c0c01c23-04a2-45f2-a821-ef24bfca02d3
          authorityType: SERVICE
          principalId: ap-automation-svc
          displayName: Accounts Payable Automation
          issuedAt: 2026-07-07T16:38:59.285Z
    authorization.schema:
      title: Authorization
      description: Immutable trust artifact proving that an Authority granted approval
        for an intended execution.
      type: object
      additionalProperties: true
      required:
        - authorizationId
        - authorityId
        - purpose
        - issuedAt
      properties:
        authorizationId:
          type: string
          description: Unique Authorization identifier.
        authorityId:
          type: string
          description: Authority issuing this Authorization. Must match
            authority.authorityId. Parmana rejects a mismatch with a 400.
        purpose:
          type: string
          description: Business purpose for which the Authorization was granted.
        issuedAt:
          type: string
          format: date-time
          description: UTC timestamp when the Authorization was issued.
        expiresAt:
          type: string
          format: date-time
          description: Optional expiration timestamp. After this time the Authorization is
            no longer valid.
      examples:
        - authorizationId: 6e9d6aa6-6d20-40a8-b05d-383516365cc7
          authorityId: c0c01c23-04a2-45f2-a821-ef24bfca02d3
          purpose: Authorize vendor payment disbursement
          issuedAt: 2026-07-07T16:38:59.285Z
    intent.schema:
      title: Intent
      description: Immutable declaration of the action an Authority intends to be
        executed under an Authorization.
      type: object
      additionalProperties: true
      required:
        - intentId
        - authorizationId
        - action
        - target
        - parameters
        - createdAt
      properties:
        intentId:
          type: string
          description: Unique Intent identifier.
        authorizationId:
          type: string
          description: Authorization under which this Intent was created. Must match
            authorization.authorizationId. Parmana rejects a mismatch with a
            400.
        action:
          type: string
          description: Business action being requested. Required and non-empty. Parmana
            rejects an empty action with a 400.
          examples:
            - VendorPayment
            - TransferFunds
            - DeployApplication
        target:
          type: string
          description: Target of the intended action.
          examples:
            - vendor/V-100
            - account/12345
        parameters:
          type: object
          description: Immutable business parameters describing the intended action. Not
            evaluated by policy, see signals.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp when the Intent was created.
      examples:
        - intentId: ae5865f6-181b-409a-90ec-1b4b8b8414ba
          authorizationId: 6e9d6aa6-6d20-40a8-b05d-383516365cc7
          action: payments:execute
          target: vendor/V-100
          parameters:
            amount: 4500
            currency: USD
          createdAt: 2026-07-07T16:38:59.285Z
    policy.schema:
      title: Policy Reference
      description: Exact Policy to evaluate. The client explicitly supplies name,
        version, and schemaVersion; Parmana does not automatically discover or
        select a policy. If no matching policy file exists at
        policies/{name}/{version}/policy.json, the request fails with a 404
        (policyId/policyVersion on POST /policies/validate) or a RUNTIME_ERROR
        (name/version elsewhere, from PolicyNotFoundError not otherwise mapped
        by the shared error handler in every route, see the error envelope
        note).
      type: object
      additionalProperties: true
      required:
        - name
        - version
        - schemaVersion
      properties:
        name:
          type: string
          description: Policy name. Required and non-empty. Parmana rejects an empty name
            with a 400.
          minLength: 1
        version:
          type: string
          description: Business policy version. Required and non-empty. Parmana rejects an
            empty version with a 400.
          minLength: 1
          examples:
            - 2.0.0
            - 1.0.0
        schemaVersion:
          type: string
          description: Signals schema version expected by the policy.
          examples:
            - 1.0.0
        contentHash:
          type: string
          description: sha256 of the canonicalized policy.json content actually loaded for
            this decision (G-24). Server-computed, never caller-settable; absent
            on a request-supplied PolicyReference and on a PolicyReference built
            before this field existed. Only present on the copy embedded in an
            Execution Trust Record's transaction.policy.
        governanceAnchor:
          type: object
          description: Whether the policy content above is traceable to a completed Policy
            Governance approval, resolved at decision time (G-45). Absent on a
            PolicyReference built before this field existed. Its presence does
            not imply POLICY_EXECUTION_VERIFICATION_ENFORCED is on -- only that
            the lookup ran and recorded what it found, which may honestly be "no
            approval record exists for this policy yet."
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - VERIFIED
                - NO_APPROVAL_RECORD
                - SIGNATURE_INVALID
                - CONTENT_MISMATCH
            approvalRecordId:
              type: string
              description: The PolicyChangeApprovalRecord this anchor resolved against.
                Present only when a record was found at all -- absent for
                NO_APPROVAL_RECORD.
      examples:
        - name: vendor-payment
          version: 2.0.0
          schemaVersion: 1.0.0
        - name: vendor-payment
          version: 2.0.0
          schemaVersion: 1.0.0
          contentHash: 3f2504e04f8964e7ad0dbb0cf7fea1b4e0e1e0a3a1e1a4b6c8e0d5f6a7b8c9d0
          governanceAnchor:
            status: NO_APPROVAL_RECORD
    signals.schema:
      title: Signals
      description: Opaque runtime facts evaluated by the resolved Policy's rules.
        Parmana assigns no business meaning to these values and does not
        statically validate them beyond the Policy's own signalsSchema
        declaration (see policies/{name}/{version}/policy.json). Scaled
        integers, not floats, for numeric signals such as amounts (house
        convention across every reference policy).
      type: object
      additionalProperties: true
      examples:
        - vendorVerified: true
          invoiceVerified: true
          paymentApproved: true
          sufficientFunds: true
          paymentAmount: 4500
          riskScore: 10
    transaction-create-request.schema:
      title: Transaction Create Request
      description: "Request payload for POST /execute and POST /transactions. status
        and createdAt are assigned by Parmana and must not be supplied by the
        client. Validation performed identically by both endpoints (each has its
        own inline businessTransactionId UUID check, then shares
        BusinessTransactionMapper.fromRequest and BusinessTransactionValidator):
        metadata.businessTransactionId must equal businessTransactionId;
        authorization.authorityId must equal authority.authorityId;
        intent.authorizationId must equal authorization.authorizationId;
        policy.name, policy.version, and intent.action must each be non-empty.
        No other structural validation is performed: authority, authorization,
        intent, policy, and signals objects are otherwise passed through as
        supplied, including any additional properties."
      type: object
      additionalProperties: true
      required:
        - businessTransactionId
        - metadata
        - authority
        - authorization
        - intent
        - policy
        - signals
      properties:
        businessTransactionId:
          type: string
          format: uuid
          description: Unique Business Transaction identifier. Must be a valid UUID on
            both POST /execute and POST /transactions (rejected with 400
            otherwise).
        metadata:
          $ref: "#/components/schemas/metadata.schema"
        authority:
          $ref: "#/components/schemas/authority.schema"
        authorization:
          $ref: "#/components/schemas/authorization.schema"
        intent:
          $ref: "#/components/schemas/intent.schema"
        policy:
          $ref: "#/components/schemas/policy.schema"
        signals:
          $ref: "#/components/schemas/signals.schema"
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
          metadata:
            businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
            correlationId: 6b97caca-1605-4711-bf00-7e5a65434d93
            sourceSystem: vendor-payment-service
            submittedBy: ap-automation
            submittedAt: 2026-07-07T16:38:59.285Z
          authority:
            authorityId: c0c01c23-04a2-45f2-a821-ef24bfca02d3
            authorityType: SERVICE
            principalId: ap-automation-svc
            displayName: Accounts Payable Automation
            issuedAt: 2026-07-07T16:38:59.285Z
          authorization:
            authorizationId: 6e9d6aa6-6d20-40a8-b05d-383516365cc7
            authorityId: c0c01c23-04a2-45f2-a821-ef24bfca02d3
            purpose: Authorize vendor payment disbursement
            issuedAt: 2026-07-07T16:38:59.285Z
          intent:
            intentId: ae5865f6-181b-409a-90ec-1b4b8b8414ba
            authorizationId: 6e9d6aa6-6d20-40a8-b05d-383516365cc7
            action: payments:execute
            target: vendor/V-100
            parameters:
              amount: 4500
              currency: USD
            createdAt: 2026-07-07T16:38:59.285Z
          policy:
            name: vendor-payment
            version: 2.0.0
            schemaVersion: 1.0.0
          signals:
            vendorVerified: true
            invoiceVerified: true
            paymentApproved: true
            sufficientFunds: true
            paymentAmount: 4500
            riskScore: 10
    business-transaction.schema:
      title: Business Transaction
      description: "Canonical immutable business context accepted by Parmana for
        execution: Authority -> Authorization -> Intent -> Business Transaction
        -> Policy. Every Business Transaction produces exactly one Decision, one
        Execution, and one Execution Trust Record."
      type: object
      additionalProperties: true
      required:
        - businessTransactionId
        - metadata
        - authority
        - authorization
        - intent
        - policy
        - signals
        - status
        - createdAt
      properties:
        businessTransactionId:
          type: string
          format: uuid
          description: Unique Business Transaction identifier. Same value as
            metadata.businessTransactionId. Must be a valid UUID on both POST
            /execute and POST /transactions (rejected with a 400 otherwise).
        metadata:
          $ref: "#/components/schemas/metadata.schema"
        authority:
          $ref: "#/components/schemas/authority.schema"
        authorization:
          $ref: "#/components/schemas/authorization.schema"
        intent:
          $ref: "#/components/schemas/intent.schema"
        policy:
          $ref: "#/components/schemas/policy.schema"
        signals:
          $ref: "#/components/schemas/signals.schema"
        status:
          type: string
          description: Current Business Transaction lifecycle state. Always RECEIVED at
            creation on both POST /execute and POST /transactions. Parmana sets
            this field via BusinessTransactionMapper.fromRequest and ignores any
            status the client sends.
          enum:
            - RECEIVED
            - POLICY_EVALUATED
            - APPROVED
            - REJECTED
            - OVERRIDDEN
            - EXECUTING
            - EXECUTED
            - FAILED
            - VERIFIED
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp when the Business Transaction was accepted by Parmana.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
          metadata:
            businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
            correlationId: 6b97caca-1605-4711-bf00-7e5a65434d93
            sourceSystem: vendor-payment-service
            submittedBy: ap-automation
            submittedAt: 2026-07-07T16:38:59.285Z
