  /authority-grants/changes:
    post:
      tags:
        - Authority Grants
      summary: Propose granting or revoking an agent's authority
      operationId: proposeAuthorityGrantChange
      description: >
        Proposes per-agent authority (RFC-0023 phase 3): `grant` says the API
        key with `callerId` may have

        requests for `capability` decided, within `limits` on the request, until
        `validUntil` (at most 366

        days); `revoke` ends the active grant. Nothing changes until a different
        person approves it. You

        may not propose authority for your own key. Under a policy with
        `requireAuthorityGrant`, a request

        from a key with no grant in force, or outside its limits, is refused as
        `NOT_AUTHORIZED`, and one

        after `validUntil` as `AUTHORITY_EXPIRED`. To change a grant, revoke it,
        then grant again. Needs a

        human key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/propose-authority-grant-change-request.schema"
            examples:
              grant:
                summary: Real captured request
                value:
                  action: grant
                  callerId: warehouse-agent
                  capability: erp:release-goods
                  limits:
                    parameters.amount:
                      max: 100000
                    parameters.currency:
                      oneOf:
                        - INR
                  validUntil: 2026-12-30T00:00:00.000Z
                  reason: The warehouse agent releases goods for paid invoices up to 100000 INR
                    this quarter.
              revoke:
                summary: Real captured request
                value:
                  action: revoke
                  callerId: warehouse-agent
                  capability: erp:release-goods
                  reason: The warehouse agent's key is being rotated.
      responses:
        "201":
          description: Proposed and waiting for a checker. Keep the `changeId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/authority-grant-change-response.schema"
              examples:
                grant:
                  summary: Real captured response
                  value:
                    changeId: 9f3cf733-a8ed-487c-bb58-a53950388cdf
                    action: grant
                    callerId: warehouse-agent
                    capability: erp:release-goods
                    limits:
                      parameters.amount:
                        max: 100000
                      parameters.currency:
                        oneOf:
                          - INR
                    validUntil: 2026-12-30T00:00:00.000Z
