  /external-connectors/changes:
    post:
      tags:
        - External Connectors
      summary: Propose registering or revoking an external connector
      operationId: proposeExternalConnectorChange
      description: >
        Proposes connecting your own system to Parmana with no Parmana code
        change: `register` names a

        capability, the HTTPS endpoint to release it to, the policy that governs
        it, the parameters to

        forward and optionally a timeout; `revoke` ends the active registration
        for a capability. Nothing

        changes until a different person approves it. The endpoint must be
        `https`, name a domain (not an IP

        address or localhost), carry no user name, password or fragment, and
        resolve only to public

        addresses; the address is checked again on approval and at every
        release. Capabilities in a built in

        namespace (`paytm`, `hubspot`, `github`, `slack`, `test`) are refused.
        To move a capability, revoke

        it, then register the new endpoint. Needs a human key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/propose-external-connector-change-request.schema"
            examples:
              register:
                summary: Real captured request
                value:
                  action: register
                  capability: erp:create-invoice
                  endpointUrl: https://erp.example.com/parmana/release
                  policy: erp-invoice
                  allowedParameters:
                    - amount
                    - currency
                    - customerId
                  timeoutMs: 10000
                  reason: Finance creates invoices in the ERP through Parmana from October.
              revoke:
                summary: Real captured request
                value:
                  action: revoke
                  capability: erp:create-invoice
                  reason: The ERP endpoint moves to a new host.
      responses:
        "201":
          description: Proposed and waiting for a checker. Keep the `changeId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/external-connector-change-response.schema"
              examples:
                register:
                  summary: Real captured response
                  value:
                    changeId: 1aa68ad8-ab5c-4beb-9ff3-7a6b1fc1ff37
                    action: register
                    capability: erp:create-invoice
                    endpointUrl: https://erp.example.com/parmana/release
                    policy: erp-invoice
                    allowedParameters:
                      - amount
                      - currency
                      - customerId
                    timeoutMs: 10000
                    reason: Finance creates invoices in the ERP through Parmana from October.
                    proposedBy: human-maker
                    proposedAt: 2026-09-30T17:25:46.316Z
                    status: PENDING_APPROVAL
                revoke:
                  summary: Real captured response
                  value:
                    changeId: 5bdbfd6a-babf-4977-b090-d561ddcee0d7
                    action: revoke
                    capability: erp:create-invoice
                    reason: The ERP endpoint moves to a new host.
                    proposedBy: human-maker
                    proposedAt: 2026-09-30T17:25:46.418Z
                    status: PENDING_APPROVAL
        "400":
          description: "`INVALID_EXTERNAL_CONNECTOR`: a field is missing or malformed, the
            namespace is built in, or a revoke carries registration fields.
            `EXTERNAL_ENDPOINT_ADDRESS_REFUSED`: the endpoint is not https,
            names an IP address or localhost, resolves to an address that is not
            public, or does not resolve."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                builtInNamespace:
                  summary: Real captured response
                  value:
                    error: The namespace 'paytm' belongs to a built in connector. Use another
                      namespace.
                    code: INVALID_EXTERNAL_CONNECTOR
                privateAddress:
                  summary: Real captured response
                  value:
                    error: The endpoint host 'erp-internal.example.com' resolves to an address that
                      is not public (10.0.0.7).
                    code: EXTERNAL_ENDPOINT_ADDRESS_REFUSED
                badCapability:
                  summary: Real captured response
                  value:
                    error: capability must be namespace:verb, at most 128 characters, matching
                      ^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*:[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$.
                    code: INVALID_EXTERNAL_CONNECTOR
                badTimeout:
                  summary: Real captured response
                  value:
                    error: timeoutMs must be an integer from 1000 to 30000; it defaults to 10000.
                    code: INVALID_EXTERNAL_CONNECTOR
                duplicateParameter:
                  summary: Real captured response
                  value:
                    error: allowedParameters must be an array of at most 64 distinct names, each
                      matching ^[A-Za-z_][A-Za-z0-9_]{0,63}$.
                    code: INVALID_EXTERNAL_CONNECTOR
                revokeWithRegistrationFields:
                  summary: Real captured response
                  value:
                    error: A revoke takes only action, capability and reason.
                    code: INVALID_EXTERNAL_CONNECTOR
                plainHttp:
                  summary: Real captured response
                  value:
                    error: endpointUrl must use https.
                    code: EXTERNAL_ENDPOINT_ADDRESS_REFUSED
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`NON_HUMAN_CALLER_DENIED`: this needs a human key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                service:
                  summary: Real captured response, a service credential
                  value:
                    error: "This action requires a caller credential provisioned as a verified human
                      (credentialHolderType: USER)."
                    code: NON_HUMAN_CALLER_DENIED
        "409":
          description: "`CONFLICT`: the capability already has an active registration (to
