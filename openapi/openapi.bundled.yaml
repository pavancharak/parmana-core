  /execution-intents/{businessTransactionId}/resolve:
    post:
      tags:
        - Execution Intents
      summary: Close an intent you reconciled by hand
      operationId: resolveExecutionIntent
      description: >
        Closes an intent in state `PREPARED` or `ERRORED` after a person checked
        the target system, the

        repair for a `502` `EXECUTION_OUTCOME_UNKNOWN`. Record what you found,
        `NOT_EXECUTED` or `EXECUTED`,

        with a note. The intent becomes `RESOLVED` and leaves the unfinalized
        list. It never calls the

        connector. Safe to repeat: a second call returns `ALREADY_RESOLVED` with
        the first answer.

        **The resolution is an attributed, timestamped statement in the intent's
        unsigned status. It is not

        tamper evident and it is not a Trust Record.** Needs a human key.
      parameters:
        - name: businessTransactionId
          description: The transaction's id.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/execution-intent-resolve-request.schema"
      responses:
        "200":
          description: The intent is closed. `outcome` is `RESOLVED` when this call closed
            it, `ALREADY_RESOLVED` when it was already closed.
