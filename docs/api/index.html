<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parmana API reference</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    body { margin: 0; }
    .intro { font-family: system-ui, sans-serif; max-width: 880px; margin: 24px auto; padding: 0 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="intro">
    <h1>Parmana API reference</h1>
    <p>
      Every operation in the OpenAPI document, with its request and response schemas and examples.
      The <strong>Try it out</strong> panels call the production API. Experimental operations are marked
      <code>x-stability: experimental</code>. The document is
      <a href="../site/openapi.bundled.yaml">openapi.bundled.yaml</a>.
    </p>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
  <script>
    window.addEventListener("load", function () {
      window.ui = SwaggerUIBundle({
        url: "../site/openapi.bundled.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
      });
    });
  </script>
</body>
</html>
