[build-system]
requires = [
    "setuptools>=77.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "parmana-connector-sdk"
version = "0.2.0"
description = "Connector authoring contracts and reference implementations for Parmana, the authorization layer for AI execution."

readme = { file = "README.md", content-type = "text/markdown" }

requires-python = ">=3.10"

license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

authors = [
    { name = "Parmana" }
]

keywords = [
    "ai",
    "agentic-ai",
    "governance",
    "authorization",
    "connector",
    "integration",
    "sdk"
]

classifiers = [
    "Development Status :: 4 - Beta",

    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",


    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/pavancharak/parmana"
Website = "https://parmanasystems.com/"
Documentation = "https://docs.parmanasystems.com"
Repository = "https://github.com/pavancharak/parmana"
Issues = "https://github.com/pavancharak/parmana/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["parmana_connector_sdk*"]

[tool.setuptools.package-data]
parmana_connector_sdk = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.mypy]
python_version = "3.10"
packages = ["parmana_connector_sdk"]
strict = true
warn_unused_ignores = true
