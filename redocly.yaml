extends:
  - recommended

# Adjudicated lint exceptions for openapi/openapi.yaml.
#
# Each rule below is disabled because the finding it reports is not a
# defect in the spec — it is the spec accurately describing real,
# intentional behavior of the running service. Do not re-enable one of
# these without first confirming the underlying behavior actually
# changed.
rules:
  # No route in the API validates any credential, token, or identity —
  # this is real, current, and documented behavior (see docs/CLAIMS.md,
  # "API-layer authentication and authorization", and the security note
  # at the top of openapi/openapi.yaml's info.description). There is no
  # security scheme to declare because none exists in the deployed
  # service.
  security-defined: off

  # servers[0].url is http://localhost:3000 — the only real server this
  # API runs behind (packages/api, PORT env var, default 3000). There is
  # no example.com placeholder to replace; this rule's heuristic just
  # doesn't have a case for "the only environment is local."
  no-server-example.com: off

  # GET /, GET /health, and GET /version have no error path in the
  # implementation (packages/api/src/app.ts, routes/health.ts,
  # routes/version.ts) — each unconditionally returns 200. Documenting a
  # 4xx response for them would describe behavior that does not exist.
  operation-4xx-response: off

  # Redocly's example validator re-resolves each schema's relative $refs
  # (e.g. "./metadata.schema.json") against that schema's own absolute
  # $id (e.g. https://schemas.parmanasystems.com/common/...), rather than against
  # the schema's real filesystem location — an interop quirk of Redocly's
  # resolver, not a broken $ref or a bad example. Every example flagged
  # by these two rules has been independently validated against the
  # schemas as authored, on disk, under JSON Schema draft-2020-12 (33/33
  # passing) — see the OpenAPI alignment session notes for how.
  no-invalid-media-type-examples: off
  no-invalid-schema-examples: off
