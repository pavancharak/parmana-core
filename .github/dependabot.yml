version: 2
updates:
  # Minor and patch updates arrive as one grouped pull request per week;
  # each major update gets its own, since it may need code changes.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Majors that break the build or the tests today, or that target a Node
    # line this project does not run (package.json "engines": Node 24).
    # Each is a planned upgrade with code changes, not a dependency bump.
    # Minor and patch updates of these still arrive.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directories:
      - "/python"
      - "/python-connector-sdk"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # python/requirements-dev.txt is generated by uv from pyproject.toml.
    # These two are pulled in only by pydoc-markdown, which pins them
    # (docspec-python needs docspec 2.2.1; pydoc-markdown needs
    # docstring-parser below 0.12). Dependabot bumps them line by line
    # without that check, which makes the file uninstallable (see #45).
    # They move when pydoc-markdown does, by regenerating the file.
    ignore:
      - dependency-name: "docspec"
      - dependency-name: "docstring-parser"

  # Digest and minor updates only: the runtime targets Node 24 (see
  # "engines" in package.json), so a new Node major is a deliberate
  # change, not a dependency bump.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"

  # Keeps the SHA-pinned actions in .github/workflows/*.yml current —
  # Dependabot understands the "@<sha> # vX.Y.Z" comment convention and
  # opens a PR bumping both when a new release is out. One grouped pull
  # request, so github/codeql-action's init, analyze and upload-sarif
  # always move to the same version together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
