name: Production readiness gate

# Strict, fail-closed release gate.
#
# The engine and policy are pinned to the commit in ENGINE_SHA below. They do
# not come from whatever is on main, or from the change under review. Changing
# the pin is a reviewed change to this file (CODEOWNERS), so the rules a commit
# is judged by are always a reviewed, named version.
#
# Owner records are read from the base branch of the pull request, so an
# approval counts only once it is merged.
#
# Bootstrap: the engine's first introduction is recorded in
# production-readiness/decisions/PRG-D1-bootstrap.md. See docs/PRODUCTION_READINESS.md.
#
# pull_request_target is deliberately not used: this job runs the pull request's
# code, so it must not receive write permissions or secrets from the base.

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  # Commit that holds the reviewed engine and policy. PRG-D1 introduced the engine
  # at 1173d06; PRG-D2 moves the pin to d93f4d1 (event-scoped checks, G7 wait).
  # Change only by a reviewed pull request that also records the decision.
  ENGINE_SHA: d93f4d129a9e2e00087bc706145543ef4f076d1b

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: production-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the change under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: change

      - name: Check out the pinned engine and policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: trusted
          ref: ${{ env.ENGINE_SHA }}

      - name: Check out the base branch (owner records)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: base
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Confirm the pinned engine exists
        run: |
          engine="trusted/production-readiness/scripts/evaluate-gates.py"
          policy="trusted/production-readiness/policies/readiness-policy.json"
          if [ ! -f "$engine" ] || [ ! -f "$policy" ]; then
            echo "::error::The pinned engine ($ENGINE_SHA) does not contain $engine and $policy."
            echo "::error::Check ENGINE_SHA in .github/workflows/production-readiness.yml. See docs/PRODUCTION_READINESS.md, section Bootstrap."
            exit 1
          fi
          echo "Pinned engine: $ENGINE_SHA"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: change/.nvmrc
          cache: npm
          cache-dependency-path: change/package-lock.json

      - name: Install and build
        working-directory: change
        run: |
          npm ci
          npm run build

      - name: Apply migrations to the test database
        working-directory: change
        run: npx tsx scripts/migrate-database.ts apply

      - name: Evaluate the readiness gate
        working-directory: change
        env:
          # Not GITHUB_SHA: GitHub reserves GITHUB_* names and ignores overrides, so
          # the gate read check runs for the merge commit and always timed out.
          PRG_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I ../trusted/production-readiness/scripts/evaluate-gates.py \
            --policy ../trusted/production-readiness/policies/readiness-policy.json \
            --manual-root ../base \
            --repo-root . \
            --out "$RUNNER_TEMP/readiness" \
            --event "$GITHUB_EVENT_NAME" \
            --sha "$PRG_SHA"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readiness-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/readiness/
          if-no-files-found: error
          retention-days: 400
