name: Production readiness gate

# Strict, fail-closed release gate. The rules (policy and engine) come from the
# trusted base branch, not from the change under review, so a pull request
# cannot weaken its own gate. Owner records are also read from the base branch.
#
# pull_request_target is deliberately not used: this job runs the pull request's
# code, so it must not receive write permissions or secrets from the base.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: production-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the change under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: change

      - name: Check out the trusted base (rules and owner records)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: trusted
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: change/.nvmrc
          cache: npm
          cache-dependency-path: change/package-lock.json

      - name: Install and build
        working-directory: change
        run: |
          npm ci
          npm run build

      - name: Apply migrations to the test database
        working-directory: change
        run: npx tsx scripts/migrate-database.ts apply

      - name: Evaluate the readiness gate
        working-directory: change
        env:
          GITHUB_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I ../trusted/production-readiness/scripts/evaluate-gates.py \
            --policy ../trusted/production-readiness/policies/readiness-policy.json \
            --manual-root ../trusted \
            --repo-root . \
            --out "$RUNNER_TEMP/readiness" \
            --sha "$GITHUB_SHA"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readiness-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/readiness/
          if-no-files-found: error
          retention-days: 400
