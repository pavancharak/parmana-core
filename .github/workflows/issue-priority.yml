name: Issue priority

# Every issue needs a level label: high, medium or low. The issue forms ask for
# one, but an issue created through the API or the CLI skips the forms, so this
# workflow asks for one.

on:
  issues:
    types: [opened, reopened, unlabeled]

permissions:
  issues: write

jobs:
  require-priority:
    runs-on: ubuntu-latest
    steps:
      - name: Ask for a level label if none is set
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if printf '%s' "$LABELS" | tr ',' '\n' | grep -qxE 'high|medium|low'; then
            echo "Issue #$NUMBER already has a level label."
            exit 0
          fi
          gh issue comment "$NUMBER" --repo "$REPO" --body "This issue has no priority. Please add one label: \`high\`, \`medium\` or \`low\`."
