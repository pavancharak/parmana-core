name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6"
  # ossf/scorecard-action requires the repository's actual default
  # branch (`main` — see `default_branch` in the repo settings/API).
  # Pushing to any other branch fails the action immediately with
  # "Only the default branch <name> is supported."
  push:
    branches:
      - main

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pin the commit the tag points to, not the annotated tag object.
      # Publishing results (publish_results: true) is verified by the
      # Scorecard API, which rejects a tag-object SHA as an "imposter
      # commit"; the badge then shows "invalid repo path".
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
