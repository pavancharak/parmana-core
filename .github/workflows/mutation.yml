name: Mutation (scheduled)

# Runs mutation testing for every package, once a week and on demand.
# Non-blocking: no pull request depends on this workflow, and it does not
# change any score definition (see docs/assurance/EXECUTION_PLAN.md and
# docs/ASSURANCE_DECISIONS.md, D26).
#
# Runs on GitHub-hosted runners rather than a developer or session container,
# so a run is not lost when a container is reclaimed. Each package runs
# per-file chunks through scripts/mutation-chunked.mjs. The reports are
# uploaded as artifacts for the owner to classify survivors.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        package:
          - crypto
          - api
          - approval
          - capability-registry
          - cli
          - connector-sdk
          - envelope-verifier
          - execution-control
          - execution-gateway
          - execution-system
          - governance-ui
          - policy
          - replay
          - runtime
          - shared
          - storage

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"

      - name: Install workspace
        run: npm ci

      - name: Mutation, one file at a time
        run: node scripts/mutation-chunked.mjs "${{ matrix.package }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.package }}
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 30
