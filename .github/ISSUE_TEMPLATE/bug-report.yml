name: Bug report
description: Something Parmana does not do as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, tokens, private keys or personal data. Redact them first.
        A security problem is not a bug report: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what Parmana did.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "e.g. the commit from `git rev-parse HEAD`"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "e.g. 24.22.1 (output of `node -v`)"
  - type: checkboxes
    id: searched
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and discussions.
          required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent this is. Every issue needs one.
      options:
        - "high (security, data loss, or a documented behaviour that is wrong or blocked)"
        - "medium (should be fixed in the next few releases)"
        - "low (nice to have)"
    validations:
      required: true
