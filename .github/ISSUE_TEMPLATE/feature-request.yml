name: Feature request
description: A change to Parmana that would help you or others.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For a question or an open-ended idea, use Discussions instead. A feature that changes a
        contract or a security property needs an RFC: see docs/internal/REMAINING-WORK.md.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The change you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent this is. Every issue needs one.
      options:
        - "high (security, data loss, or a documented behaviour that is wrong or blocked)"
        - "medium (should be fixed in the next few releases)"
        - "low (nice to have)"
    validations:
      required: true
